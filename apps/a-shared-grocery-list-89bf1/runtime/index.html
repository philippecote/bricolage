<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Household Cart</title>
  <style>
    :root {
      --ink: #24313a;
      --muted: #778087;
      --faint: #aeb4b4;
      --paper: #fffefa;
      --canvas: #f4f2ec;
      --line: #e9e6de;
      --line-strong: #dedbd2;
      --green: #4e7666;
      --green-dark: #315b4d;
      --green-soft: #e9f0eb;
      --gold: #d99b3e;
      --gold-soft: #fff3d9;
      --red: #b76555;
      --shadow: 0 18px 50px rgba(42, 53, 56, .08), 0 2px 8px rgba(42, 53, 56, .04);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(217, 155, 62, .36);
      outline-offset: 2px;
    }

    .app-shell { width: min(100%, 1120px); min-height: 100vh; margin: 0 auto; padding: 30px 34px 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .brand, .top-actions, .member-button, .saved-status, .week-pill, .card-heading, .section-heading, .item-row, .item-meta, .recent-heading, .recent-item, .recent-item-main, .add-form, .search-field, .filters, .stats, .stat, .toast-content, .suggestions, .footer-note { display: flex; align-items: center; }
    .brand { gap: 12px; }
    .brand-mark { position: relative; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 13px; background: var(--green-dark); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 18px rgba(49,91,77,.16); }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; left: 11px; width: 20px; height: 3px; border-radius: 3px; background: #f9d993; transform: rotate(-7deg); }
    .brand-mark::before { top: 15px; box-shadow: 0 7px 0 #f9d993; }
    .brand-mark::after { top: 11px; left: 15px; width: 12px; height: 2px; background: #f9d993; }
    .eyebrow, .week-pill, .section-label, .saved-status, .footer-note { text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 750; }
    .eyebrow { color: var(--green); margin: 0 0 3px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 18px; line-height: 1.1; letter-spacing: -.02em; }
    .top-actions { gap: 12px; position: relative; }
    .saved-status { gap: 7px; color: var(--green); white-space: nowrap; }
    .saved-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #6eaa72; box-shadow: 0 0 0 4px rgba(110, 170, 114, .12); }
    .saved-status.saving { color: var(--muted); }
    .saved-status.saving::before { background: var(--gold); box-shadow: 0 0 0 4px rgba(217,155,62,.14); }
    .saved-status.error { color: var(--red); }
    .saved-status.error::before { background: var(--red); box-shadow: 0 0 0 4px rgba(183,101,85,.14); }
    .member-button { gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(255,254,250,.7); color: var(--muted); padding: 6px 11px 6px 7px; transition: border-color .2s ease, background .2s ease; }
    .member-button:hover { border-color: #b8c8be; background: var(--paper); }
    .member-button strong { color: var(--ink); font-weight: 700; }
    .member-button .chevron { color: var(--faint); font-size: 15px; line-height: 1; margin-left: 1px; }
    .avatar, .mini-avatar { display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--gold-soft); color: #95631d; font-size: 10px; font-weight: 800; }
    .avatar { width: 26px; height: 26px; }
    .mini-avatar { width: 24px; height: 24px; background: var(--green-soft); color: var(--green-dark); }
    .member-menu { position: absolute; z-index: 5; top: 47px; right: 0; width: 218px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper); box-shadow: var(--shadow); }
    .member-menu[hidden] { display: none; }
    .menu-label { padding: 8px 10px 6px; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 750; }
    .member-option { width: 100%; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); text-align: left; padding: 9px 10px; }
    .member-option:hover, .member-option.selected { background: var(--green-soft); }
    .member-option .check { margin-left: auto; color: var(--green); font-weight: 800; }

    .hero { position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; min-height: 140px; padding: 25px 28px; border: 1px solid #eadfca; border-radius: var(--radius-lg); background: #f9efd9; box-shadow: 0 7px 22px rgba(125, 94, 36, .06); }
    .hero::after { content: ""; position: absolute; right: -38px; top: -74px; width: 280px; height: 220px; border: 1px solid rgba(217,155,62,.28); border-radius: 50%; transform: rotate(17deg); box-shadow: -14px 17px 0 rgba(217,155,62,.09), -29px 35px 0 rgba(217,155,62,.06); pointer-events: none; }
    .week-pill { width: fit-content; gap: 6px; color: #9b6d28; margin-bottom: 10px; }
    .week-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
    .hero h2 { max-width: 410px; font-family: Georgia, serif; font-size: clamp(25px, 3vw, 33px); line-height: 1.03; letter-spacing: -.04em; color: #463e31; }
    .hero-copy { color: #846f50; margin-top: 9px; line-height: 1.45; }
    .stats { position: relative; z-index: 1; gap: 12px; }
    .stat { min-width: 92px; flex-direction: column; align-items: flex-start; gap: 2px; padding-left: 14px; border-left: 1px solid rgba(143, 106, 49, .2); }
    .stat strong { color: #493f30; font-size: 25px; line-height: 1; letter-spacing: -.04em; }
    .stat span { color: #8f7855; font-size: 11px; }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, .85fr); gap: 18px; margin-top: 18px; }
    .card { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow); }
    .list-card { padding: 23px 23px 18px; }
    .recent-card { padding: 23px 20px 18px; }
    .card-heading { justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .card-heading h3 { font-size: 18px; letter-spacing: -.025em; }
    .card-heading p { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .primary-button, .ghost-button, .text-button, .suggestion, .restore-button, .clear-button { border: 0; transition: transform .18s ease, background .18s ease, color .18s ease; }
    .primary-button { display: inline-flex; align-items: center; gap: 7px; border-radius: 10px; background: var(--green-dark); color: white; padding: 10px 14px; font-weight: 750; box-shadow: 0 4px 10px rgba(49,91,77,.16); }
    .primary-button:hover { background: #244b3e; transform: translateY(-1px); }
    .primary-button .plus { font-size: 17px; font-weight: 400; line-height: 0; }
    .add-form { gap: 8px; padding: 7px; border: 1px solid var(--line-strong); border-radius: 13px; background: #fbfaf6; }
    .add-form input, .add-form select { min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .add-form input[type="text"] { flex: 1; padding: 8px 8px 8px 10px; font-size: 14px; }
    .add-form input::placeholder { color: #a4a9a5; }
    .add-form select { max-width: 126px; padding: 8px 3px; color: var(--muted); font-size: 12px; }
    .quantity-input { width: 48px; padding: 8px 3px; text-align: center; border-left: 1px solid var(--line) !important; }
    .add-form .submit-button { padding: 9px 13px; border-radius: 9px; font-size: 12px; }
    .suggestions { flex-wrap: wrap; gap: 6px; padding: 10px 3px 0; }
    .suggestion { border: 1px solid #e6e1d7; border-radius: 999px; background: #fffdf8; color: #7a807e; padding: 5px 9px; font-size: 11px; }
    .suggestion:hover { color: var(--green-dark); border-color: #bdd0c3; background: var(--green-soft); }
    .filters { gap: 8px; margin: 20px 0 5px; }
    .search-field { flex: 1; gap: 7px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; color: var(--muted); background: #fff; }
    .search-field:focus-within { border-color: #afc6b7; box-shadow: 0 0 0 3px rgba(78,118,102,.08); }
    .search-field input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 12px; }
    .search-icon { font-size: 17px; line-height: 1; color: #9ea7a2; transform: rotate(-20deg); }
    .category-filter { border: 1px solid var(--line); border-radius: 9px; padding: 8px 8px; color: var(--muted); background: #fff; font-size: 12px; }
    .clear-button { color: var(--muted); background: transparent; font-size: 12px; padding: 5px; }
    .clear-button:hover { color: var(--red); }
    .active-list { min-height: 100px; }
    .section { margin-top: 17px; }
    .section:first-child { margin-top: 10px; }
    .section-heading { gap: 8px; padding: 0 2px 7px; border-bottom: 1px solid var(--line); }
    .section-icon { display: inline-grid; place-items: center; width: 23px; height: 23px; border-radius: 7px; background: var(--green-soft); font-size: 13px; }
    .section-label { color: var(--green); letter-spacing: .1em; }
    .section-count { margin-left: auto; color: var(--faint); font-size: 11px; }
    .item-row { gap: 11px; padding: 11px 3px 10px 2px; border-bottom: 1px solid #f0eee8; animation: row-in .25s ease both; }
    .item-row:last-child { border-bottom: 0; }
    .check-button { display: inline-grid; place-items: center; flex: 0 0 auto; width: 21px; height: 21px; padding: 0; border: 1.5px solid #b8c2bc; border-radius: 50%; background: transparent; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
    .check-button:hover { border-color: var(--green); background: var(--green-soft); transform: scale(1.08); }
    .check-button:active { transform: scale(.94); }
    .check-button::after { content: ""; width: 8px; height: 4px; border-left: 1.5px solid white; border-bottom: 1.5px solid white; transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
    .check-button:hover::after { opacity: .6; }
    .item-main { min-width: 0; flex: 1; }
    .item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; color: #354149; }
    .item-meta { gap: 5px; margin-top: 4px; color: #9aa19e; font-size: 11px; }
    .item-meta .dot { color: #c6c9c5; }
    .quantity { color: var(--green); font-weight: 700; }
    .recent-heading { justify-content: space-between; gap: 10px; margin-bottom: 5px; }
    .recent-heading h3 { font-size: 17px; letter-spacing: -.02em; }
    .recent-heading .spark { color: var(--gold); font-size: 18px; }
    .recent-description { color: var(--muted); font-size: 12px; line-height: 1.4; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .recent-list { min-height: 160px; }
    .recent-item { gap: 9px; padding: 12px 0; border-bottom: 1px solid #f0eee8; }
    .recent-item-main { min-width: 0; flex: 1; gap: 9px; }
    .recent-item-copy { min-width: 0; }
    .recent-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #59645f; font-weight: 600; text-decoration: line-through; text-decoration-color: #bac6bd; }
    .recent-item-meta { margin-top: 3px; color: #a2a8a4; font-size: 10px; }
    .restore-button { flex: 0 0 auto; border-radius: 7px; background: #f3f7f3; color: var(--green); padding: 6px 7px; font-size: 11px; font-weight: 700; }
    .restore-button:hover { background: var(--green-soft); color: var(--green-dark); }
    .empty-state { display: grid; justify-items: center; text-align: center; padding: 32px 15px 24px; color: var(--muted); }
    .empty-icon { display: grid; place-items: center; width: 45px; height: 45px; border-radius: 14px; margin-bottom: 12px; background: var(--green-soft); color: var(--green); font-size: 20px; }
    .empty-state h4 { color: var(--ink); font-size: 14px; margin: 0 0 6px; }
    .empty-state p { max-width: 250px; line-height: 1.45; font-size: 12px; }
    .empty-state .text-button { margin-top: 13px; }
    .text-button { background: transparent; color: var(--green); padding: 0; font-size: 12px; font-weight: 750; }
    .text-button:hover { color: var(--green-dark); text-decoration: underline; }
    .footer-note { justify-content: center; gap: 6px; color: #adb1ab; margin-top: 18px; letter-spacing: .08em; }
    .footer-note .tiny-dot { width: 4px; height: 4px; border-radius: 50%; background: #aebfae; }
    .loading-screen, .error-screen { min-height: 100vh; display: grid; place-items: center; padding: 30px; }
    .loading-box, .error-box { max-width: 360px; text-align: center; padding: 30px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow); }
    .loading-mark { width: 42px; height: 42px; margin: 0 auto 15px; border: 3px solid #dfe9e0; border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
    .loading-box p, .error-box p { color: var(--muted); margin-top: 7px; line-height: 1.45; }
    .error-box h2 { font-size: 18px; }
    .error-box .primary-button { margin-top: 18px; }
    .toast { position: fixed; z-index: 10; left: 50%; bottom: 22px; width: max-content; max-width: calc(100vw - 30px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast-content { gap: 14px; border: 1px solid #48695b; border-radius: 12px; background: #2f4e43; color: white; padding: 10px 12px 10px 14px; box-shadow: 0 12px 28px rgba(35,63,53,.22); }
    .toast-message { font-size: 12px; font-weight: 600; }
    .toast-action { border: 0; border-radius: 7px; background: #e8f0e6; color: var(--green-dark); padding: 6px 9px; font-size: 11px; font-weight: 800; }
    .toast-action:hover { background: white; }
    @keyframes row-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      .app-shell { padding: 22px 17px; }
      .topbar { align-items: flex-start; flex-direction: column; margin-bottom: 20px; }
      .top-actions { width: 100%; justify-content: space-between; }
      .member-menu { top: 43px; right: 0; }
      .hero { align-items: flex-start; flex-direction: column; min-height: 0; padding: 23px; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .workspace { grid-template-columns: 1fr; }
    }
    @media (max-width: 470px) {
      .saved-status { display: none; }
      .add-form { flex-wrap: wrap; }
      .add-form input[type="text"] { flex-basis: calc(100% - 2px); border-bottom: 1px solid var(--line); }
      .add-form select { flex: 1; max-width: none; }
      .add-form .submit-button { flex: 0 0 auto; }
      .category-filter { max-width: 125px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-screen" role="status" aria-live="polite">
      <div class="loading-box"><div class="loading-mark"></div><strong>Opening the household list</strong><p>Loading your shared groceries…</p></div>
    </div>
  </div>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'household-cart-state-v1';
      const CATEGORY_ORDER = ['Produce', 'Dairy & eggs', 'Pantry', 'Bakery', 'Meat & seafood', 'Frozen', 'Drinks', 'Household'];
      const CATEGORY_ICONS = { 'Produce': '✿', 'Dairy & eggs': '◒', 'Pantry': '▤', 'Bakery': '⌁', 'Meat & seafood': '♢', 'Frozen': '❄', 'Drinks': '◌', 'Household': '⌂' };
      const DEFAULT_STATE = { items: [], recent: [], member: 'Alex', members: ['Alex', 'Jamie', 'Sam'] };
      const app = document.getElementById('app');
      const workshop = window.Workshop || {};
      const fallbackStorage = {
        async get(key) { try { const raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (error) { return null; } },
        async set(key, value) { window.localStorage.setItem(key, JSON.stringify(value)); }
      };
      const storage = workshop.storage || window.storage || fallbackStorage;
      const ui = { query: '', category: 'All', memberMenuOpen: false, saving: false, loadError: null };
      let state = clone(DEFAULT_STATE);
      let toastTimer = null;

      function clone(value) { return JSON.parse(JSON.stringify(value)); }
      function id() { return (window.crypto && typeof window.crypto.randomUUID === 'function') ? window.crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
      function esc(value) { return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
      function initials(name) { return String(name || '?').split(/\s+/).map((part) => part[0]).join('').slice(0, 2).toUpperCase(); }
      function safeState(saved) {
        if (!saved || typeof saved !== 'object') return clone(DEFAULT_STATE);
        const members = Array.isArray(saved.members) && saved.members.length ? saved.members.filter(Boolean).slice(0, 8) : clone(DEFAULT_STATE.members);
        return { members, member: members.includes(saved.member) ? saved.member : members[0], items: Array.isArray(saved.items) ? saved.items.filter((item) => item && item.name).map(normalizeItem) : [], recent: Array.isArray(saved.recent) ? saved.recent.filter((item) => item && item.name).map(normalizeItem) : [] };
      }
      function normalizeItem(item) { return { id: item.id || id(), name: String(item.name).trim(), category: CATEGORY_ORDER.includes(item.category) ? item.category : 'Pantry', qty: String(item.qty || '1').trim(), addedBy: item.addedBy || 'Alex', addedAt: item.addedAt || Date.now(), boughtBy: item.boughtBy || null, boughtAt: item.boughtAt || null }; }
      function formatTime(timestamp) { if (!timestamp) return 'recently'; return new Date(timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
      function formatBought(timestamp) {
        if (!timestamp) return 'Recently';
        const date = new Date(timestamp); const now = new Date();
        if (date.toDateString() === now.toDateString()) return 'Today';
        const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
        if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }
      function activeItems() {
        const query = ui.query.trim().toLowerCase();
        return state.items.filter((item) => { const matchesQuery = !query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query); const matchesCategory = ui.category === 'All' || item.category === ui.category; return matchesQuery && matchesCategory; });
      }
      function sortedSections() { const items = activeItems(); return CATEGORY_ORDER.map((category) => ({ category, items: items.filter((item) => item.category === category) })).filter((section) => section.items.length); }
      function notify(message) { if (typeof workshop.notify === 'function') workshop.notify(message); }
      function setTitle(title) { if (typeof workshop.setTitle === 'function') workshop.setTitle(title); document.title = title; }
      function setSaveStatus(status) {
        const node = document.getElementById('save-status'); if (!node) return;
        node.className = 'saved-status' + (status === 'saving' ? ' saving' : status === 'error' ? ' error' : '');
        node.textContent = status === 'saving' ? 'Saving changes' : status === 'error' ? 'Couldn’t save' : 'Saved for everyone';
      }
      async function persist() {
        ui.saving = true; setSaveStatus('saving');
        try { await storage.set(STORAGE_KEY, state); ui.saving = false; setSaveStatus('saved'); }
        catch (error) { ui.saving = false; setSaveStatus('error'); throw error; }
      }
      async function commit(change, message) {
        change(); render();
        try { await persist(); if (message) { notify(message); showToast(message); } }
        catch (error) { showToast('Your change is visible here, but could not be saved yet.'); }
      }
      function showToast(message, actionLabel, action) {
        const toast = document.getElementById('toast'); if (!toast) return;
        toast.innerHTML = '<div class="toast-content"><span class="toast-message"></span>' + (actionLabel ? '<button class="toast-action" type="button"></button>' : '') + '</div>';
        toast.querySelector('.toast-message').textContent = message;
        if (actionLabel) { const button = toast.querySelector('.toast-action'); button.textContent = actionLabel; button.addEventListener('click', () => { if (action) action(); toast.classList.remove('show'); }); }
        toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), actionLabel ? 6500 : 2800);
      }
      function renderLoading() { app.innerHTML = '<div class="loading-screen" role="status" aria-live="polite"><div class="loading-box"><div class="loading-mark"></div><strong>Opening the household list</strong><p>Loading your shared groceries…</p></div></div>'; }
      function renderError() { app.innerHTML = '<div class="error-screen"><div class="error-box" role="alert"><div class="empty-icon" style="margin:0 auto 14px">!</div><h2>We couldn’t open the list</h2><p>Give it another try. Your household list will be here when it reconnects.</p><button class="primary-button" id="retry-button" type="button">Try again</button></div></div>'; document.getElementById('retry-button').addEventListener('click', init); }
      function render() {
        const activeCount = state.items.length; const recentCount = state.recent.length; const member = state.member || state.members[0];
        app.innerHTML = `
          <main class="app-shell">
            <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><p class="eyebrow">Our kitchen</p><h1>Household Cart</h1></div></div>
              <div class="top-actions"><div id="save-status" class="saved-status">Saved for everyone</div><button class="member-button" id="member-button" type="button" aria-expanded="${ui.memberMenuOpen}" aria-controls="member-menu"><span class="avatar">${esc(initials(member))}</span><span>Shopping as <strong>${esc(member)}</strong></span><span class="chevron">⌄</span></button>
                <div class="member-menu" id="member-menu" ${ui.memberMenuOpen ? '' : 'hidden'}><div class="menu-label">Who’s adding?</div>${state.members.map((person) => `<button class="member-option ${person === member ? 'selected' : ''}" type="button" data-action="member" data-member="${esc(person)}"><span class="mini-avatar">${esc(initials(person))}</span><span>${esc(person)}</span>${person === member ? '<span class="check">✓</span>' : ''}</button>`).join('')}</div>
              </div>
            </header>
            <section class="hero" aria-labelledby="hero-title"><div><div class="week-pill">This week’s shop</div><h2 id="hero-title">Keep the kitchen moving.</h2><p class="hero-copy">One list for the little things that keep everyone fed.</p></div><div class="stats" aria-label="List summary"><div class="stat"><strong>${activeCount}</strong><span>${activeCount === 1 ? 'thing to pick up' : 'things to pick up'}</span></div><div class="stat"><strong>${recentCount}</strong><span>${recentCount === 1 ? 'recent buy' : 'recent buys'}</span></div></div></section>
            <div class="workspace">
              <section class="card list-card" aria-labelledby="list-title"><div class="card-heading"><div><h3 id="list-title">On the list</h3><p>${activeCount ? 'Tap an item when it makes it into the basket.' : 'Start with what the household needs next.'}</p></div><button class="primary-button" id="focus-add" type="button"><span class="plus">+</span> Add item</button></div>
                <form class="add-form" id="add-form"><input id="item-name" name="name" type="text" autocomplete="off" placeholder="Add something…" aria-label="Item name" required><select id="item-category" name="category" aria-label="Item section">${CATEGORY_ORDER.map((category) => `<option value="${esc(category)}">${esc(category)}</option>`).join('')}</select><input class="quantity-input" name="qty" type="text" inputmode="text" placeholder="Qty" aria-label="Quantity"><button class="primary-button submit-button" type="submit">Add</button></form>
                <div class="suggestions" aria-label="Quick add suggestions"><button class="suggestion" type="button" data-suggest="Milk" data-category="Dairy & eggs">Milk</button><button class="suggestion" type="button" data-suggest="Bananas" data-category="Produce">Bananas</button><button class="suggestion" type="button" data-suggest="Bread" data-category="Bakery">Bread</button><button class="suggestion" type="button" data-suggest="Coffee" data-category="Pantry">Coffee</button></div>
                <div class="filters"><label class="search-field"><span class="search-icon" aria-hidden="true">⌕</span><input id="search-items" type="search" placeholder="Search the list" aria-label="Search the list" value="${esc(ui.query)}"></label><select class="category-filter" id="category-filter" aria-label="Filter by section"><option value="All">All sections</option>${CATEGORY_ORDER.map((category) => `<option value="${esc(category)}" ${ui.category === category ? 'selected' : ''}>${esc(category)}</option>`).join('')}</select>${ui.query || ui.category !== 'All' ? '<button class="clear-button" id="clear-filters" type="button">Clear</button>' : ''}</div>
                <div class="active-list" id="active-list" aria-live="polite"></div></section>
              <aside class="card recent-card" aria-labelledby="recent-title"><div class="recent-heading"><h3 id="recent-title">Recently bought</h3><span class="spark" aria-hidden="true">✦</span></div><p class="recent-description">Finished items land here so they’re easy to add back next week.</p><div class="recent-list" id="recent-list" aria-live="polite"></div></aside>
            </div>
            <div class="footer-note"><span class="tiny-dot"></span><span>Shared with ${state.members.length} household members</span><span class="tiny-dot"></span></div>
          </main><div class="toast" id="toast" role="status" aria-live="polite"></div>`;
        renderActiveItems(); renderRecentItems(); bindEvents(); if (ui.saving) setSaveStatus('saving');
      }
      function renderActiveItems() {
        const node = document.getElementById('active-list'); if (!node) return; const sections = sortedSections();
        if (!state.items.length) { node.innerHTML = '<div class="empty-state"><div class="empty-icon" aria-hidden="true">✦</div><h4>The list is ready for groceries</h4><p>Add the first item above and your household can pick up from there.</p><button class="text-button" type="button" data-action="focus-add">Add your first item →</button></div>'; return; }
        if (!sections.length) { node.innerHTML = '<div class="empty-state"><div class="empty-icon" aria-hidden="true">⌕</div><h4>Nothing matches that search</h4><p>Try another name or clear the filters to see everything.</p><button class="text-button" type="button" data-action="clear-filters">Clear filters →</button></div>'; return; }
        node.innerHTML = sections.map((section) => { const slug = section.category.replace(/[^a-z0-9]+/gi, '-').toLowerCase(); return `<section class="section" aria-labelledby="section-${slug}"><div class="section-heading"><span class="section-icon" aria-hidden="true">${CATEGORY_ICONS[section.category]}</span><span class="section-label" id="section-${slug}">${esc(section.category)}</span><span class="section-count">${section.items.length}</span></div>${section.items.map(itemRow).join('')}</section>`; }).join('');
      }
      function itemRow(item) { return `<div class="item-row"><button class="check-button" type="button" data-action="buy" data-id="${esc(item.id)}" aria-label="Mark ${esc(item.name)} as bought"></button><div class="item-main"><div class="item-name">${esc(item.name)}</div><div class="item-meta"><span class="quantity">${esc(item.qty || '1')}</span><span class="dot">•</span><span>Added by ${esc(item.addedBy)}</span><span class="dot">•</span><span>${esc(formatTime(item.addedAt))}</span></div></div></div>`; }
      function renderRecentItems() {
        const node = document.getElementById('recent-list'); if (!node) return;
        if (!state.recent.length) { node.innerHTML = '<div class="empty-state"><div class="empty-icon" aria-hidden="true">✓</div><h4>Your basket is still empty</h4><p>Items you check off will collect here for an easy repeat.</p></div>'; return; }
        node.innerHTML = state.recent.slice(0, 8).map((item) => `<div class="recent-item"><div class="recent-item-main"><span class="mini-avatar">${esc(initials(item.boughtBy || item.addedBy))}</span><div class="recent-item-copy"><div class="recent-item-name">${esc(item.name)}</div><div class="recent-item-meta">${esc(item.qty || '1')} · ${esc(formatBought(item.boughtAt))}</div></div></div><button class="restore-button" type="button" data-action="restore" data-id="${esc(item.id)}" aria-label="Add ${esc(item.name)} back to the list">Add back</button></div>`).join('');
        if (state.recent.length > 8) node.innerHTML += '<p style="color:var(--faint);font-size:11px;margin:12px 0 0">Showing the latest 8 buys</p>';
      }
      function bindEvents() {
        document.getElementById('member-button').addEventListener('click', () => { ui.memberMenuOpen = !ui.memberMenuOpen; render(); });
        document.getElementById('add-form').addEventListener('submit', onAdd); document.getElementById('focus-add').addEventListener('click', focusAdd);
        document.getElementById('search-items').addEventListener('input', (event) => { ui.query = event.target.value; renderActiveItems(); });
        document.getElementById('category-filter').addEventListener('change', (event) => { ui.category = event.target.value; render(); });
        const clear = document.getElementById('clear-filters'); if (clear) clear.addEventListener('click', clearFilters);
        document.querySelectorAll('[data-suggest]').forEach((button) => button.addEventListener('click', () => { const input = document.getElementById('item-name'); input.value = button.dataset.suggest; document.getElementById('item-category').value = button.dataset.category; input.focus(); }));
        document.querySelectorAll('[data-action="member"]').forEach((button) => button.addEventListener('click', () => { const person = button.dataset.member; ui.memberMenuOpen = false; commit(() => { state.member = person; }, `Now shopping as ${person}`); }));
        document.querySelectorAll('[data-action="buy"]').forEach((button) => button.addEventListener('click', () => completeItem(button.dataset.id)));
        document.querySelectorAll('[data-action="restore"]').forEach((button) => button.addEventListener('click', () => restoreItem(button.dataset.id)));
        document.querySelectorAll('[data-action="focus-add"]').forEach((button) => button.addEventListener('click', focusAdd));
        document.querySelectorAll('[data-action="clear-filters"]').forEach((button) => button.addEventListener('click', clearFilters));
      }
      function focusAdd() { const input = document.getElementById('item-name'); if (input) { input.focus(); input.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
      function clearFilters() { ui.query = ''; ui.category = 'All'; render(); }
      async function onAdd(event) {
        event.preventDefault(); const form = event.currentTarget; const name = form.elements.name.value.trim(); if (!name) return;
        const category = form.elements.category.value; const qty = form.elements.qty.value.trim() || '1'; const existing = state.items.find((item) => item.name.toLowerCase() === name.toLowerCase());
        if (existing) { showToast(`${existing.name} is already on the list`); return; }
        await commit(() => { state.items.unshift({ id: id(), name, category, qty, addedBy: state.member, addedAt: Date.now() }); }, `${name} added to the list`);
        const input = document.getElementById('item-name'); if (input) input.focus();
      }
      async function completeItem(itemId) {
        const index = state.items.findIndex((item) => item.id === itemId); if (index < 0) return; const item = state.items[index];
        await commit(() => { state.items.splice(index, 1); state.recent.unshift({ ...item, boughtBy: state.member, boughtAt: Date.now() }); }, null);
        showToast(`${item.name} moved to recent buys`, 'Undo', () => restoreUndo(item.id)); notify(`${item.name} moved to recent buys`);
      }
      async function restoreUndo(itemId) { await restoreItem(itemId); }
      async function restoreItem(itemId) {
        const recentIndex = state.recent.findIndex((item) => item.id === itemId); if (recentIndex < 0) return; const item = state.recent[recentIndex];
        await commit(() => { state.recent.splice(recentIndex, 1); state.items.unshift({ id: item.id, name: item.name, category: item.category, qty: item.qty, addedBy: state.member, addedAt: Date.now() }); }, `${item.name} added back to the list`);
      }
      async function init() {
        setTitle('Household Cart'); renderLoading();
        try { const saved = await storage.get(STORAGE_KEY); state = safeState(saved); ui.loadError = null; render(); }
        catch (error) { ui.loadError = error; renderError(); }
      }
      init();
    })();
  </script>
</body>
</html>
