<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <style>
    :root{color-scheme:light;--paper:#f4efe6;--deep:#e8ddce;--ink:#25211d;--muted:#7c736a;--line:rgba(37,33,29,.17);--accent:#d85f42;--soft:rgba(216,95,66,.12);--shadow:0 24px 70px rgba(75,56,39,.12)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-width:320px;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 14% 12%,rgba(255,255,255,.85),transparent 28%),linear-gradient(135deg,var(--paper),#f8f4ed 56%,var(--deep));color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}
    .app-shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:26px 38px 24px;isolation:isolate}.app-shell:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.28;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.11'/%3E%3C/svg%3E")}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;opacity:0;transform:translateY(-8px);animation:arrive .55s ease-out forwards}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%;color:var(--accent);font:700 20px/1 Georgia,serif;transform:rotate(-8deg)}h1{margin:0;font:500 clamp(21px,2.6vw,29px)/1 Georgia,serif;letter-spacing:-.04em}
    .reset-scores{appearance:none;border:0;padding:8px 0;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;transition:color .18s,transform .18s}.reset-scores:hover{color:var(--ink);transform:translateY(-1px)}.reset-scores:focus-visible,.cell:focus-visible,.new-round:focus-visible{outline:3px solid rgba(216,95,66,.3);outline-offset:4px}
    main{display:grid;grid-template-columns:minmax(150px,.72fr) minmax(300px,430px) minmax(150px,.72fr);align-items:center;justify-content:center;gap:clamp(28px,5vw,70px);width:min(100%,1040px);margin:0 auto;padding:22px 0 14px}.player{min-width:0;opacity:0;animation:arrive .6s .14s ease-out forwards}.player:last-child{text-align:right;animation-delay:.22s}.player-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.player:last-child .player-label{justify-content:flex-end}.turn-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .25s,box-shadow .25s}.player.active .turn-dot{background:var(--accent);box-shadow:0 0 0 5px var(--soft)}.score{margin-top:5px;font:500 clamp(62px,8vw,98px)/.92 Georgia,serif;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.player-symbol{margin-top:10px;color:var(--accent);font:italic 20px/1 Georgia,serif}.player:last-child .player-symbol{color:var(--ink)}
    .game{display:grid;justify-items:center;gap:18px;opacity:0;transform:translateY(12px) scale(.985);animation:board-in .7s .08s cubic-bezier(.2,.8,.2,1) forwards}.eyebrow{min-height:18px;margin:0;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.13em;text-align:center;text-transform:uppercase}.status{margin:-10px 0 0;font:500 clamp(25px,3.4vw,36px)/1.1 Georgia,serif;letter-spacing:-.04em;text-align:center}.board-wrap{width:min(42vw,340px);min-width:286px;aspect-ratio:1;padding:15px;border-radius:32px;background:rgba(255,253,249,.58);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.9)}.board{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%}
    .cell{appearance:none;display:grid;place-items:center;border:0;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);background:transparent;color:var(--accent);cursor:pointer;font:500 clamp(48px,6vw,68px)/1 Georgia,serif;transition:background .16s}.cell:nth-child(3n){border-right:0}.cell:nth-child(n+7){border-bottom:0}.cell:nth-child(1){border-radius:18px 0 0}.cell:nth-child(3){border-radius:0 18px 0 0}.cell:nth-child(7){border-radius:0 0 0 18px}.cell:nth-child(9){border-radius:0 0 18px}.cell:not(:disabled):hover{background:var(--soft)}.cell:disabled{cursor:default}.cell[data-mark="O"]{color:var(--ink)}.cell.winner{background:var(--soft)}.mark{display:inline-block;animation:mark-in .25s cubic-bezier(.2,.85,.32,1.35) both}
    .actions{height:40px;display:grid;place-items:center}.new-round{appearance:none;border:1px solid var(--ink);border-radius:999px;padding:9px 18px 10px;background:var(--ink);color:#fffaf3;cursor:pointer;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .22s,transform .22s,background .18s}.new-round.visible{opacity:1;pointer-events:auto;transform:none}.new-round:hover{background:var(--accent);border-color:var(--accent)}
    footer{display:flex;justify-content:space-between;gap:24px;color:var(--muted);font-size:11px;line-height:1.4;opacity:0;animation:arrive .55s .32s ease-out forwards}footer span:last-child{text-align:right}.error-banner{position:fixed;right:20px;bottom:20px;max-width:310px;padding:11px 15px;border-radius:12px;background:var(--ink);color:white;box-shadow:var(--shadow);font-size:12px;transform:translateY(16px);opacity:0;pointer-events:none;transition:.25s}.error-banner.visible{transform:none;opacity:1}
    @keyframes arrive{to{opacity:1;transform:translateY(0)}}@keyframes board-in{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes mark-in{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:scale(1)}}
    @media(max-width:700px){.app-shell{padding:22px 22px 18px}main{grid-template-columns:1fr 1fr;gap:15px 28px;padding-top:28px}.game{grid-column:1/-1;grid-row:1}.player{grid-row:2;padding:0 12px}.player:last-child{grid-column:2}.score{font-size:48px}.board-wrap{width:min(76vw,330px);min-width:260px}.player-symbol{display:none}}
    @media(max-height:610px) and (min-width:701px){.app-shell{padding-top:18px;padding-bottom:15px}main{padding:10px 0 6px}.game{gap:12px}.board-wrap{width:min(39vw,310px)}.actions{height:34px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header><div class="brand"><div class="brand-mark" aria-hidden="true">×</div><h1>Tic-Tac-Toe</h1></div><button class="reset-scores" id="resetScores" type="button">Reset scores</button></header>
    <main aria-labelledby="gameStatus">
      <section class="player active" id="playerX" aria-label="Player X score"><div class="player-label"><span class="turn-dot" aria-hidden="true"></span>Player X</div><div class="score" id="scoreX">0</div><div class="player-symbol" aria-hidden="true">crosses</div></section>
      <section class="game" aria-label="Tic-tac-toe game"><p class="eyebrow" id="roundLabel">Loading saved game…</p><h2 class="status" id="gameStatus" aria-live="polite">Getting the board ready</h2><div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div></div><div class="actions"><button class="new-round" id="newRound" type="button">Play next round</button></div></section>
      <section class="player" id="playerO" aria-label="Player O score"><div class="player-label">Player O<span class="turn-dot" aria-hidden="true"></span></div><div class="score" id="scoreO">0</div><div class="player-symbol" aria-hidden="true">circles</div></section>
    </main>
    <footer><span>Two players · one device</span><span>Use arrow keys to move · Enter to place</span></footer>
  </div>
  <div class="error-banner" id="errorBanner" role="alert">Scores couldn’t be saved. You can keep playing.</div>
  <script>
  (()=>{'use strict';
    const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],KEY='tic-tac-toe-scores',workshop=window.Workshop;
    const el={board:document.getElementById('board'),status:document.getElementById('gameStatus'),round:document.getElementById('roundLabel'),scoreX:document.getElementById('scoreX'),scoreO:document.getElementById('scoreO'),playerX:document.getElementById('playerX'),playerO:document.getElementById('playerO'),next:document.getElementById('newRound'),reset:document.getElementById('resetScores'),error:document.getElementById('errorBanner')};
    let board=Array(9).fill(''),current='X',over=false,round=1,scores={X:0,O:0},errorTimer;
    function createBoard(){const fragment=document.createDocumentFragment();for(let i=0;i<9;i+=1){const cell=document.createElement('button'),row=Math.floor(i/3)+1,column=i%3+1;cell.type='button';cell.className='cell';cell.dataset.index=String(i);cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',`Row ${row}, column ${column}, empty`);cell.addEventListener('click',()=>play(i));cell.addEventListener('keydown',handleKeys);fragment.appendChild(cell)}el.board.replaceChildren(fragment)}
    function handleKeys(event){const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3};if(!(event.key in offsets))return;event.preventDefault();const i=Number(event.currentTarget.dataset.index);let next=i+offsets[event.key];if(event.key==='ArrowLeft'&&i%3===0)next=i+2;if(event.key==='ArrowRight'&&i%3===2)next=i-2;if(next<0)next+=9;if(next>8)next-=9;el.board.children[next].focus()}
    function play(i){if(over||board[i])return;board[i]=current;const cell=el.board.children[i];cell.dataset.mark=current;cell.innerHTML=`<span class="mark" aria-hidden="true">${current==='X'?'×':'○'}</span>`;cell.setAttribute('aria-label',cell.getAttribute('aria-label').replace(', empty',`, ${current}`));cell.disabled=true;const line=LINES.find(item=>item.every(index=>board[index]===current));if(line){finish(current,line);return}if(board.every(Boolean)){finish(null,[]);return}current=current==='X'?'O':'X';updateTurn()}
    function finish(winner,line){over=true;Array.from(el.board.children).forEach(cell=>{cell.disabled=true});if(winner){line.forEach(i=>el.board.children[i].classList.add('winner'));scores[winner]+=1;el.status.textContent=`Player ${winner} wins`;el.round.textContent='Three in a row';notify(`Player ${winner} wins round ${round}`)}else{el.status.textContent='A perfect draw';el.round.textContent='Board complete';notify(`Round ${round} is a draw`)}renderScores();el.next.classList.add('visible');save()}
    function start({focus=false}={}){board=Array(9).fill('');current=round%2?'X':'O';over=false;Array.from(el.board.children).forEach((cell,i)=>{cell.disabled=false;cell.textContent='';cell.classList.remove('winner');delete cell.dataset.mark;cell.setAttribute('aria-label',`Row ${Math.floor(i/3)+1}, column ${i%3+1}, empty`)});el.next.classList.remove('visible');updateTurn();if(focus)el.board.children[0].focus()}
    function updateTurn(){el.status.textContent=`Player ${current}, your turn`;el.round.textContent=`Round ${round}`;el.playerX.classList.toggle('active',current==='X');el.playerO.classList.toggle('active',current==='O')}
    function renderScores(){el.scoreX.textContent=String(scores.X);el.scoreO.textContent=String(scores.O)}
    async function save(){if(!workshop?.storage?.set)return;try{await workshop.storage.set(KEY,{scores,round})}catch(error){showError();console.warn('Unable to save scores',error)}}
    async function load(){if(!workshop?.storage?.get)return;try{const saved=await workshop.storage.get(KEY);if(saved?.scores){scores.X=Number.isFinite(saved.scores.X)?saved.scores.X:0;scores.O=Number.isFinite(saved.scores.O)?saved.scores.O:0;round=Number.isInteger(saved.round)&&saved.round>0?saved.round:1}}catch(error){showError();console.warn('Unable to load scores',error)}}
    function showError(){clearTimeout(errorTimer);el.error.classList.add('visible');errorTimer=setTimeout(()=>el.error.classList.remove('visible'),3600)}function notify(message){try{workshop?.notify?.(message)}catch(error){console.warn('Notification unavailable',error)}}
    el.next.addEventListener('click',()=>{round+=1;start({focus:true});save()});el.reset.addEventListener('click',()=>{scores={X:0,O:0};round=1;renderScores();start();save();notify('Scores reset')});
    async function init(){try{workshop?.setTitle?.('Tic-Tac-Toe')}catch(error){console.warn('Title unavailable',error)}createBoard();await load();renderScores();start()}init();
  })();
  </script>
</body>
</html>
