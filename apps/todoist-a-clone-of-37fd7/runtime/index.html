<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Today · Todoist</title>
  <style>
    :root {
      --red: #e44332; --red-dark: #c93627; --ink: #202020; --muted: #6b6b6b; --faint: #8f8f8f;
      --line: #eeeae7; --paper: #fff; --sidebar: #faf9f8; --soft: #f6f5f3; --hover: #f1efed;
      --shadow: 0 18px 50px rgba(30,24,20,.16), 0 3px 12px rgba(30,24,20,.08); --nav-width: 264px; --topbar-height: 52px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    body { color: var(--ink); background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid rgba(228,67,50,.52); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app-shell { height: 100vh; min-height: 600px; overflow: hidden; background: var(--paper); }
    .topbar { height: var(--topbar-height); display: flex; align-items: center; padding: 0 16px; gap: 14px; color: #fff; background: linear-gradient(105deg,#db4035 0%,#e44332 52%,#e94e35 100%); position: relative; z-index: 20; }
    .topbar button { border: 0; background: transparent; cursor: pointer; }
    .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 7px; color: inherit; }
    .icon-btn:hover { background: rgba(255,255,255,.15); }
    .menu-btn { margin-left: -5px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
    .brand-mark { width: 22px; height: 22px; } .brand-word { font-size: 15px; }
    .topbar-spacer { flex: 1; } .topbar-actions { display: flex; align-items: center; gap: 5px; }
    .search-trigger { width: 32px; height: 32px; } .search-trigger:hover { background: rgba(255,255,255,.15); }
    .add-top { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 7px; font-weight: 650; } .add-top:hover { background: rgba(255,255,255,.15); }
    .avatar { width: 27px; height: 27px; border-radius: 50%; margin-left: 8px; display: grid; place-items: center; background: #f7b4a9; color: #8b3028; font-size: 11px; font-weight: 750; }
    .app-body { display: flex; height: calc(100vh - var(--topbar-height)); min-height: 548px; }
    .sidebar { width: var(--nav-width); flex: 0 0 var(--nav-width); background: var(--sidebar); border-right: 1px solid var(--line); overflow: auto; padding: 17px 11px 22px; transition: transform .2s ease, margin-left .2s ease; }
    .workspace-switcher { display: flex; align-items: center; gap: 9px; padding: 7px 10px 18px; }
    .workspace-logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: #e44332; font-weight: 800; font-size: 13px; }
    .workspace-name { line-height: 1.15; min-width: 0; flex: 1; } .workspace-name strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .workspace-name span { display: block; color: var(--faint); font-size: 11px; margin-top: 3px; }
    .workspace-chevron { color: #a7a19c; }
    .nav-section { margin-top: 7px; } .nav-label { color: #9c9691; padding: 10px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .nav-item { width: 100%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 11px; min-height: 37px; padding: 8px 11px; border-radius: 6px; text-align: left; color: #514e4b; position: relative; }
    .nav-item:hover { background: var(--hover); color: var(--ink); } .nav-item.active { background: #fce9e6; color: var(--red-dark); font-weight: 650; }
    .nav-item .nav-icon { width: 18px; height: 18px; color: #8b8681; flex: 0 0 18px; } .nav-item.active .nav-icon { color: var(--red); }
    .nav-item .nav-count { margin-left: auto; color: #9c9691; font-size: 12px; } .nav-item.active .nav-count { color: var(--red-dark); }
    .project-list { margin-top: 2px; } .project-dot { width: 9px; height: 9px; border: 2px solid currentColor; border-radius: 50%; flex: 0 0 9px; } .project-dot.blue { color: #5297cf; } .project-dot.yellow { color: #e5a52b; } .project-dot.teal { color: #42a891; } .project-dot.purple { color: #8b6eb9; }
    .sidebar-footer { margin: 20px 4px 0; border-top: 1px solid var(--line); padding-top: 15px; } .sidebar-footer button { width: 100%; border: 0; background: transparent; display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 6px; color: #79736f; cursor: pointer; text-align: left; } .sidebar-footer button:hover { background: var(--hover); color: var(--ink); }
    .main-content { flex: 1; min-width: 0; overflow: auto; background: #fff; } .content-wrap { width: min(100%,880px); margin: 0 auto; padding: 40px 60px 56px; }
    .content-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 27px; } .eyebrow { display: flex; align-items: center; gap: 7px; color: var(--red); font-size: 12px; font-weight: 650; margin-bottom: 7px; } .today-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    h1 { font-size: 27px; line-height: 1.1; letter-spacing: -.7px; margin: 0; font-weight: 750; } .date-line { margin-top: 7px; color: var(--faint); font-size: 13px; }
    .header-actions { display: flex; align-items: center; gap: 3px; margin-top: -3px; } .header-icon { color: #8b8681; border: 0; background: transparent; border-radius: 6px; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; } .header-icon:hover { background: var(--soft); color: var(--ink); }
    .task-section { margin-top: 23px; } .section-heading { color: #85807b; font-size: 12px; font-weight: 700; margin: 0 0 3px; } .section-heading.overdue { color: #d04a3d; }
    .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 8px 14px 0; border-bottom: 1px solid var(--line); position: relative; min-height: 64px; animation: row-in .24s ease both; } .task-row:hover { background: linear-gradient(90deg,transparent 0,transparent 5px,#fcfbfa 5px,#fcfbfa 100%); }
    .task-check { width: 20px; height: 20px; margin: 1px 0 0; border-radius: 50%; border: 1.5px solid #b4afaa; background: white; cursor: pointer; flex: 0 0 20px; display: grid; place-items: center; color: transparent; transition: background .15s,border .15s,color .15s,transform .15s; } .task-check:hover { border-color: var(--red); background: #fff7f5; } .task-check.done { background: var(--red); border-color: var(--red); color: white; transform: scale(.94); }
    .task-main { min-width: 0; flex: 1; } .task-title { border: 0; background: transparent; padding: 0; color: #292725; cursor: pointer; text-align: left; font-size: 14px; line-height: 1.4; display: block; max-width: 100%; } .task-title:hover { color: var(--red-dark); } .task-row.completed .task-title { color: #9c9691; text-decoration: line-through; }
    .task-details { margin: 3px 0 0; color: #8a8580; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 590px; } .task-meta { display: flex; align-items: center; gap: 9px; margin-top: 5px; color: #a09994; font-size: 11px; } .due { display: inline-flex; align-items: center; gap: 4px; } .due.overdue { color: #d04a3d; } .due.today { color: #4c9b70; }
    .priority { width: 14px; height: 14px; display: inline-grid; place-items: center; color: var(--red); } .priority.p2 { color: #eb9b27; } .priority.p3 { color: #5297cf; } .priority.p4 { color: #a7a19c; }
    .task-project { display: inline-flex; align-items: center; gap: 4px; } .mini-dot { width: 6px; height: 6px; border-radius: 50%; background: #5297cf; } .mini-dot.personal { background: #e5a52b; } .mini-dot.work { background: #5297cf; } .mini-dot.health { background: #42a891; } .mini-dot.learning { background: #8b6eb9; }
    .task-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; } .task-row:hover .task-actions, .task-row:focus-within .task-actions { opacity: 1; } .task-actions button { width: 29px; height: 29px; border: 0; border-radius: 5px; background: transparent; color: #9a948f; cursor: pointer; display: grid; place-items: center; } .task-actions button:hover { background: var(--hover); color: var(--ink); }
    .completed-toggle { border: 0; background: transparent; color: #a29c97; cursor: pointer; padding: 13px 0; font-size: 12px; } .completed-toggle:hover { color: var(--red-dark); } .task-composer { display: flex; gap: 12px; align-items: center; padding: 17px 0 4px; color: #8c8681; cursor: pointer; } .composer-plus { width: 20px; height: 20px; border-radius: 50%; color: var(--red); display: grid; place-items: center; } .task-composer:hover .composer-label { color: var(--red); } .composer-label { font-size: 14px; }
    .empty-state, .error-state { min-height: 280px; display: grid; place-items: center; text-align: center; padding: 40px 20px; color: var(--muted); } .empty-illustration { width: 86px; height: 86px; display: grid; place-items: center; border-radius: 50%; background: #fff5f2; color: var(--red); margin: 0 auto 17px; } .empty-state h2, .error-state h2 { margin: 0 0 6px; font-size: 17px; color: var(--ink); } .empty-state p, .error-state p { margin: 0 auto 18px; max-width: 300px; line-height: 1.5; font-size: 13px; }
    .primary-btn { border: 0; border-radius: 6px; background: var(--red); color: #fff; cursor: pointer; font-weight: 650; padding: 9px 14px; box-shadow: 0 2px 5px rgba(228,67,50,.2); } .primary-btn:hover { background: var(--red-dark); } .error-icon { color: var(--red); margin-bottom: 13px; }
    .skeleton { border-radius: 4px; background: linear-gradient(90deg,#f3f1ef,#faf9f8,#f3f1ef); background-size: 220% 100%; animation: shimmer 1.2s ease infinite; } .skeleton-heading { width: 100px; height: 12px; margin-bottom: 13px; } .skeleton-row { height: 65px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; } .skeleton-circle { width: 20px; height: 20px; border-radius: 50%; } .skeleton-line { display: block; height: 10px; width: 45%; } .skeleton-line.small { width: 22%; margin-top: 8px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(39,32,29,.37); display: grid; place-items: center; padding: 20px; animation: fade-in .15s ease both; } .modal { width: min(100%,545px); background: #fff; border-radius: 9px; box-shadow: var(--shadow); animation: modal-in .18s ease both; overflow: hidden; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 19px 21px 16px; border-bottom: 1px solid var(--line); } .modal-header h2 { font-size: 17px; letter-spacing: -.2px; margin: 0; } .close-btn { width: 29px; height: 29px; display: grid; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #8e8883; cursor: pointer; } .close-btn:hover { background: var(--soft); color: var(--ink); }
    .modal-form { padding: 19px 21px 21px; } .form-field { margin-bottom: 15px; } .form-field label { display: block; font-size: 11px; color: #716b66; font-weight: 700; margin-bottom: 6px; } .form-field input, .form-field textarea, .form-field select { width: 100%; border: 1px solid #ded9d5; border-radius: 6px; padding: 10px 11px; color: var(--ink); background: #fff; } .form-field input::placeholder, .form-field textarea::placeholder { color: #aaa39e; } .form-field input:hover, .form-field textarea:hover, .form-field select:hover { border-color: #beb7b2; } .form-field textarea { resize: vertical; min-height: 66px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; } .priority-picker { display: flex; gap: 5px; } .priority-option { flex: 1; border: 1px solid #ded9d5; background: #fff; color: #8a837e; border-radius: 5px; padding: 8px 5px; cursor: pointer; font-size: 11px; } .priority-option:hover { border-color: #bdb5b0; } .priority-option.selected { background: #fff1ef; border-color: #f1aaa2; color: var(--red-dark); font-weight: 700; }
    .quick-add-hint { margin-top: -7px; margin-bottom: 9px; color: #9a938e; font-size: 11px; line-height: 1.45; } .quick-add-hint kbd { display: inline-block; padding: 1px 4px; border: 1px solid #e1dbd7; border-radius: 3px; background: #faf9f8; color: #6f6863; font: inherit; font-weight: 700; } .quick-add-preview { min-height: 22px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: -4px; margin-bottom: 12px; } .shortcut-chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px; border-radius: 4px; background: #f7f4f2; color: #716a65; font-size: 11px; } .shortcut-chip.priority-chip { background: #fff0ed; color: var(--red-dark); } .shortcut-chip.label-chip { background: #f1f6fb; color: #4b779d; }
    .color-picker { display: flex; align-items: center; gap: 8px; padding: 3px 0; } .color-option { width: 27px; height: 27px; padding: 0; border: 2px solid transparent; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; } .color-option:hover { background: #f4f1ef; } .color-option.selected { border-color: #49433f; } .color-swatch { width: 13px; height: 13px; border-radius: 50%; display: block; } .color-swatch.blue { background: #5297cf; } .color-swatch.yellow { background: #e5a52b; } .color-swatch.teal { background: #42a891; } .color-swatch.purple { background: #8b6eb9; } .form-error { min-height: 16px; margin-top: 5px; color: #c93627; font-size: 11px; }
    .modal-footer { display: flex; justify-content: flex-end; align-items: center; gap: 9px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 5px; } .secondary-btn { border: 1px solid #ded9d5; border-radius: 6px; background: #fff; color: #6f6965; cursor: pointer; font-weight: 600; padding: 9px 13px; } .secondary-btn:hover { background: var(--soft); color: var(--ink); }
    .search-popover { position: fixed; z-index: 50; top: 58px; left: 50%; transform: translateX(-50%); width: min(550px,calc(100% - 30px)); background: #fff; border-radius: 8px; box-shadow: var(--shadow); padding: 12px; animation: modal-in .16s ease both; } .search-input-wrap { display: flex; gap: 9px; align-items: center; border: 1px solid #ddd7d3; border-radius: 6px; padding: 0 10px; color: #958e89; } .search-input-wrap input { flex: 1; border: 0; outline: 0; padding: 10px 0; color: var(--ink); } .search-results { max-height: 330px; overflow: auto; margin-top: 8px; } .search-result { width: 100%; text-align: left; display: flex; gap: 10px; padding: 10px; border: 0; background: transparent; cursor: pointer; border-radius: 5px; } .search-result:hover { background: var(--soft); } .search-result span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .search-result small { margin-left: auto; color: var(--faint); white-space: nowrap; } .search-empty { padding: 15px 8px 7px; text-align: center; color: var(--faint); font-size: 12px; }
    .task-label { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; background: #f1f6fb; color: #4b779d; font-size: 11px; }
    .toast { position: fixed; z-index: 90; bottom: 22px; left: 50%; transform: translate(-50%,16px); opacity: 0; pointer-events: none; background: #292624; color: #fff; padding: 10px 14px; border-radius: 7px; font-size: 13px; box-shadow: 0 7px 20px rgba(0,0,0,.18); transition: opacity .2s,transform .2s; } .toast.show { opacity: 1; transform: translate(-50%,0); } .mobile-scrim { display: none; }
    @keyframes row-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } } @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } } @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } } @keyframes modal-in { from { opacity: 0; transform: translateY(-6px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width:740px) { .sidebar { position: fixed; z-index: 40; top: var(--topbar-height); bottom: 0; left: 0; transform: translateX(-100%); box-shadow: 8px 0 24px rgba(0,0,0,.1); } .sidebar.open { transform: translateX(0); } .mobile-scrim { position: fixed; z-index: 30; inset: var(--topbar-height) 0 0; background: rgba(31,25,22,.24); } .mobile-scrim.show { display: block; } .content-wrap { padding: 30px 26px 48px; } .brand-word { display: none; } .topbar { gap: 8px; } .add-top span { display: none; } .add-top { padding: 7px; } }
    @media (max-width:470px) { .content-wrap { padding: 25px 18px 42px; } .content-header { margin-bottom: 23px; } h1 { font-size: 24px; } .task-actions { opacity: 1; } .task-row { gap: 9px; } .task-meta { flex-wrap: wrap; gap: 6px 9px; } .form-grid { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar" aria-label="Application header">
      <button class="icon-btn menu-btn" id="menu-button" aria-label="Open navigation" aria-expanded="false" title="Open navigation"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="brand" aria-label="Todoist"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 5.25h17L12 11 3.5 5.25Zm0 4.7L12 15.6l8.5-5.65v8.1c0 .72-.58 1.3-1.3 1.3H4.8c-.72 0-1.3-.58-1.3-1.3v-8.1Z" fill="currentColor"/></svg><span class="brand-word">Todoist</span></div>
      <div class="topbar-spacer"></div><div class="topbar-actions"><button class="icon-btn search-trigger" id="search-button" aria-label="Search tasks" title="Search tasks"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.8"/><path d="m16.2 16.2 4.1 4.1"/></svg></button><button class="add-top" data-action="new-task" aria-label="Add task" title="Add task"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add task</span></button><button class="avatar" aria-label="Open account menu" title="Account">P</button></div>
    </header>
    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="workspace-switcher"><div class="workspace-logo">P</div><div class="workspace-name"><strong>Phil</strong><span>Personal workspace</span></div><span class="workspace-chevron"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg></span></div>
        <nav>
          <div class="nav-section"><button class="nav-item" data-nav="inbox"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5h16v13H4zM4 14h4l1.5 2h5L16 14h4"/></svg></span><span>Inbox</span><span class="nav-count" id="inbox-count">0</span></button><button class="nav-item active" data-nav="today"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg></span><span>Today</span><span class="nav-count" id="today-count">0</span></button><button class="nav-item" data-nav="upcoming"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16M12 13v3l2 1"/></svg></span><span>Upcoming</span></button><button class="nav-item" data-nav="filters"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--sidebar)"/><circle cx="15" cy="12" r="2" fill="var(--sidebar)"/><circle cx="11" cy="18" r="2" fill="var(--sidebar)"/></svg></span><span>Filters & labels</span></button></div>
          <div class="nav-section project-list"><div class="nav-label">My projects</div><button class="nav-item" data-nav="project" data-project="work"><span class="project-dot blue"></span><span>Work</span><span class="nav-count" data-project-count="work"></span></button><button class="nav-item" data-nav="project" data-project="personal"><span class="project-dot yellow"></span><span>Personal</span><span class="nav-count" data-project-count="personal"></span></button><button class="nav-item" data-nav="project" data-project="health"><span class="project-dot teal"></span><span>Health</span><span class="nav-count" data-project-count="health"></span></button><button class="nav-item" data-nav="project" data-project="learning"><span class="project-dot purple"></span><span>Learning</span><span class="nav-count" data-project-count="learning"></span></button></div>
        </nav>
        <div class="sidebar-footer"><button data-action="new-project"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add project</span></button><button data-action="completed"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12.5 9.2 17 19 7"/></svg><span>Completed tasks</span></button></div>
      </aside>
      <div class="mobile-scrim" id="mobile-scrim"></div>
      <main class="main-content" id="main-content"><div class="content-wrap"><section class="content-header" aria-labelledby="view-title"><div><div class="eyebrow"><span class="today-dot"></span><span id="view-kicker">PERSONAL</span></div><h1 id="view-title">Today</h1><div class="date-line" id="date-line">Saturday, August 29</div></div><div class="header-actions"><button class="header-icon" id="sort-button" aria-label="Sort tasks" title="Sort tasks"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h12M8 12h9M8 18h6"/><path d="M4 5v14M2 7l2-2 2 2"/></svg></button><button class="header-icon" id="view-menu-button" aria-label="More view options" title="More view options"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></svg></button></div></section><section id="task-board" aria-live="polite"></section></div></main>
    </div>
  </div>
  <div id="search-root"></div><div id="modal-root"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'todoist-clone-state-v1', TODAY = '2026-08-29';
      const defaultProjects = [{id:'work',name:'Work',color:'blue'},{id:'personal',name:'Personal',color:'yellow'},{id:'health',name:'Health',color:'teal'},{id:'learning',name:'Learning',color:'purple'}];
      let projects = defaultProjects.map(project=>({...project}));
      const seed = {tasks:[
        {id:'t-1',content:'Send budget notes to finance',description:'Include the revised Q3 forecast and approval notes.',dueDate:'2026-08-28',dueTime:'09:00',priority:2,project:'work',completed:false},
        {id:'t-2',content:'Finish the quarterly report',description:'Add the customer retention chart before sharing.',dueDate:TODAY,dueTime:'11:00',priority:1,project:'work',completed:false},
        {id:'t-3',content:'Book dentist appointment',description:'',dueDate:TODAY,dueTime:'',priority:2,project:'health',completed:false},
        {id:'t-4',content:'Plan Saturday dinner',description:'Try the new pasta recipe and pick up fresh basil.',dueDate:TODAY,dueTime:'',priority:3,project:'personal',completed:false},
        {id:'t-5',content:'Review notes from design critique',description:'',dueDate:TODAY,dueTime:'',priority:3,project:'work',completed:true,completedAt:'2026-08-29T08:40:00.000Z'},
        {id:'t-6',content:'Read one chapter of Atomic Habits',description:'',dueDate:'2026-08-30',dueTime:'',priority:4,project:'learning',completed:false},
        {id:'t-7',content:'Reply to Maya about next week',description:'',dueDate:'2026-09-01',dueTime:'',priority:3,project:'personal',completed:false}
      ],projects:defaultProjects};
      let state={tasks:[],projects:[]}, currentView='today', currentProject='', searchOpen=false, searchQuery='', showCompleted=false, sortMode='default', loadError=false, toastTimer;
      const $=(selector,root=document)=>root.querySelector(selector), $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
      const esc=value=>String(value==null?'':value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const icon=(name,size=16)=>{const common=`width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`, paths={check:'<path d="m5 12.5 4.2 4.2L19 7"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',calendar:'<rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/>',flag:'<path d="M5 21V4m0 1c4-3 7 3 14 0v9c-7 3-10-3-14 0"/>',warning:'<path d="M12 4 3.5 19h17L12 4Z"/><path d="M12 9v4M12 16v.2"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="6.8"/><path d="m16.2 16.2 4.1 4.1"/>'}; return `<svg ${common}>${paths[name]||''}</svg>`;};
      const getStorage=()=>window.storage||window.Workshop?.storage||null;
      const cloneSeed=()=>JSON.parse(JSON.stringify(seed));
      const tell=message=>{if(typeof window.notify==='function')window.notify(message);showToast(message);};
      const title=value=>{if(typeof window.setTitle==='function')window.setTitle(value);document.title=value;};
      const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      function showToast(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300);}
      function normalizeState(value){const source=value&&Array.isArray(value.tasks)?value:cloneSeed(),sourceProjects=Array.isArray(source.projects)&&source.projects.length?source.projects:defaultProjects,colors=['blue','yellow','teal','purple'];projects=sourceProjects.map((project,index)=>({id:String(project.id||'project-'+(index+1)),name:String(project.name||'Project').trim()||'Project',color:colors.includes(project.color)?project.color:colors[index%colors.length]}));const projectIds=new Set(projects.map(project=>project.id));return {...source,projects,tasks:source.tasks.map(task=>({...task,project:projectIds.has(task.project)?task.project:(projects[0]?.id||'personal'),labels:Array.isArray(task.labels)?task.labels:[]}))};}
      async function loadState(){await delay(420);const api=getStorage();if(!api||typeof api.get!=='function')return normalizeState();try{const saved=await api.get(STORAGE_KEY);if(saved&&Array.isArray(saved.tasks))return normalizeState(saved);}catch(error){return normalizeState();}return normalizeState();}
      async function persist(){const api=getStorage();if(!api||typeof api.set!=='function')return;try{await api.set(STORAGE_KEY,state);}catch(error){showToast('Saved for this session');}}
      function formatDate(dateString,includeWeekday=false){if(!dateString)return'No due date';const date=new Date(`${dateString}T12:00:00`);return new Intl.DateTimeFormat('en-US',{weekday:includeWeekday?'long':undefined,month:'long',day:'numeric'}).format(date);}
      function toTimeValue(value){const raw=String(value||'').trim();if(!raw)return'';const match=raw.match(/^(\d{1,2}):(\d{2})(?:\s*(AM|PM))?$/i);if(!match)return'';let hour=Number(match[1]),minute=Number(match[2]),meridiem=match[3]?.toUpperCase();if(minute>59)return'';if(meridiem){if(hour<1||hour>12)return'';if(meridiem==='PM'&&hour<12)hour+=12;if(meridiem==='AM'&&hour===12)hour=0;}else if(hour>23)return'';return `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;}
      function formatTime(value){const normalized=toTimeValue(value);if(!normalized)return'';const [hour,minute]=normalized.split(':').map(Number);const date=new Date(2000,0,1,hour,minute);return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(date);}
      function dueLabel(task){const time=formatTime(task.dueTime);if(task.dueDate===TODAY)return time?`Today · ${time}`:'Today';if(task.dueDate==='2026-08-30')return time?`Tomorrow · ${time}`:'Tomorrow';return task.dueDate?`${formatDate(task.dueDate)}${time?` · ${time}`:''}`:'No due date';}
      function parseQuickAdd(raw,defaults={}){let text=String(raw||'').trim(),priority=Number(defaults.priority)||4,project=defaults.project||'personal',labels=Array.isArray(defaults.labels)?defaults.labels.slice():[];const priorityMatch=text.match(/(?:^|\s)!p?([1-4])(?=$|\s)/i);if(priorityMatch){priority=Number(priorityMatch[1]);text=text.replace(priorityMatch[0],' ');}const projectMatch=text.match(/(?:^|\s)#([a-z0-9_-]+)/i);if(projectMatch){const candidate=projects.find(item=>item.id===projectMatch[1].toLowerCase()||item.name.toLowerCase()===projectMatch[1].toLowerCase());if(candidate){project=candidate.id;text=text.replace(projectMatch[0],' ');}}const labelPattern=/(?:^|\s)@([a-z0-9][a-z0-9_-]*)/gi;for(const match of text.matchAll(labelPattern)){const label=match[1].toLowerCase();if(!labels.includes(label))labels.push(label);}text=text.replace(labelPattern,' ').replace(/\s{2,}/g,' ').trim();return{content:text,priority,project,labels};}
      function taskLabels(task){return(Array.isArray(task.labels)?task.labels:[]).map(label=>'<span class="task-label">@'+esc(label)+'</span>').join('');}
      function renderQuickAddPreview(value){const preview=$('#quick-add-preview');if(!preview)return;const baseProject=$('#task-project')?.value||(currentView==='project'?currentProject:'personal'),basePriority=Number($('#task-priority')?.value||4),parsed=parseQuickAdd(value,{project:baseProject,priority:basePriority,labels:[]}),chips=[];if(parsed.priority!==basePriority)chips.push('<span class="shortcut-chip priority-chip">Priority '+parsed.priority+'</span>');if(parsed.project!==baseProject)chips.push('<span class="shortcut-chip">'+esc(projectName(parsed.project))+'</span>');parsed.labels.forEach(label=>chips.push('<span class="shortcut-chip label-chip">@'+esc(label)+'</span>'));preview.innerHTML=chips.join('');}
      function projectName(id){return projects.find(project=>project.id===id)?.name||'Personal';} function projectColor(id){return projects.find(project=>project.id===id)?.color||'yellow';} function priorityLabel(priority){return priority===1?'Priority 1':priority===2?'Priority 2':priority===3?'Priority 3':'Priority 4';} function isOverdue(task){return Boolean(task.dueDate&&task.dueDate<TODAY&&!task.completed);}
      function visibleTasks(){let list=state.tasks.filter(task=>{if(currentView==='today')return task.dueDate===TODAY||isOverdue(task);if(currentView==='upcoming')return task.dueDate&&task.dueDate>TODAY;if(currentView==='inbox')return true;if(currentView==='project')return task.project===currentProject;if(currentView==='completed')return task.completed;return task.dueDate===TODAY;});if(!showCompleted&&currentView!=='completed')list=list.filter(task=>!task.completed);if(sortMode==='priority')list=[...list].sort((a,b)=>a.priority-b.priority||a.content.localeCompare(b.content));return list;}
      function navCounts(){$('#inbox-count').textContent=state.tasks.filter(task=>!task.completed).length;$('#today-count').textContent=state.tasks.filter(task=>!task.completed&&(task.dueDate===TODAY||isOverdue(task))).length;projects.forEach(project=>{const node=$(`[data-project-count="${project.id}"]`);if(node)node.textContent=state.tasks.filter(task=>task.project===project.id&&!task.completed).length||'';});}
      function renderHeader(){const names={today:['PERSONAL','Today'],inbox:['PERSONAL','Inbox'],upcoming:['PERSONAL','Upcoming'],filters:['ORGANIZE','Filters & labels'],completed:['PERSONAL','Completed tasks']};const pair=currentView==='project'?['PROJECT',projectName(currentProject)]:(names[currentView]||names.today);$('#view-kicker').textContent=pair[0];$('#view-title').textContent=pair[1];$('#date-line').textContent=currentView==='today'?formatDate(TODAY,true):currentView==='project'?`${state.tasks.filter(task=>task.project===currentProject&&!task.completed).length} active tasks`:currentView==='upcoming'?'Next 7 days':currentView==='completed'?'A record of your finished work':currentView==='filters'?'Quick ways to find your work':'Your personal task inbox';title(`${pair[1]} · Todoist`);}
      function renderTask(task,index){const dueClass=isOverdue(task)?'overdue':task.dueDate===TODAY?'today':'';return `<article class="task-row${task.completed?' completed':''}" style="animation-delay:${Math.min(index*35,220)}ms" data-task-id="${esc(task.id)}"><button class="task-check${task.completed?' done':''}" data-action="toggle" aria-label="${task.completed?'Mark incomplete':'Complete'}: ${esc(task.content)}" aria-pressed="${task.completed}">${task.completed?icon('check',13):''}</button><div class="task-main"><button class="task-title" data-action="edit" aria-label="Edit task: ${esc(task.content)}">${esc(task.content)}</button>${task.description?`<div class="task-details">${esc(task.description)}</div>`:''}<div class="task-meta"><span class="due ${dueClass}">${icon('calendar',13)}<span>${esc(dueLabel(task))}</span></span><span class="priority p${task.priority}" title="${priorityLabel(task.priority)}">${icon('flag',13)}</span><span class="task-project"><span class="mini-dot ${projectColor(task.project)}"></span>${esc(projectName(task.project))}</span>${taskLabels(task)}</div></div><div class="task-actions"><button data-action="edit" aria-label="Edit task" title="Edit task">${icon('edit',15)}</button><button data-action="delete" aria-label="Delete task" title="Delete task">${icon('trash',15)}</button></div></article>`;}
      function renderBoard(){const board=$('#task-board');if(loadError){board.innerHTML=`<div class="error-state"><div><div class="error-icon">${icon('warning',33)}</div><h2>Something went wrong</h2><p>Your tasks could not be loaded. Try again to return to your workspace.</p><button class="primary-btn" data-action="retry">Try again</button></div></div>`;return;}if(!state.tasks.length){board.innerHTML=`<div class="empty-state"><div><div class="empty-illustration">${icon('check',35)}</div><h2>Your day is clear</h2><p>Add a task to get started and keep the important things moving.</p><button class="primary-btn" data-action="new-task">Add your first task</button></div></div>`;return;}if(currentView==='filters'){board.innerHTML=`<div class="empty-state"><div><div class="empty-illustration">${icon('search',32)}</div><h2>Find your focus</h2><p>Search from the top bar to find tasks across every project.</p><button class="primary-btn" data-action="open-search">Search tasks</button></div></div>`;return;}const list=visibleTasks();if(!list.length){board.innerHTML=`<div class="empty-state"><div><div class="empty-illustration">${icon('check',35)}</div><h2>Nothing here</h2><p>You're all caught up. Enjoy the extra breathing room.</p><button class="primary-btn" data-action="new-task">Add a task</button></div></div>`;return;}let html='';if(currentView==='today'){const overdue=list.filter(task=>isOverdue(task)),today=list.filter(task=>!isOverdue(task));if(overdue.length)html+=`<section class="task-section"><h2 class="section-heading overdue">Overdue <span>· ${overdue.length}</span></h2>${overdue.map(renderTask).join('')}</section>`;if(today.length)html+=`<section class="task-section"><h2 class="section-heading">Today <span>· ${today.length}</span></h2>${today.map((task,index)=>renderTask(task,index+overdue.length)).join('')}</section>`;}else if(currentView==='completed')html=`<section class="task-section"><h2 class="section-heading">Completed <span>· ${list.length}</span></h2>${list.map(renderTask).join('')}</section>`;else html=`<section class="task-section"><h2 class="section-heading">${currentView==='upcoming'?'Coming up':currentView==='project'?projectName(currentProject):'Tasks'} <span>· ${list.length}</span></h2>${list.map(renderTask).join('')}</section>`;if(currentView!=='completed'&&state.tasks.some(task=>task.completed))html+=`<button class="completed-toggle" data-action="show-completed">${showCompleted?'Hide completed tasks':`Show completed tasks · ${state.tasks.filter(task=>task.completed).length}`}</button>`;html+=`<div class="task-composer" data-action="new-task" role="button" tabindex="0" aria-label="Add task"><span class="composer-plus">${icon('plus',19)}</span><span class="composer-label">Add task</span></div>`;board.innerHTML=html;}
      function renderNav(){renderProjectNav();$$('.nav-item').forEach(item=>item.classList.remove('active'));const active=currentView==='project'?$(`[data-nav="project"][data-project="${currentProject}"]`):$(`[data-nav="${currentView}"]`);if(active)active.classList.add('active');navCounts();}
      function renderProjectNav(){const list=$('.project-list');if(!list)return;list.innerHTML='<div class="nav-label">My projects</div>'+projects.map(project=>'<button class="nav-item" data-nav="project" data-project="'+esc(project.id)+'"><span class="project-dot '+esc(project.color)+'"></span><span>'+esc(project.name)+'</span><span class="nav-count" data-project-count="'+esc(project.id)+'"></span></button>').join('');}
      function render(){renderHeader();renderNav();renderBoard();$('#app').setAttribute('aria-busy','false');}
      function openTaskModal(taskId=''){
        const task=taskId?state.tasks.find(item=>item.id===taskId):null;
        const dateValue=task?.dueDate||TODAY;
        const projectValue=task?.project||(currentView==='project'?currentProject:'personal');
        const selectedPriority=task?.priority||4;
        const projectOptions=projects.map(project=>'<option value="'+esc(project.id)+'"'+(project.id===projectValue?' selected':'')+'>'+esc(project.name)+'</option>').join('');
        const priorityOptions=[1,2,3,4].map(priority=>'<button type="button" class="priority-option'+(selectedPriority===priority?' selected':'')+'" data-priority="'+priority+'">P'+priority+'</button>').join('');
        const closeIcon=icon('plus',18).replace('M12 5v14M5 12h14','M6 6l12 12M18 6 6 18');
        $('#modal-root').innerHTML=[
          '<div class="modal-backdrop" data-modal-backdrop>',
          '<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-modal="task">',
          '<div class="modal-header"><h2 id="modal-title">'+(task?'Edit task':'Add task')+'</h2><button type="button" class="close-btn" data-action="close-modal" aria-label="Close">'+closeIcon+'</button></div>',
          '<form class="modal-form" id="task-form">',
          '<input type="hidden" name="id" value="'+esc(task?.id||'')+'">',
          '<div class="form-field"><label for="task-content">Task name</label><input id="task-content" name="content" autocomplete="off" placeholder="e.g. Prepare presentation" value="'+esc(task?.content||'')+'" required></div>',
          '<div class="quick-add-hint">Quick add <kbd>!p1</kbd> priority · <kbd>#project</kbd> project · <kbd>@label</kbd> label</div><div id="quick-add-preview" class="quick-add-preview" aria-live="polite"></div>',
          '<div class="form-field"><label for="task-description">Description <span style="font-weight:400;color:#aaa39e">(optional)</span></label><textarea id="task-description" name="description" placeholder="Add a little more detail">'+esc(task?.description||'')+'</textarea></div>',
          '<div class="form-grid">',
          '<div class="form-field"><label for="task-date">Due date</label><input id="task-date" name="dueDate" type="date" value="'+esc(dateValue)+'"></div>',
          '<div class="form-field"><label for="task-time">Time <span style="font-weight:400;color:#aaa39e">(optional)</span></label><input id="task-time" name="dueTime" type="time" step="60" value="'+esc(toTimeValue(task?.dueTime))+'"></div>',
          '</div>',
          '<div class="form-grid">',
          '<div class="form-field"><label for="task-project">Project</label><select id="task-project" name="project">'+projectOptions+'</select></div>',
          '<div class="form-field"><label>Priority</label><div class="priority-picker">'+priorityOptions+'</div><input type="hidden" name="priority" id="task-priority" value="'+selectedPriority+'"></div>',
          '</div>',
          '<div class="modal-footer"><button type="button" class="secondary-btn" data-action="close-modal">Cancel</button><button type="submit" class="primary-btn">'+(task?'Save changes':'Add task')+'</button></div>',
          '</form></section></div>'
        ].join('');
        const form=$('#task-form');
        form.addEventListener('submit',async event=>{
          event.preventDefault();
          event.stopPropagation();
          const submit=form.querySelector('[type="submit"]');
          const idleLabel=submit.textContent;
          submit.disabled=true;
          submit.textContent='Saving…';
          try{const didSave=await submitTask(form);if(didSave===false){submit.disabled=false;submit.textContent=idleLabel;}}catch(error){submit.disabled=false;submit.textContent=idleLabel;tell('Could not save task');}
        });
        $('#task-content').focus();
        renderQuickAddPreview($('#task-content').value);
      }
      function openProjectModal(){
        const colors=['blue','yellow','teal','purple'];
        const colorOptions=colors.map((color,index)=>'<button type="button" class="color-option'+(index===0?' selected':'')+'" data-project-color="'+color+'" aria-label="'+color+'"><span class="color-swatch '+color+'"></span></button>').join('');
        const closeIcon=icon('plus',18).replace('M12 5v14M5 12h14','M6 6l12 12M18 6 6 18');
        $('#modal-root').innerHTML=[
          '<div class="modal-backdrop" data-modal-backdrop>',
          '<section class="modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">',
          '<div class="modal-header"><h2 id="project-modal-title">Add project</h2><button type="button" class="close-btn" data-action="close-modal" aria-label="Close">'+closeIcon+'</button></div>',
          '<form class="modal-form" id="project-form">',
          '<div class="form-field"><label for="project-name">Project name</label><input id="project-name" name="name" autocomplete="off" placeholder="e.g. Side project" aria-describedby="project-error" required><div id="project-error" class="form-error" role="alert"></div></div>',
          '<div class="form-field"><label>Color</label><div class="color-picker">'+colorOptions+'</div><input type="hidden" name="color" id="project-color" value="blue"></div>',
          '<div class="modal-footer"><button type="button" class="secondary-btn" data-action="close-modal">Cancel</button><button type="submit" class="primary-btn">Save project</button></div>',
          '</form></section></div>'
        ].join('');
        const form=$('#project-form');
        form.addEventListener('submit',async event=>{
          event.preventDefault();
          event.stopPropagation();
          const input=$('#project-name');
          const error=$('#project-error');
          const name=input.value.trim();
          error.textContent='';
          input.removeAttribute('aria-invalid');
          if(!name){error.textContent='Give your project a name';input.setAttribute('aria-invalid','true');input.focus();return;}
          if(projects.some(project=>project.name.toLowerCase()===name.toLowerCase())){error.textContent='That project already exists';input.setAttribute('aria-invalid','true');input.focus();return;}
          const baseId=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'project';
          let id=baseId,suffix=2;
          while(projects.some(project=>project.id===id)){id=baseId+'-'+suffix;suffix++;}
          const project={id,name,color:$('#project-color').value||'blue'};
          const submit=form.querySelector('[type="submit"]');
          submit.disabled=true;
          submit.textContent='Saving…';
          projects=projects.concat(project);
          state.projects=projects;
          try{await persist();closeModal();setView('project',id);tell('Project created');}catch(saveError){projects=projects.filter(item=>item.id!==id);state.projects=projects;submit.disabled=false;submit.textContent='Save project';tell('Could not save project');}
        });
        $('#project-name').focus();
      }
      function closeModal(){$('#modal-root').innerHTML='';}
      async function submitTask(form){const data=new FormData(form),rawContent=String(data.get('content')||'').trim();if(!rawContent)return false;const id=String(data.get('id')||''),current=id?state.tasks.find(item=>item.id===id):null,quick=parseQuickAdd(rawContent,{project:String(data.get('project')||current?.project||'personal'),priority:Number(data.get('priority')||current?.priority||4),labels:current?.labels||[]});if(!quick.content){tell('Add a task name');return false;}const payload={content:quick.content,description:String(data.get('description')||'').trim(),dueDate:String(data.get('dueDate')||''),dueTime:toTimeValue(String(data.get('dueTime')||'')),project:quick.project,priority:quick.priority,labels:quick.labels,completed:false};if(id){const task=state.tasks.find(item=>item.id===id);if(task)Object.assign(task,payload,{completed:task.completed});tell('Task updated');}else{state.tasks.unshift({id:'t-'+Date.now(),...payload});tell('Task added');}await persist();closeModal();render();return true;}
      async function toggleTask(taskId){const task=state.tasks.find(item=>item.id===taskId);if(!task)return;task.completed=!task.completed;task.completedAt=task.completed?new Date().toISOString():undefined;await persist();render();tell(task.completed?'Task completed':'Task reopened');}
      async function deleteTask(taskId){const task=state.tasks.find(item=>item.id===taskId);if(!task)return;state.tasks=state.tasks.filter(item=>item.id!==taskId);await persist();render();tell(`Deleted “${task.content}”`);}
      function setView(view,project=''){currentView=view;currentProject=project;showCompleted=view==='completed';searchOpen=false;searchQuery='';closeSearch();closeModal();render();if(window.innerWidth<=740)toggleSidebar(false);}
      function toggleSidebar(force){const sidebar=$('#sidebar'),open=typeof force==='boolean'?force:!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);$('#mobile-scrim').classList.toggle('show',open);$('#menu-button').setAttribute('aria-expanded',String(open));}
      function renderSearch(){if(!searchOpen){closeSearch();return;}const normalized=searchQuery.toLowerCase().trim(),results=normalized?state.tasks.filter(task=>`${task.content} ${task.description} ${projectName(task.project)}`.toLowerCase().includes(normalized)).slice(0,12):[];$('#search-root').innerHTML=`<div class="search-popover"><div class="search-input-wrap">${icon('search',17)}<input id="global-search" type="search" value="${esc(searchQuery)}" placeholder="Search tasks" aria-label="Search tasks"><button class="close-btn" data-action="close-search" aria-label="Close search">${icon('plus',15).replace('M12 5v14M5 12h14','M6 6l12 12M18 6 6 18')}</button></div><div class="search-results">${normalized?(results.length?results.map(task=>`<button class="search-result" data-action="search-result" data-task-id="${esc(task.id)}">${task.completed?`<span style="color:#aaa">${icon('check',14)}</span>`:`<span style="color:${task.priority===1?'var(--red)':'#aaa'}">${icon('flag',14)}</span>`}<span>${esc(task.content)}</span><small>${esc(projectName(task.project))}</small></button>`).join(''):'<div class="search-empty">No matching tasks</div>'):'<div class="search-empty">Type to search across your tasks</div>'}</div></div>`;$('#global-search').focus();}
      function closeSearch(){$('#search-root').innerHTML='';} function toggleSearch(){searchOpen=!searchOpen;if(!searchOpen)searchQuery='';renderSearch();if(searchOpen)setTimeout(()=>$('#global-search')?.focus(),0);}
      $('#modal-root').addEventListener('click',event=>{if(event.target.matches('[data-modal-backdrop]'))closeModal();});
      document.addEventListener('input',event=>{if(event.target.id==='task-content')renderQuickAddPreview(event.target.value);});
      document.addEventListener('click',event=>{const colorNode=event.target.closest('[data-project-color]');if(!colorNode)return;$$('.color-option').forEach(node=>node.classList.remove('selected'));colorNode.classList.add('selected');$('#project-color').value=colorNode.dataset.projectColor;});
      document.addEventListener('click',async event=>{const actionNode=event.target.closest('[data-action]'),navNode=event.target.closest('[data-nav]');if(navNode){setView(navNode.dataset.nav,navNode.dataset.project||'');return;}if(!actionNode)return;const action=actionNode.dataset.action;if(action==='new-task')openTaskModal();if(action==='edit')openTaskModal(actionNode.closest('[data-task-id]')?.dataset.taskId);if(action==='toggle')await toggleTask(actionNode.closest('[data-task-id]')?.dataset.taskId);if(action==='delete')await deleteTask(actionNode.closest('[data-task-id]')?.dataset.taskId);if(action==='close-modal')closeModal();if(action==='show-completed'){showCompleted=!showCompleted;renderBoard();}if(action==='completed')setView('completed');if(action==='open-search'){searchOpen=true;renderSearch();}if(action==='close-search'){searchOpen=false;searchQuery='';closeSearch();}if(action==='retry')await boot();if(action==='new-project')openProjectModal();if(action==='search-result'){const task=state.tasks.find(item=>item.id===actionNode.dataset.taskId);searchOpen=false;closeSearch();if(task)openTaskModal(task.id);}});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();searchOpen=false;closeSearch();if(window.innerWidth<=740)toggleSidebar(false);}if(event.key==='Enter'&&event.target.matches('.task-composer'))openTaskModal();if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!searchOpen)toggleSearch();}});
      document.addEventListener('input',event=>{if(event.target.id==='global-search'){searchQuery=event.target.value;renderSearch();}});document.addEventListener('submit',event=>{if(event.target.id==='task-form'){event.preventDefault();submitTask(event.target);}});document.addEventListener('click',event=>{const priority=event.target.closest('[data-priority]');if(priority){$$('.priority-option').forEach(node=>node.classList.remove('selected'));priority.classList.add('selected');$('#task-priority').value=priority.dataset.priority;}});
      $('#search-button').addEventListener('click',toggleSearch);$('#menu-button').addEventListener('click',()=>toggleSidebar());$('#mobile-scrim').addEventListener('click',()=>toggleSidebar(false));$('#sort-button').addEventListener('click',()=>{sortMode=sortMode==='default'?'priority':'default';renderBoard();tell(sortMode==='priority'?'Sorted by priority':'Returned to default order');});$('#view-menu-button').addEventListener('click',()=>tell('View options are ready'));
      async function boot(){loadError=false;$('#app').setAttribute('aria-busy','true');$('#task-board').innerHTML='<div class="skeleton skeleton-heading"></div><div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line small"></span></span></div><div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span><span class="skeleton skeleton-line" style="width:58%"></span><span class="skeleton skeleton-line small" style="width:26%"></span></span></div><div class="skeleton-row"><span class="skeleton skeleton-circle"></span><span><span class="skeleton skeleton-line" style="width:38%"></span><span class="skeleton skeleton-line small" style="width:19%"></span></span></div>';try{state=await loadState();render();}catch(error){loadError=true;render();}}
      boot();
    })();
  </script>
</body>
</html>
