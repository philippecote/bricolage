<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#18201e;font:15px -apple-system,BlinkMacSystemFont,sans-serif}.shell{max-width:780px;margin:auto;padding:54px 32px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #d9deda;padding-bottom:24px}h1{font-size:32px;letter-spacing:-1.2px;margin:0}header p{color:#6c7471;margin:7px 0 0}.badge{font-size:12px;color:#18796f;background:#dff0eb;padding:7px 10px;border-radius:999px}form{display:flex;gap:10px;margin:34px 0}input{flex:1;border:1px solid #cdd4d0;border-radius:12px;padding:13px 15px;background:white;font:inherit;outline:none}input:focus{border-color:#18796f;box-shadow:0 0 0 3px #18796f20}button{border:0;border-radius:12px;padding:0 18px;color:white;background:#18796f;font-weight:600;cursor:pointer}.empty{padding:70px 0;text-align:center;color:#7a827f}.row{display:grid;grid-template-columns:80px 1fr auto;padding:15px 2px;border-bottom:1px solid #e0e3df}.form{font-weight:650}.date,.accession{color:#727a77}.error{color:#a3352b}</style></head><body><main class="shell"><header><div><h1>Filing Desk</h1><p>Search recent company filings from the SEC.</p></div><span class="badge">Public data</span></header><form id="search"><input id="ticker" aria-label="Ticker" placeholder="Ticker, e.g. AAPL" maxlength="10"><button>Search</button></form><section id="results" class="empty">Enter a ticker to begin.</section></main><script>const form=document.querySelector('#search'),results=document.querySelector('#results');form.addEventListener('submit',async e=>{e.preventDefault();const ticker=document.querySelector('#ticker').value.trim();if(!ticker)return;results.className='empty';results.textContent='Finding filings…';try{const r=await Workshop.callAction('search_filings',{ticker});const filings=r.output?.filings||r.filings||[];if(!filings.length){results.textContent='No recent filings found.';return}results.className='';results.innerHTML=filings.slice(0,30).map(f=>`<div class="row"><span class="form">${f.form}</span><span class="accession">${f.accession}</span><time class="date">${f.filedAt}</time></div>`).join('')}catch(err){results.className='empty error';results.textContent=err.message}})</script></body></html>
