<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tea Steep Timer</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#241f1a; --ink-soft:#6c635a; --ink-faint:#9a9188;
    --paper:#f7f3ec; --card:#fffdf9; --line:#e4dcd0;
    --accent:#5f8f4f; --accent-soft:#5f8f4f22;
    --shadow:0 10px 30px rgba(58,44,28,.10);
    --ring:#e6ded2;
  }
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1100px 520px at 82% -12%, #ffffff 0%, transparent 62%),
      var(--paper);
    color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* boot */
  .boot{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--paper);z-index:20;transition:opacity .3s ease}
  .boot[hidden]{display:none}
  .boot.out{opacity:0;pointer-events:none}
  .boot-inner{text-align:center}
  .leaf{width:52px;height:52px;margin:0 auto;border-radius:50% 50% 50% 6px;background:linear-gradient(150deg,#7ba86a,#4a7540);transform:rotate(-20deg);animation:sway 1.5s ease-in-out infinite}
  .boot p{margin:16px 0 0;color:var(--ink-faint);font-size:13px;letter-spacing:.02em}
  @keyframes sway{0%,100%{transform:rotate(-26deg) translateY(0)}50%{transform:rotate(-12deg) translateY(-5px)}}

  /* shell */
  .app{display:grid;grid-template-columns:246px 1fr;height:100vh;opacity:0;transition:opacity .4s ease}
  .app.in{opacity:1}

  /* picker */
  .picker{border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fffdfa,#f9f5ee)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:linear-gradient(150deg,#7ba86a,#4a7540);transform:rotate(-20deg);flex:none}
  .brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
  .picker-hint{margin:8px 0 16px;font-size:12.5px;color:var(--ink-faint)}
  fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}
  legend{padding:0;font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .tea{position:relative;display:block}
  .tea input{position:absolute;opacity:0;width:1px;height:1px}
  .tea span{display:block;border:1px solid transparent;border-radius:11px;padding:9px 11px;transition:background .18s ease,border-color .18s ease,transform .18s ease}
  .tea-name{font-size:14px;font-weight:560;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
  .tea-meta{display:block;font-size:11.5px;color:var(--ink-faint);margin:2px 0 0 17px}
  .tea:hover span{background:#00000006}
  .tea input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .tea input:checked+span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 34%,transparent)}
  .tea input:checked+span .tea-meta{color:color-mix(in srgb,var(--c) 62%,var(--ink-soft))}
  .picker footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
  .toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:7px 2px;border-radius:8px;font-size:13px;color:var(--ink-soft)}
  .toggle:hover{background:#00000006}
  .switch{width:34px;height:19px;border-radius:99px;background:#d8cfc2;position:relative;transition:background .2s ease;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s ease}
  .toggle[aria-pressed="true"] .switch{background:var(--accent)}
  .toggle[aria-pressed="true"] .switch::after{transform:translateX(15px)}
  .note{margin:10px 2px 0;font-size:11.5px;color:#a8632f;display:none}
  .note.show{display:block}

  /* stage */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;padding:26px 30px 24px;overflow:hidden}
  .stage-head{text-align:center;min-height:52px}
  .stage-head h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.015em}
  .stage-head p{margin:3px 0 0;font-size:12.5px;color:var(--ink-faint)}
  .stage-head .temp{color:var(--accent);font-weight:560}

  .dial{position:relative;width:252px;height:252px;margin:14px 0 4px;flex:none}
  .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--ring);stroke-width:9}
  .prog{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke .35s ease}
  .dial-face{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .clock{font-size:56px;font-weight:230;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin:0}
  .clock-state{margin:9px 0 0;font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .dial.run .prog{filter:drop-shadow(0 0 6px var(--accent-soft))}
  .dial.done .clock{color:var(--accent)}

  .steeps{display:flex;gap:7px;margin:14px 0 0}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 15px;font-size:12.5px;color:var(--ink-soft);transition:all .18s ease}
  .chip:hover:not(:disabled){border-color:var(--ink-faint)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:560}
  .chip:disabled{opacity:.45;cursor:not-allowed}
  .chip.used[aria-pressed="false"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

  .adjust{display:flex;align-items:center;gap:4px;margin:16px 0 0}
  .step{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1;display:grid;place-items:center;color:var(--ink-soft)}
  .step:hover:not(:disabled){background:#fff;border-color:var(--ink-faint);color:var(--ink)}
  .step:disabled{opacity:.35;cursor:not-allowed}
  .adjust-val{min-width:118px;text-align:center;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .adjust-val b{color:var(--ink);font-weight:600}
  .revert{background:none;border:0;font-size:11.5px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;padding:4px 6px;border-radius:6px}
  .revert[hidden]{display:none}

  .controls{display:flex;gap:10px;margin:auto 0 0;padding-top:18px}
  .btn{border-radius:11px;padding:11px 26px;font-size:14px;font-weight:560;border:1px solid var(--line);background:var(--card);transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent);min-width:132px}
  .btn-primary:hover{box-shadow:0 9px 22px color-mix(in srgb,var(--accent) 36%,transparent)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .hint{margin:12px 0 0;font-size:11px;color:var(--ink-faint);letter-spacing:.01em;text-align:center}
  kbd{font:inherit;font-size:10.5px;background:#00000009;border:1px solid var(--line);border-radius:4px;padding:1px 4px}

  /* ready */
  .ready{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 78%,transparent);backdrop-filter:blur(7px);padding:30px;z-index:5}
  .ready[hidden]{display:none}
  .ready-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px 34px;text-align:center;max-width:360px;animation:pop .42s cubic-bezier(.2,.9,.25,1) both}
  .ready-mark{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,#fff);display:grid;place-items:center;color:var(--accent);font-size:26px;animation:ping 1.7s ease-out 2}
  .ready-card h3{margin:0;font-size:20px;font-weight:620;letter-spacing:-.015em}
  .ready-card p{margin:7px 0 20px;font-size:13px;color:var(--ink-soft)}
  .ready-actions{display:flex;flex-direction:column;gap:8px}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
  @keyframes ping{0%{box-shadow:0 0 0 0 var(--accent-soft)}100%{box-shadow:0 0 0 18px transparent}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-inner"><div class="leaf"></div><p>Warming the pot…</p></div>
</div>

<div class="app" id="app" aria-hidden="true">
  <aside class="picker">
    <div class="brand"><span class="brand-mark"></span><h1>Tea Steep Timer</h1></div>
    <p class="picker-hint">Pick a tea, then start the timer.</p>
    <fieldset id="teaList"><legend>Tea</legend></fieldset>
    <footer>
      <button class="toggle" id="soundBtn" aria-pressed="true"><span>Chime when ready</span><span class="switch" aria-hidden="true"></span></button>
      <p class="note" id="note">Saving is unavailable, so custom times won’t be remembered.</p>
    </footer>
  </aside>

  <main class="stage">
    <div class="stage-head">
      <h2 id="teaTitle">Green tea</h2>
      <p><span class="temp" id="teaTemp"></span> <span aria-hidden="true">·</span> <span id="teaNote"></span></p>
    </div>

    <div class="dial" id="dial">
      <svg viewBox="0 0 252 252" aria-hidden="true">
        <circle class="track" cx="126" cy="126" r="115"></circle>
        <circle class="prog" id="prog" cx="126" cy="126" r="115"></circle>
      </svg>
      <div class="dial-face">
        <p class="clock" id="clock" role="timer" aria-live="off">2:00</p>
        <p class="clock-state" id="clockState">Steep 1 · ready to start</p>
      </div>
    </div>

    <div class="steeps" id="steeps" role="group" aria-label="Which steep"></div>

    <div class="adjust">
      <button class="step" id="minus" aria-label="Shorten this steep by 15 seconds">−</button>
      <span class="adjust-val" id="adjustVal"></span>
      <button class="step" id="plus" aria-label="Lengthen this steep by 15 seconds">+</button>
      <button class="revert" id="revert" hidden>Use default</button>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Start steeping</button>
      <button class="btn" id="resetBtn" disabled>Reset</button>
    </div>
    <p class="hint"><kbd>Space</kbd> start or pause <span aria-hidden="true">·</span> <kbd>R</kbd> reset</p>

    <div class="ready" id="ready" hidden>
      <div class="ready-card" role="alertdialog" aria-labelledby="readyTitle" aria-describedby="readyBody">
        <div class="ready-mark" aria-hidden="true">✓</div>
        <h3 id="readyTitle">Tea’s ready</h3>
        <p id="readyBody">Lift the leaves out before it turns bitter.</p>
        <div class="ready-actions">
          <button class="btn btn-primary" id="nextBtn">Start steep 2</button>
          <button class="btn" id="doneBtn">Done for now</button>
        </div>
      </div>
    </div>
  </main>
</div>
<p class="sr" id="live" aria-live="polite"></p>

<script>
(function () {
  'use strict';

  var TEAS = [
    { id:'green',  name:'Green tea',  temp:'80°C / 175°F',  note:'Grassy and delicate — keep it brief', color:'#5f8f4f', steeps:[120,150,180] },
    { id:'black',  name:'Black tea',  temp:'96°C / 205°F',  note:'Bold and malty, forgiving of a long soak', color:'#8d4a2c', steeps:[210,240,300] },
    { id:'oolong', name:'Oolong tea', temp:'90°C / 195°F',  note:'Rolls open slowly and rewards resteeping', color:'#b5762a', steeps:[180,210,270] },
    { id:'herbal', name:'Herbal tea', temp:'100°C / 212°F', note:'Full boil and a patient, long steep', color:'#a34a63', steeps:[300,360,420] },
    { id:'white',  name:'White tea',  temp:'85°C / 185°F',  note:'Soft and sweet — never rush it', color:'#9a8c4e', steeps:[150,180,240] }
  ];
  var ORDINAL = ['1st steep', '2nd steep', '3rd steep'];
  var MIN_S = 15, MAX_S = 1200, STEP_S = 15, CIRC = 2 * Math.PI * 115;

  var bridge = window.Workshop || {};
  var savingBroken = false;

  var el = {};
  ['boot','app','teaList','soundBtn','note','teaTitle','teaTemp','teaNote','dial','prog','clock','clockState',
   'steeps','minus','plus','adjustVal','revert','startBtn','resetBtn','ready','readyTitle','readyBody',
   'nextBtn','doneBtn','live'].forEach(function (id) { el[id] = document.getElementById(id); });

  var state = {
    teaId: 'green',
    steep: 0,
    custom: {},
    sound: true,
    done: [],
    phase: 'idle',      // idle | running | paused | ready
    remainingMs: 0,
    deadline: 0
  };

  /* ---------- persistence ---------- */

  function save() {
    if (!bridge.storage) { savingBroken = true; el.note.classList.add('show'); return; }
    bridge.storage.set('prefs', {
      teaId: state.teaId, custom: state.custom, sound: state.sound
    }).catch(function () {
      savingBroken = true;
      el.note.classList.add('show');
    });
  }

  function load() {
    if (!bridge.storage) return Promise.resolve(null);
    return bridge.storage.get('prefs').catch(function () {
      savingBroken = true;
      return null;
    });
  }

  /* ---------- model ---------- */

  function tea() {
    for (var i = 0; i < TEAS.length; i++) if (TEAS[i].id === state.teaId) return TEAS[i];
    return TEAS[0];
  }
  function key(steep) { return state.teaId + ':' + steep; }
  function defaultFor(steep) { return tea().steeps[steep]; }
  function durationS(steep) {
    var v = state.custom[key(steep)];
    return typeof v === 'number' ? v : defaultFor(steep);
  }
  function isCustom(steep) { return typeof state.custom[key(steep)] === 'number'; }

  function clock(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
  }

  /* ---------- chime ---------- */

  var ac = null;
  function audio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!ac) ac = new Ctx();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function strike(ctx, at, level) {
    var g = ctx.createGain();
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(level, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 1.7);
    [[880, 1], [1320, 0.36], [2640, 0.1]].forEach(function (pair) {
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = pair[0];
      og.gain.value = pair[1];
      o.connect(og); og.connect(g);
      o.start(at); o.stop(at + 1.8);
    });
  }
  function chime() {
    if (!state.sound) return;
    var ctx = audio();
    if (!ctx) return;
    try {
      var t0 = ctx.currentTime + 0.03;
      [0, 0.62, 1.24].forEach(function (offset, i) {
        strike(ctx, t0 + offset, i === 2 ? 0.20 : 0.16);
      });
    } catch (e) { /* visual alert still lands */ }
  }

  /* ---------- rendering ---------- */

  function buildTeaList() {
    TEAS.forEach(function (t) {
      var label = document.createElement('label');
      label.className = 'tea';
      label.style.setProperty('--c', t.color);
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'tea';
      input.value = t.id;
      var span = document.createElement('span');
      var name = document.createElement('span');
      name.className = 'tea-name';
      var dot = document.createElement('span');
      dot.className = 'dot';
      name.appendChild(dot);
      name.appendChild(document.createTextNode(t.name.replace(' tea', '')));
      var meta = document.createElement('span');
      meta.className = 'tea-meta';
      meta.textContent = t.temp;
      span.appendChild(name);
      span.appendChild(meta);
      label.appendChild(input);
      label.appendChild(span);
      input.addEventListener('change', function () { pickTea(t.id); });
      el.teaList.appendChild(label);
    });
  }

  function buildSteeps() {
    for (var i = 0; i < 3; i++) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.dataset.steep = String(i);
      b.textContent = ORDINAL[i];
      b.addEventListener('click', onSteepClick);
      el.steeps.appendChild(b);
    }
  }

  function onSteepClick(e) {
    var next = Number(e.currentTarget.dataset.steep);
    if (state.phase === 'running' || next === state.steep) return;
    state.steep = next;
    resetTimer();
  }

  function leftMs() {
    return state.phase === 'running' ? Math.max(0, state.deadline - Date.now())
         : state.phase === 'paused'  ? state.remainingMs
         : state.phase === 'ready'   ? 0
         : durationS(state.steep) * 1000;
  }

  function paint() {
    var totalMs = durationS(state.steep) * 1000;
    var left = leftMs();
    var text = clock(left);
    if (el.clock.textContent !== text) el.clock.textContent = text;
    var pct = totalMs > 0 ? left / totalMs : 0;
    el.prog.style.strokeDasharray = CIRC + ' ' + CIRC;
    el.prog.style.strokeDashoffset = String(CIRC * (1 - pct));
    setTitle(left);
  }

  function render() {
    var t = tea();
    document.documentElement.style.setProperty('--accent', t.color);
    document.documentElement.style.setProperty('--accent-soft', t.color + '22');

    el.teaTitle.textContent = t.name;
    el.teaTemp.textContent = t.temp;
    el.teaNote.textContent = t.note;

    paint();

    el.dial.classList.toggle('run', state.phase === 'running');
    el.dial.classList.toggle('done', state.phase === 'ready');

    el.clockState.textContent =
      state.phase === 'running' ? ORDINAL[state.steep] + ' · steeping'
      : state.phase === 'paused' ? ORDINAL[state.steep] + ' · paused'
      : state.phase === 'ready'  ? ORDINAL[state.steep] + ' · ready'
      : ORDINAL[state.steep] + ' · ready to start';

    Array.prototype.forEach.call(el.steeps.children, function (chip, i) {
      chip.setAttribute('aria-pressed', String(i === state.steep));
      chip.classList.toggle('used', state.done.indexOf(t.id + ':' + i) !== -1);
      chip.disabled = state.phase === 'running';
    });

    var secs = durationS(state.steep);
    el.adjustVal.innerHTML = '';
    var strong = document.createElement('b');
    strong.textContent = clock(secs * 1000);
    el.adjustVal.appendChild(strong);
    el.adjustVal.appendChild(document.createTextNode(isCustom(state.steep) ? ' your time' : ' suggested'));
    el.minus.disabled = state.phase === 'running' || secs <= MIN_S;
    el.plus.disabled = state.phase === 'running' || secs >= MAX_S;
    el.revert.hidden = !isCustom(state.steep) || state.phase === 'running';

    el.startBtn.textContent = state.phase === 'running' ? 'Pause' : state.phase === 'paused' ? 'Resume' : 'Start steeping';
    el.startBtn.disabled = state.phase === 'ready';
    el.resetBtn.disabled = state.phase === 'idle' || state.phase === 'ready';

    el.soundBtn.setAttribute('aria-pressed', String(state.sound));
    el.note.classList.toggle('show', savingBroken);

    var checked = el.teaList.querySelector('input[value="' + t.id + '"]');
    if (checked) checked.checked = true;
  }

  var lastTitle = '';
  function setTitle(left) {
    var t = tea();
    var title = state.phase === 'running' ? clock(left) + ' · ' + t.name
              : state.phase === 'paused'  ? clock(left) + ' paused'
              : state.phase === 'ready'   ? t.name + ' is ready'
              : 'Tea Steep Timer';
    if (title === lastTitle) return;
    lastTitle = title;
    document.title = title;
    if (bridge.setTitle) bridge.setTitle(title).catch(function () {});
  }

  function say(message) { el.live.textContent = message; }

  /* ---------- timer ---------- */

  var frame = null;
  function loop() {
    frame = null;
    if (state.phase !== 'running') return;
    if (Date.now() >= state.deadline) { finish(); return; }
    paint();
    frame = requestAnimationFrame(loop);
  }
  function tick() { if (frame === null) frame = requestAnimationFrame(loop); }

  function start() {
    audio();
    if (state.phase === 'ready') return;
    if (state.phase === 'running') { pause(); return; }
    var left = state.phase === 'paused' ? state.remainingMs : durationS(state.steep) * 1000;
    state.deadline = Date.now() + left;
    state.phase = 'running';
    say(ORDINAL[state.steep] + ' started, ' + clock(left) + ' to go.');
    render();
    tick();
  }

  function pause() {
    state.remainingMs = Math.max(0, state.deadline - Date.now());
    state.phase = 'paused';
    say('Paused with ' + clock(state.remainingMs) + ' left.');
    render();
  }

  function resetTimer() {
    state.phase = 'idle';
    state.remainingMs = 0;
    el.ready.hidden = true;
    render();
  }

  function finish() {
    var t = tea();
    var mark = t.id + ':' + state.steep;
    if (state.done.indexOf(mark) === -1) state.done.push(mark);
    state.phase = 'ready';
    state.remainingMs = 0;
    render();
    chime();

    el.readyTitle.textContent = t.name + ' is ready';
    el.readyBody.textContent = state.steep < 2
      ? 'Lift the leaves out now — they have another steep in them.'
      : 'Third steep done. These leaves have given what they have.';
    el.nextBtn.hidden = state.steep >= 2;
    el.nextBtn.textContent = 'Start ' + (state.steep === 0 ? '2nd' : '3rd') + ' steep';
    el.doneBtn.textContent = state.steep >= 2 ? 'Start over' : 'Done for now';
    el.ready.hidden = false;
    if (el.nextBtn.hidden) el.doneBtn.focus(); else el.nextBtn.focus();

    say(t.name + ' is ready. ' + ORDINAL[state.steep] + ' finished.');
    if (bridge.notify) bridge.notify(t.name + ' is ready — ' + ORDINAL[state.steep] + ' done.').catch(function () {});
  }

  /* ---------- interactions ---------- */

  function pickTea(id) {
    if (state.teaId === id) return;
    state.teaId = id;
    state.steep = 0;
    resetTimer();
    save();
  }

  function adjust(delta) {
    var next = Math.min(MAX_S, Math.max(MIN_S, durationS(state.steep) + delta));
    if (next === defaultFor(state.steep)) delete state.custom[key(state.steep)];
    else state.custom[key(state.steep)] = next;
    if (state.phase === 'paused') state.phase = 'idle';
    save();
    render();
  }

  el.startBtn.addEventListener('click', start);
  el.resetBtn.addEventListener('click', function () { resetTimer(); say('Timer reset.'); });
  el.minus.addEventListener('click', function () { adjust(-STEP_S); });
  el.plus.addEventListener('click', function () { adjust(STEP_S); });
  el.revert.addEventListener('click', function () {
    delete state.custom[key(state.steep)];
    if (state.phase === 'paused') state.phase = 'idle';
    save();
    render();
  });
  el.soundBtn.addEventListener('click', function () {
    state.sound = !state.sound;
    if (state.sound) audio();
    save();
    render();
  });
  el.nextBtn.addEventListener('click', function () {
    state.steep = Math.min(2, state.steep + 1);
    resetTimer();
    start();
    el.startBtn.focus();
  });
  el.doneBtn.addEventListener('click', function () {
    if (state.steep >= 2) state.steep = 0;
    resetTimer();
    el.startBtn.focus();
  });

  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' || tag === 'INPUT') return;
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state.phase !== 'ready') start();
    } else if (e.key === 'r' || e.key === 'R') {
      if (state.phase === 'running' || state.phase === 'paused') { e.preventDefault(); resetTimer(); say('Timer reset.'); }
    } else if (e.key === 'Escape' && state.phase === 'ready') {
      el.doneBtn.click();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.phase === 'running') {
      if (Date.now() >= state.deadline) finish(); else tick();
    }
  });

  /* ---------- boot ---------- */

  buildTeaList();
  buildSteeps();

  load().then(function (prefs) {
    if (prefs && typeof prefs === 'object') {
      var known = TEAS.some(function (t) { return t.id === prefs.teaId; });
      if (known) state.teaId = prefs.teaId;
      if (typeof prefs.sound === 'boolean') state.sound = prefs.sound;
      if (prefs.custom && typeof prefs.custom === 'object') {
        Object.keys(prefs.custom).forEach(function (k) {
          var v = prefs.custom[k];
          if (typeof v === 'number' && v >= MIN_S && v <= MAX_S && /^[a-z]+:[0-2]$/.test(k)) state.custom[k] = v;
        });
      }
    }
  }).catch(function () {
    savingBroken = true;
  }).then(function () {
    render();
    el.app.classList.add('in');
    el.app.setAttribute('aria-hidden', 'false');
    el.boot.classList.add('out');
    setTimeout(function () { el.boot.hidden = true; }, 320);
  });
})();
</script>
</body>
</html>
