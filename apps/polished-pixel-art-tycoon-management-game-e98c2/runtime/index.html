body{background:#0d1826;image-rendering:pixelated}
.app{background:#0d1826;background-image:linear-gradient(#122135,#0d1826 42%,#141d27)}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background-image:linear-gradient(45deg,rgba(255,255,255,.022) 25%,transparent 25% 75%,rgba(255,255,255,.022) 75%);background-size:4px 4px}
.px{image-rendering:pixelated;display:block;flex:none}
.plate,.panel,.win{background:var(--plate);background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%),linear-gradient(45deg,rgba(0,0,0,.045) 25%,transparent 25% 75%,rgba(0,0,0,.045) 75%);background-size:4px 4px;background-position:0 0,2px 2px;border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge),5px 5px 0 rgba(3,8,15,.5);color:var(--ink);border-radius:0}
.panel:before{display:none}
.inset{background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;background:var(--cap);box-shadow:inset 0 2px 0 var(--cap-hi),inset 0 -2px 0 rgba(0,0,0,.35);border-bottom:2px solid var(--edge);color:#dcecf7;font-size:9px;letter-spacing:1.7px;text-transform:uppercase}
.cap b{color:var(--gold);font-weight:400;letter-spacing:1.2px}
.pad{padding:13px}
/* topbar */
.topbar{position:relative;z-index:5;height:auto;min-height:58px;padding:8px 14px;gap:12px;background:#1b3348;background-image:linear-gradient(#2a4a63,#16293a);border-bottom:3px solid var(--edge);box-shadow:inset 0 2px 0 #4a7396;backdrop-filter:none}
.brand{gap:9px;min-width:auto}.brand-mark{display:none}
.brand-title{font-size:15px;letter-spacing:2.4px;color:#ffe6ae;text-shadow:2px 2px 0 #10202e}
.brand-sub{color:#8fb4c6;letter-spacing:1.6px}
.top-metrics{gap:8px;flex-wrap:wrap}
.day-note{padding:5px 8px;font-size:9px;letter-spacing:1.2px;color:var(--ink2)}
.icon-btn{border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);background:var(--plate);color:var(--ink);box-shadow:0 0 0 2px var(--edge),2px 2px 0 rgba(3,8,15,.5);padding:7px 9px;font-size:9px;letter-spacing:1.2px;font-weight:700}
.icon-btn:hover{background:var(--plate-hi);color:var(--ink)}
.icon-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 2px var(--edge)}
.save{color:#9fe4d8;font-size:9px;letter-spacing:1px;padding:5px 6px}
/* world strip */
.world{position:relative;z-index:2;padding:0;border-bottom:3px solid var(--edge);display:block}
#scene{display:block;image-rendering:pixelated}
.brief h1{font-size:19px;text-shadow:2px 2px 0 #0a1420;letter-spacing:0}
.brief p{color:#c8d8dd;font-size:10px}
.brief .hint{color:var(--gold);text-shadow:1px 1px 0 #0a1420}
.eyebrow{color:#8fdcd0;text-shadow:1px 1px 0 #0a1420}
.resource{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;font-size:8px;letter-spacing:1.1px;color:var(--ink2);background:var(--plate);border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge)}
.resource strong{display:inline;margin:0;font-size:12px;color:var(--ink)}
.resource.cash strong{color:#7a4e05}.resource.teal strong{color:#155e57}
/* tabs */
.tabs{position:relative;z-index:3;gap:5px;padding:9px 14px 0;border-bottom:3px solid var(--edge);background:#16283a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.tab{border:2px solid;border-color:var(--plate) var(--plate-dk) var(--plate-dk) var(--plate);background:var(--plate-lo);color:#2b2118;box-shadow:0 0 0 2px var(--edge);padding:7px 11px;font-size:9px;letter-spacing:1.3px;font-weight:700;margin-bottom:5px}
.tab:hover{background:var(--plate);color:var(--ink)}
.tab.active{background:var(--amber);border-color:var(--amber-hi) var(--amber-lo) var(--amber-lo) var(--amber-hi);color:#2c1d06;transform:translateY(1px)}
main{position:relative;z-index:2;padding:18px 16px 44px;max-width:1240px}
.view-head h2{color:#ffe6ae;text-shadow:2px 2px 0 #0a1420;font-size:17px}
.view-head p{color:#a3b6bd;font-size:10px}
.label{color:#8fdcd0;text-shadow:1px 1px 0 #0a1420}
/* buttons */
.button{border:2px solid;border-color:var(--amber-hi) var(--amber-lo) var(--amber-lo) var(--amber-hi);background:var(--amber);color:#2c1d06;box-shadow:0 0 0 2px var(--edge),3px 3px 0 rgba(3,8,15,.5);padding:9px 12px;font-size:9px;letter-spacing:1.1px;font-weight:800;text-transform:uppercase}
.button:hover{filter:none;background:var(--amber-hi);transform:none}
.button:active{transform:translate(2px,2px);box-shadow:0 0 0 2px var(--edge)}
.button.secondary{background:#3f7f86;border-color:#6fbcbd #1f5359 #1f5359 #6fbcbd;color:#eafcfb}
.button.secondary:hover{background:#4c959a}
.button.ghost{background:var(--plate-lo);border-color:var(--plate) var(--plate-dk) var(--plate-dk) var(--plate);color:var(--ink);box-shadow:0 0 0 2px var(--edge),3px 3px 0 rgba(3,8,15,.5)}
.button.ghost:hover{background:var(--plate)}
.button.danger{background:#b4483a;border-color:#e07f6d #6d2318 #6d2318 #e07f6d;color:#ffe8de}
.button:disabled{opacity:1;filter:grayscale(.72) brightness(.82);cursor:not-allowed;transform:none}
/* camp */
.camp{background:#243a4d;background-image:none;padding:0;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi)}
.camp:after{display:none}
.camp-copy{padding:15px;max-width:none;color:var(--ink)}
.camp-copy h3{font-size:21px;letter-spacing:-.4px;color:#ffe6ae;text-shadow:2px 2px 0 #101c28}
.camp-copy p{color:#c6d5d5;font-size:10px}
.camp-visual{display:none}
.stat{padding:11px;background:var(--plate);border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge);display:flex;align-items:center;gap:10px}
.stat small{color:var(--ink2);letter-spacing:1.1px;display:block}
.stat strong{font-size:19px;color:var(--ink);margin-top:2px}
.stat em{color:#1f6a63;font-size:9px}
.contract{border-bottom:2px dashed rgba(60,42,22,.3)}
.contract h4{color:var(--ink);font-size:10px;letter-spacing:.6px}
.contract p{color:var(--ink2);font-size:9px}
.reward{color:#7a4e05}
.contract progress{height:8px;border:2px solid var(--plate-dk);background:#332718}
.contract progress::-webkit-progress-bar{background:#332718}
.contract progress::-webkit-progress-value{background:var(--teal)}
/* site cards */
.site-grid{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.site-card{background:var(--plate);background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%);background-size:4px 4px;border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge),5px 5px 0 rgba(3,8,15,.5);color:var(--ink);padding:0;min-height:0}
.site-card:after{display:none}
.site-card.locked{filter:grayscale(.62) brightness(.9);opacity:1}
.site-art{border-bottom:2px solid var(--edge);background:#3c6688;overflow:hidden;position:relative}
.site-art img{width:100%;height:auto}
.site-art .status{position:absolute;top:5px;right:5px;z-index:2}
.site-card{display:flex;flex-direction:column}
.site-inner{padding:11px;display:flex;flex-direction:column;flex:1}
.site-card h3{color:var(--ink);font-size:11px;margin:0 0 3px;letter-spacing:.4px}
.country{color:var(--ink2);font-size:8px;letter-spacing:1.1px;margin-bottom:8px}
.desc{color:#4e3b26;font-size:9px;min-height:26px}
.site-meta{color:var(--ink2);gap:4px 6px;font-size:8px}
.site-meta b{color:#3b2c1a;font-weight:700;font-size:9px}
.status{background:#284a63;color:#cfe8f2;border:2px solid;border-color:var(--cap-hi) #14293a #14293a var(--cap-hi);font-size:8px;padding:3px 5px;letter-spacing:1px}
.status.lock{background:#6b5c44;color:#efe4cc;border-color:#8f7d5f #3b3122 #3b3122 #8f7d5f}
.locked-note{color:#5b4526;font-size:9px}
/* dig */
.dig-main{padding:0}
.dig-inner{padding:14px}
.dig-title h2{color:#ffe6ae;text-shadow:2px 2px 0 #101c28;font-size:15px}
.dig-title p{color:var(--ink2);font-size:9px}
.reading{background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);color:#c3ae87;font-size:8px;letter-spacing:1px;min-width:62px}
.reading b{color:var(--gold);font-size:13px}
.reading.teal b{color:var(--teal-hi)}
.progress{height:14px;background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);box-shadow:none;padding:2px}
.progress span{background:var(--teal);background-image:linear-gradient(90deg,var(--teal) 0 50%,var(--teal-hi) 50%);background-size:6px 100%}
.progress span:after{display:none}
.grid-wrap{padding:8px;background:#6b4a33;background-image:linear-gradient(45deg,rgba(0,0,0,.09) 25%,transparent 25% 75%,rgba(0,0,0,.09) 75%);background-size:4px 4px;border:2px solid;border-color:#9c7248 #3d2a1d #3d2a1d #9c7248;box-shadow:0 0 0 2px var(--edge)}
.dig-grid{gap:4px}
.tile{border:2px solid;border-color:#a67c50 #4a3324 #4a3324 #a67c50;background-color:#7d5a3f;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;box-shadow:none;display:grid;place-items:center;padding:0}
.tile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--amber-hi) #6b4718 #6b4718 var(--amber-hi);background-color:#a0764b;filter:brightness(1.12)}
.tile.signal{border-color:var(--amber-hi) #7a5217 #7a5217 var(--amber-hi);animation:beacon 1.1s steps(2,end) infinite}
.tile.signal:after{content:"";position:absolute;inset:0;background:rgba(255,208,116,.16);pointer-events:none}
.tile.dug{background-color:#3d2d21;border-color:#5b4433 #241a12 #241a12 #5b4433;animation:none}
.tile.find{background-color:#2c5f5c;border-color:var(--teal-hi) #123f3c #123f3c var(--teal-hi)}
.tile.hazard{background-color:#7b4038;border-color:#d08375 #3f1a15 #3f1a15 #d08375}
.tile img{width:76%;height:auto}
.tile-num{color:rgba(255,235,196,.3);font-size:7px;z-index:1}
.tool{border:2px solid;border-color:var(--plate) var(--plate-dk) var(--plate-dk) var(--plate);background:var(--plate-lo);color:var(--ink);box-shadow:0 0 0 2px var(--edge);padding:6px 8px;font-size:8px;letter-spacing:.8px;display:flex;align-items:center;gap:6px;text-align:left;font-weight:700}
.tool small{color:#5d4a30;letter-spacing:.4px;font-weight:400;margin-top:2px}
.tool.active{background:var(--amber);border-color:var(--amber-hi) var(--amber-lo) var(--amber-lo) var(--amber-hi);color:#2c1d06}
.tool.active small{color:#6b4711}
.tool:disabled{filter:grayscale(.7) brightness(.85);cursor:not-allowed}
.dig-hint{color:var(--gold);text-shadow:1px 1px 0 #0a1420;font-size:9px}
.side-panel h3{color:var(--ink);font-size:10px;letter-spacing:1.3px}
.weather{background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);border-left-width:4px;border-left-color:var(--teal);color:#c9b48f;font-size:9px;gap:8px}
.weather strong{color:#ffe6ae}.weather span{color:#a2916f;font-size:8px}
.banner{background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);color:#f0cf95;font-size:9px}
.find-row{border-bottom:2px dashed rgba(60,42,22,.3);grid-template-columns:auto 1fr auto}
.find-list{max-height:214px;gap:2px}
.dig-readings,.tool-list{flex-wrap:wrap}
.tool span{display:block}
.find-row b{color:var(--ink);font-size:10px}
.find-row small{color:var(--ink2);font-size:8px}
.value{color:#7a4e05;font-weight:700}
.find-icon,.fossil-icon{width:auto;height:auto;background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);padding:2px;box-shadow:none}
.empty-find{color:#7d6845;border:2px dashed var(--plate-dk);background:rgba(51,39,24,.14);font-size:9px}
/* collection */
.collection-grid{grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.fossil-card{background:var(--plate);background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%);background-size:4px 4px;border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge),5px 5px 0 rgba(3,8,15,.5);color:var(--ink);min-height:0}
.fossil-card h3{color:var(--ink);font-size:11px}
.species{color:var(--ink2);font-size:8px;letter-spacing:.6px}
.rarity{top:9px;right:9px;font-size:8px;padding:2px 4px;border:2px solid var(--edge);background:#332718;letter-spacing:1px}
.common{color:#cdbfa4}.uncommon{color:#8fe0a0}.rare{color:#6fd3e1}.epic{color:#d8a8ff}.legendary{color:#ffc561}
.fossil-details{color:var(--ink2);margin:12px 0 auto;font-size:8px}
.fossil-details b{color:#3b2c1a;font-size:10px}
.empty-state{border:2px dashed var(--plate-dk);background:rgba(203,183,143,.07);padding:34px 20px}
.empty-state h3{color:#ffe6ae;font-size:13px}
.empty-state p{color:#a3b6bd;font-size:10px}
.empty-icon{margin-bottom:12px;display:flex;justify-content:center}
/* shop */
.shop-grid{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.shop-group{color:#8fdcd0;text-shadow:1px 1px 0 #0a1420;letter-spacing:1.6px;margin:14px 0 0}
.shop-item{background:var(--plate);background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%);background-size:4px 4px;border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge),4px 4px 0 rgba(3,8,15,.5);color:var(--ink);min-height:0;padding:11px}
.shop-item.owned{background:#a9c0a2;border-color:#d3e2cc #6c8264 #6c8264 #d3e2cc}
.shop-icon{margin-bottom:8px}
.shop-item h3{color:var(--ink);font-size:10px;letter-spacing:.5px}
.shop-item p{color:#4e3b26;font-size:9px}
.price{color:#7a4e05;font-weight:700}
.owned-tag{background:#3c6b3f;color:#dff5db;border:2px solid;border-color:#5f9161 #1f3f22 #1f3f22 #5f9161;font-size:8px;letter-spacing:1px;padding:4px 6px}
/* museum */
.exhibit{padding:15px;margin-bottom:12px}
.exhibit h3{color:var(--ink);font-size:12px}
.exhibit p{color:var(--ink2);font-size:9px}
.income{color:#7a4e05;font-weight:700}
.exhibit-progress{height:12px;background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk);padding:2px;margin:12px 0 10px}
.exhibit-progress span{background:var(--teal);background-image:linear-gradient(90deg,var(--teal) 0 50%,var(--teal-hi) 50%);background-size:6px 100%}
.specimen{width:auto;height:auto;padding:3px;background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk)}
.specimen.missing{opacity:.4}
.specimen:after{display:none}
.museum-list h3{color:var(--ink)}
.museum-find{border-bottom:2px dashed rgba(60,42,22,.3)}
.museum-find strong{color:var(--ink);font-size:10px}
.museum-find small{color:var(--ink2);font-size:8px}
.rep-burst{background:#3c6b3f;border:2px solid;border-color:#5f9161 #1f3f22 #1f3f22 #5f9161;color:#e2f6de;font-size:9px}
.rep-burst b{color:#fff0b8}
/* modal */
.modal-backdrop{background:rgba(6,12,20,.8);backdrop-filter:none}
.modal{background:var(--plate);background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%);background-size:4px 4px;border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge),8px 8px 0 rgba(3,8,15,.55);color:var(--ink);padding:18px}
.modal:before{display:none}
.modal h2{color:var(--ink);font-size:15px;letter-spacing:.2px}
.modal p{color:#4e3b26;font-size:10px}
.modal-icon{margin-bottom:10px;display:flex}
.event-choice{background:var(--plate-lo);border:2px solid;border-color:var(--plate) var(--plate-dk) var(--plate-dk) var(--plate);box-shadow:0 0 0 2px var(--edge);color:var(--ink);font-size:9px;line-height:1.5}
.event-choice:hover{background:var(--plate);border-color:var(--amber-hi) var(--amber-lo) var(--amber-lo) var(--amber-hi)}
.event-choice b{color:#2b2118;font-size:10px}
.tutorial-step{background:#332718;border:2px solid;border-color:var(--plate-dk) var(--plate-hi) var(--plate-hi) var(--plate-dk)}
.tutorial-step b{color:var(--gold);font-size:11px;letter-spacing:1px}
.tutorial-step span{color:#c3ae87;font-size:9px}
/* toasts + fx */
.toast{background:var(--plate);border:2px solid;border-color:var(--plate-hi) var(--plate-dk) var(--plate-dk) var(--plate-hi);box-shadow:0 0 0 2px var(--edge),4px 4px 0 rgba(3,8,15,.5);color:var(--ink);font-size:9px;letter-spacing:.5px;font-weight:700;display:flex;align-items:center;gap:8px;max-width:300px}
.toast.teal{background:#a9c0a2;border-color:#d3e2cc #6c8264 #6c8264 #d3e2cc}
.toast.warn{background:#d9a08f;border-color:#f0c6b8 #8a4f3f #8a4f3f #f0c6b8}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;animation:fly .62s steps(7,end) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes beacon{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.quake{animation:quake .34s steps(2,end) 2}
@keyframes quake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
/* responsive excavation sizing: content changes never resize a tile */
html,body{min-width:0}
.app{width:100%;min-width:0}
.world,.tabs,main,.dig-layout,.dig-main,.dig-side{min-width:0}
.dig-toolbar{flex-wrap:wrap;align-items:flex-start}
.grid-wrap{width:100%;max-width:640px;margin-inline:auto}
.dig-grid{width:100%;aspect-ratio:6/5;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-rows:unset}
.tile{width:100%;height:100%;min-width:0;min-height:0;aspect-ratio:1}
.tile img{width:76%;height:76%;object-fit:contain}
.tile.find{animation:tileReveal .4s steps(2,end) both}
@keyframes tileReveal{0%{opacity:.55;filter:brightness(1.35)}100%{opacity:1;filter:brightness(1)}}
@media(max-width:940px){.dig-layout{grid-template-columns:minmax(0,1fr)}.dig-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
@media(max-width:620px){.dig-side{display:flex}.dig-inner{padding:10px}.dig-toolbar{gap:8px}.dig-readings{width:100%}.reading{flex:1;min-width:0}.grid-wrap{padding:6px}}
/* collection cards stay readable instead of stretching across wide panels */
.collection-grid{grid-template-columns:repeat(auto-fit,minmax(212px,280px));justify-content:start;align-items:start}
.fossil-card{width:100%;max-width:280px;justify-self:start}
/* ---- top strip: framed scene beside the briefing, resource plates on their own row ---- */
.world{display:flex;flex-direction:column;gap:8px;padding:10px 14px 11px;background:#16283a;background-image:linear-gradient(45deg,rgba(255,255,255,.02) 25%,transparent 25% 75%,rgba(255,255,255,.02) 75%);background-size:4px 4px}
.world-top{display:flex;align-items:stretch;gap:14px;min-width:0}
/* 320x104 is an exact 2x of the 160x52 canvas, so the pixels stay square */
.scene-wrap{flex:0 0 320px;height:104px;position:relative;overflow:hidden;border:2px solid;border-color:#4a7396 #14293a #14293a #4a7396;box-shadow:0 0 0 2px var(--edge);background:linear-gradient(180deg,#365d7c 0 47%,#4f3b31 47% 54%,#79583f 54% 100%)}
#scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:100%;width:auto;max-width:none;z-index:1}

function Sp(w,h){return{w:w,h:h,d:new Array(w*h).fill(null)}}
function st(s,x,y,c){x=Math.round(x);y=Math.round(y);if(c==null||x<0||y<0||x>=s.w||y>=s.h)return;s.d[y*s.w+x]=c}
function gt(s,x,y){if(x<0||y<0||x>=s.w||y>=s.h)return null;return s.d[y*s.w+x]}
function rc(s,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)st(s,x+i,y+j,c)}
function dc(s,cx,cy,r,c){for(let y=Math.floor(cy-r)-1;y<=Math.ceil(cy+r)+1;y++)for(let x=Math.floor(cx-r)-1;x<=Math.ceil(cx+r)+1;x++){const a=x+0.5-cx,b=y+0.5-cy;if(a*a+b*b<=r*r)st(s,x,y,c)}}
function rg(s,cx,cy,r,c){for(let y=Math.floor(cy-r)-2;y<=Math.ceil(cy+r)+2;y++)for(let x=Math.floor(cx-r)-2;x<=Math.ceil(cx+r)+2;x++){const a=x+0.5-cx,b=y+0.5-cy,d=Math.sqrt(a*a+b*b);if(d<=r+0.5&&d>=r-0.5)st(s,x,y,c)}}
function ln(s,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;for(;;){st(s,x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}}
function pg(s,pts,c){let a=1e9,b=-1e9;pts.forEach(p=>{a=Math.min(a,p[1]);b=Math.max(b,p[1])});for(let y=Math.floor(a);y<=Math.ceil(b);y++){const yc=y+0.5,xs=[];for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];if((p[1]<=yc&&q[1]>yc)||(q[1]<=yc&&p[1]>yc))xs.push(p[0]+(yc-p[1])/(q[1]-p[1])*(q[0]-p[0]))}xs.sort((m,n)=>m-n);for(let i=0;i+1<xs.length;i+=2)for(let x=Math.round(xs[i]);x<Math.round(xs[i+1]);x++)st(s,x,y,c)}}
function shd(s,c){const o=[];for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const v=gt(s,x,y);if(v==null||v===c)continue;if(gt(s,x,y+1)==null||gt(s,x+1,y)==null)o.push([x,y])}o.forEach(p=>st(s,p[0],p[1],c))}

new field day.<br><span style="color:#63d2c8">Donate specimens</span> to grow it; sell when cash is tight.</div><button class="button secondary" data-go="museum">See museum collections →</button></div>'}
function renderBoard(){let h=sites.map(s=>{let locked=s.unlock>state.rep,t=Math.round(s.travel*(has('maps')?.8:1)),afford=state.cash>=t;return '<article class="site-card '+(locked?'locked':'')+'"><div class="site-art">'+pic('site_'+s.id,6,'',s.name+' terrain')+'<span class="status '+(locked?'lock':'')+'">'+(locked?'LOCKED':'OPEN ROUTE')+'</span></div><div class="site-inner"><h3>'+s.name+'</h3><div class="country">'+s.country+'</div><div class="desc">'+s.desc+'</div><div class="site-meta"><span>TRAVEL<b>'+(t?money(t):'FREE')+'</b></span><span>DANGER<b>'+s.danger+'</b></span><span>FOSSILS<b>'+s.fossils+'</b></span><span>EXPECTED<b>'+s.expected+'</b></span></div>'+(locked?'<div class="locked-note">Needs '+s.unlock+' reputation · '+(s.unlock-state.rep)+' more to go</div>':'<button class="button'+(afford?'':' ghost')+'" data-start="'+s.id+'"'+(afford?'':' disabled')+'>'+(afford?'Start expedition →':'Need '+money(t-state.cash)+' more')+'</button>')+'</div></article>'}).join('');$('#view-expeditions').innerHTML='<div class="view-head"><div><div class="eyebrow">Route atlas · '+state.visitedSites.length+' range(s) charted</div><h2>Expedition board</h2><p>Choose a site, pay the route, and read the ground one tile at a time.</p></div><div style="font-size:10px;color:var(--gold)">✦ '+state.rep+' reputation</div></div><div class="site-grid">'+h+'</div><div class="label">How the board works</div><div class="panel" style="padding:14px;font-size:10px;color:#aebfc0;line-height:1.6">Every range has its own weather, hazard profile, fossil table, and value ceiling. New routes open when your museum story gets loud enough.</div>'}
function makeDig(id){const s=site(id),n=30,danger={Low:1,Medium:2,High:3,Extreme:4}[s.danger]||1;
 const order=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=order[i];order[i]=order[j];order[j]=t}
 const spots=order.slice(0,4+Math.min(3,danger)),haz=order.slice(spots.length,spots.length+danger);
 const reveal=2+(has('scanner')?2:0)+(has('drone')?3:0),shown=spots.slice(0,Math.min(reveal,spots.length));
 return{siteId:id,startedAt:Date.now(),dug:0,finds:[],tool:'shovel',event:null,total:n,
  tiles:Array.from({length:n},(_,i)=>({dug:false,spot:spots.indexOf(i)>=0,haz:haz.indexOf(i)>=0,signal:shown.indexOf(i)>=0,kind:'dirt',dirt:i%3}))}}
function start(id){let s=site(id);if(s.unlock>state.rep){ping('The curator needs '+(s.unlock-state.rep)+' more reputation for that range.','warn');return}let travel=Math.round(s.travel*(has('maps')?.8:1));if(state.cash<travel){ping('Route needs '+money(travel-state.cash)+' more in the account.','warn');return}state.cash-=travel;state.energy=state.maxEnergy+(has('water')?3:0);state.durability=state.maxDurability+(has('steel')?4:0);state.activeSite=id;state.activeDig=makeDig(id);if(!state.visitedSites.includes(id))state.visitedSites.push(id);state.expeditions++;save();go('dig');drawScene();ping(s.name+' — expedition underway. Follow the amber signals.','teal');burst(window.innerWidth/2,170,['#efb44d','#ffd26e','#c86c4d','#f6ead2'],14)}
function roll(s){const all=Object.values(fossils),pick=a=>a[Math.floor(Math.random()*a.length)];
 /* site fossil lists are written for players ("Ammonites"), so match loosely against the species table */
 const local=s.fossils.split(' · ').map(x=>{const n=x.replace(/s$/,'').toLowerCase();return all.find(f=>f.species.toLowerCase()===x.toLowerCase()||f.species.toLowerCase()===n)}).filter(Boolean);
 const f=(local.length&&Math.random()>.22)?pick(local):pick(all);
 let r=pick(f.rarities);
 if(has('pickaxe')&&Math.random()<.18)r=f.rarities[Math.min(f.rarities.length-1,f.rarities.indexOf(r)+1)];
 const v=Math.round(f.base*mult(r)*(has('brush')?1.15:1)*(.88+Math.random()*.3));
 return{id:'f-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),species:f.species,group:f.group,icon:f.icon,rarity:r,value:v,condition:condition(r),site:s.name,day:state.day}}
function dig(i,cx,cy){let d=state.activeDig;if(!d||!d.tiles[i]||d.tiles[i].dug)return;let cost={shovel:[1,1],brush:[1,0],pickaxe:[2,2]}[d.tool]||[1,1],tile=d.tiles[i];if(state.energy<cost[0]||state.durability<cost[1]){ping('Your kit is spent. Pack the expedition, then upgrade at camp.','warn');return}state.energy-=cost[0];state.durability-=cost[1];tile.dug=true;tile.signal=false;d.dug++;
 const fx=(c,n)=>{if(cx!=null)burst(cx,cy,c,n)};
 if(tile.spot){let f=roll(site(d.siteId),i);d.finds.push(f);tile.kind='find';tile.find=f;ping('FOSSIL · '+f.species+' · '+rarityName(f.rarity),'teal');fx(['#f6ead2','#ffd26e','#65d4c8','#dbc6a2'],16)}
 else if((tile.haz||tile.kind==='hazard')&&Math.random()>(has('geologist')?.3:0)){state.energy=Math.max(0,state.energy-2);tile.kind='hazard';ping('WASHOUT · lost 2 energy clearing the rubble','warn');fx(['#d9584a','#8b6347','#5c4130'],12);quake('.dig-main')}
 else{tile.kind='dug';fx(['#8b6347','#5c4130','#b08256'],7);if(Math.random()<.08){let f=roll(site(d.siteId),i+3);d.finds.push(f);tile.kind='find';tile.find=f;ping('BONUS FIND · '+f.species,'teal')}else ping('Shale and grit. Nothing sleeping here.')}
 if(has('power')&&d.dug%5===0){let n=d.tiles.findIndex(x=>!x.dug);if(n>=0){d.tiles[n].dug=true;d.tiles[n].kind='dug';d.dug++;ping('POWER TROWEL · cleared a neighbouring tile','teal')}}
 if(d.dug>=(d.total||30)||state.energy<=0||state.durability<=0)ping('Your field day is done. Pack the finds when ready.','warn');
 maybeEvent();save();renderDig();renderTop()}
function chooseTool(t){if(t==='brush'&&!has('brush')){ping('Unlock the Fine Brush in Upgrades first.','warn');return}if(t==='pickaxe'&&!has('pickaxe')){ping('Unlock the Pickaxe in Upgrades first.','warn');return}state.activeDig.tool=t;renderDig()}
function maybeEvent(){let d=state.activeDig;if(!d||d.event||d.dug<3||d.dug%5!==0||Math.random()>.55)return;let events=[{art:'trex',title:'Fossil bonanza breaks open',text:'A slab splits under your shovel, exposing a whole little pocket. Take the risk for a second find or mark it for later.',choices:[['Open the pocket','Find one extra fossil, lose 1 energy',()=>{state.energy=Math.max(0,state.energy-1);let f=roll(site(state.activeDig.siteId),state.activeDig.dug+8);state.activeDig.finds.push(f);ping('FOSSIL BONANZA · '+f.species,'teal')}],['Mark the pocket','+$65 for the promising lead',()=>{state.cash+=65;ping('A collector paid for your promising lead.')}]]},{art:'g_crates',title:'A crate takes a hard knock',text:'The road out is rough and one sample is at risk. Secure the load or keep moving.',choices:[['Secure the load','Lose 1 energy, keep every find',()=>{state.energy=Math.max(0,state.energy-1);ping('The crate is secured. Nothing cracked.','teal')}],['Keep moving','Risk losing one lower-value find',()=>{if(state.activeDig.finds.length){state.activeDig.finds.sort((a,b)=>a.value-b.value);state.activeDig.finds.shift();ping('A damaged crate cost you the smallest sample.','warn')}else ping('No sample was lost, but the road was rough.','warn')}]]},{art:'g_maps',title:'A local guide waves you over',text:'“There is a ridge where the red stone rings hollow.” Take the tip or stay on your grid.',choices:[['Follow the tip','+2 energy, reveal a warm tile',()=>{state.energy+=2;let t=state.activeDig.tiles.find(x=>!x.dug);if(t)t.spot=true;ping('The guide was right. A warm signal appeared.','teal')}],['Stay focused','+$45 field bonus',()=>{state.cash+=45;ping('Steady work earns a small field bonus.')}]]},{art:'g_canopy',title:'Flash storm on the horizon',text:'Canvas snaps in the wind. Shelter the crate or race the rain for one more find.',choices:[['Shelter the crate','Lose 1 energy, protect finds',()=>{state.energy=Math.max(0,state.energy-(has('canopy')?0:1));ping('The canopy holds. Your finds stay dry.','teal')}],['Race the rain','Reveal a warm signal, risk 1 find',()=>{let t=state.activeDig.tiles.find(x=>!x.dug);if(t)t.spot=true;ping('One warm signal, but the weather is turning.','warn')}]]},{art:'g_scanner',title:'A rival team crosses your claim',text:'They offer cash for the location notes. It would help today, but they may beat you to the story.',choices:[['Sell the notes · +$80','Quick cash, lose 1 reputation',()=>{state.cash+=80;state.rep=Math.max(0,state.rep-1);ping('The rival team paid up. Keep moving.')}],['Guard the claim · +2 REP','Keep your lead and reputation',()=>{state.rep+=2;ping('The claim is yours. Reputation up.','teal')}]]}];let e=events[(state.day+d.dug)%events.length];d.event=e.title;openEvent(e)}
function openEvent(e){let r=$('#modal-root');r.innerHTML='<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-icon">'+pic(e.art||'g_maps',3,'','')+'</div><h2>'+e.title+'</h2><p>'+e.text+'</p><div class="event-choices">'+e.choices.map((c,i)=>'<button class="event-choice" data-choice="'+i+'"><b>'+c[0]+'</b>'+c[1]+'</button>').join('')+'</div></div></div>';r.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{e.choices[Number(b.dataset.choice)][2]();r.innerHTML='';save();renderAll()})}
function renderDig(){let r=$('#view-dig'),d=state.activeDig;if(!d){if(current==='dig')r.innerHTML=digEmpty();return}
 const s=site(d.siteId),total=d.total||30,cap=state.capacity+(has('crates')?2:0),spent=state.energy<=0||state.durability<=0||d.dug>=total;
 const tiles=d.tiles.map((t,i)=>{const cls=t.dug?(t.kind==='find'?'find':t.kind==='hazard'?'hazard':'dug'):(t.signal?'signal':'');
  const bg=t.dug?(t.kind==='hazard'?spr('rock',3):spr('hole',3)):spr('dirt'+((t.dirt||0)%3),3);
  const inner=t.dug?(t.kind==='find'&&t.find?pic(artOf(t.find),2,'',t.find.species):''):'<span class="tile-num">'+String(i+1).padStart(2,'0')+'</span>';
  return '<button class="tile '+cls+'" data-tile="'+i+'" style="background-image:url('+bg+')" aria-label="'+(t.dug?'Tile '+(i+1)+', already excavated':'Excavate tile '+(i+1)+(t.signal?', warm signal':''))+'"'+(t.dug?' disabled':'')+'>'+inner+'</button>'}).join('');
 const finds=d.finds.length?d.finds.map(f=>'<div class="find-row"><span class="find-icon">'+pic(artOf(f),2,'',f.species)+'</span><div><b>'+f.species+'</b><small>'+rarityName(f.rarity)+' · '+f.condition+'</small></div><div class="value">'+money(f.value)+'</div></div>').join(''):'<div class="empty-find">No specimens yet.<br>Amber-ringed tiles read warm below.</div>';
 const tool=(id,name,note,owned)=>'<button class="tool '+(d.tool===id?'active':'')+'" data-tool="'+id+'"'+(owned?'':' disabled title="Unlock this in Upgrades"')+'>'+pic(id==='shovel'?'g_spade':id==='brush'?'g_brush':'g_pick',2,'','')+'<span>'+name+'<small>'+note+'</small></span></button>';
 r.innerHTML='<div class="view-head"><div><div class="eyebrow">Active field log · '+s.country+'</div><h2>'+s.name+'</h2><p>Click a tile to excavate. The field day ends when energy or durability runs out.</p></div><button class="button ghost" data-pack="1">Pack expedition</button></div>'
 +'<div class="dig-layout"><div class="panel dig-main"><div class="cap"><span>Excavation grid · '+s.name+'</span><b id="dig-time">'+elapsed(d)+'</b></div><div class="dig-inner">'
 +'<div class="dig-toolbar"><div class="dig-title"><h2>Trench '+d.dug+' / '+total+'</h2><p>Weather: '+(s.danger==='Extreme'?'salt wind':s.danger==='High'?'dust haze':'clear overcast')+' · Hazard risk: '+s.danger+'</p></div><div class="dig-readings"><div class="reading">ENERGY<b>'+state.energy+'</b></div><div class="reading teal">DURABILITY<b>'+state.durability+'</b></div><div class="reading">CRATE<b>'+d.finds.length+'/'+cap+'</b></div></div></div>'
 +'<div class="progress"><span style="width:'+Math.round(d.dug/total*100)+'%"></span></div>'
 +'<div class="grid-wrap"><div class="dig-grid">'+tiles+'</div></div>'
 +'<div class="tool-row"><div class="tool-list">'+tool('shovel','Shovel','1 EN · 1 DUR',true)+tool('brush','Brush','1 EN · no wear',has('brush'))+tool('pickaxe','Pickaxe','2 EN · 2 DUR',has('pickaxe'))+'</div><button class="button'+(spent?'':' secondary')+'" data-pack="1">Pack &amp; return →</button></div>'
 +'<div class="dig-hint">'+(spent?'✦ The kit is spent — pack up and bring the story home.':has('scanner')?'✦ The scanner rings amber wherever bone lies close.':'✦ Amber-ringed tiles read warm. A ground scanner would reveal more.')+'</div>'
 +'</div></div><aside class="dig-side"><div class="panel side-panel"><div class="cap"><span>Field conditions</span></div><div class="pad"><div class="weather">'+pic(('site_'+s.id) in ART?'site_'+s.id:'site_montana',2,'','')+'<div><strong>'+(s.danger==='Extreme'?'Hostile ground':s.danger==='High'?'Dry and shifting':'Dry &amp; readable')+'</strong><span>'+s.fossils+'</span></div></div><div class="banner">Crate space · '+d.finds.length+' / '+cap+' finds<br><span style="color:#c3ae87">Anything over capacity stays in the field.</span></div></div></div>'
 +'<div class="panel side-panel"><div class="cap"><span>Discovered this trip</span><b>'+d.finds.length+'</b></div><div class="pad"><div class="find-list">'+finds+'</div><button class="button pack" data-pack="1">Pack expedition · '+d.finds.length+' find'+(d.finds.length===1?'':'s')+'</button></div></div></aside></div>';
 clearInterval(clock);clock=setInterval(()=>{const x=$('#dig-time');if(x&&state.activeDig)x.textContent=elapsed(state.activeDig);else clearInterval(clock)},1000);
 return}
function digEmpty(){return '<div class="empty-state"><div class="empty-icon">'+pic('g_spade',4,'','')+'</div><h3>No active expedition</h3><p>Pick a route on the expedition board, then come back here with your boots on.</p><button class="button" data-go="expeditions">Choose a site →</button></div>'}
function pack(){let d=state.activeDig;if(!d)return;if(!d.finds.length&&d.dug<1){ping('Dig at least one tile before packing.','warn');return}let max=state.capacity+(has('crates')?2:0),finds=d.finds.slice(0,max);if(has('student')&&state.expeditions===1&&finds.length<max)finds.push(roll(site(d.siteId),28));let lost=Math.max(0,d.finds.length-finds.length);state.collection.push(...finds);state.cash+=25;state.energy=Math.min(state.maxEnergy,state.energy+2);state.durability=Math.min(state.maxDurability,state.durability+(has('workshop')?2:0));state.activeDig=null;state.activeSite=null;state.day++;state.cash+=state.museumIncome;checkContracts();save();go('camp');ping(lost?'Packed '+finds.length+' finds. '+lost+' stayed in the field.':'EXPEDITION PACKED · '+finds.length+' find(s) secured!','teal')}
function contractProgress(c){if(c.id==='herbivore')return state.collection.concat(state.donated).filter(f=>f.group==='Herbivore').length;if(c.id==='rare')return state.donated.filter(f=>['rare','epic','legendary'].includes(f.rarity)).length;if(c.id==='range')return Math.min(c.goal,state.visitedSites.length);return 0}
function checkContracts(){contracts.forEach(c=>{if(!state.completedContracts.includes(c.id)&&contractProgress(c)>=c.goal){state.completedContracts.push(c.id);state.cash+=c.id==='rare'?260:c.id==='herbivore'?180:150;state.rep+=c.id==='rare'?8:c.id==='herbivore'?4:5;ping('CONTRACT COMPLETE · '+c.title,'teal')}})}
function fossilCard(f,privateView){return '<article class="fossil-card"><span class="rarity '+f.rarity+'">'+rarityName(f.rarity)+'</span><div class="fossil-head"><div class="fossil-icon">'+pic(artOf(f),3,'',f.species)+'</div><div><h3>'+f.species+'</h3><div class="species">'+f.group+' · '+f.site+'</div></div></div><div class="fossil-details"><span>CONDITION<b>'+f.condition+'</b></span><span>EST. VALUE<b>'+money(f.value)+'</b></span></div><div class="fossil-actions">'+(privateView?'<button class="button ghost" data-unarchive="'+f.id+'">Return to crates</button>':'<button class="button" data-sell="'+f.id+'">Sell</button><button class="button secondary" data-donate="'+f.id+'">Donate</button><button class="button ghost" data-archive="'+f.id+'" title="Move to private collection">Keep private</button>')+'</div></article>'}
function renderCollection(){let finds=state.collection.filter(f=>!f.archived),cards=finds.map(f=>fossilCard(f,false)).join(''),privateCount=state.collection.filter(f=>f.archived).length;$('#view-collection').innerHTML='<div class="view-head"><div><div class="eyebrow">Crate inventory · '+finds.length+' awaiting decisions</div><h2>Fossil collection</h2><p>Every discovery can fund the next dig, build the museum, or stay yours forever.</p></div><div style="font-size:10px;color:var(--gold)">'+money(finds.reduce((a,f)=>a+f.value,0))+' estimated value</div></div>'+(cards?'<div class="collection-grid">'+cards+'</div>':'<div class="empty-state"><div class="empty-icon">'+pic(privateCount?'g_crates':'ammonite',4,'','')+'</div><h3>'+(privateCount?'Your crates are clear.':'Your collection is waiting for its first story.')+'</h3><p>'+(privateCount?'Archived finds are safe in your private collection.':'Start a Montana expedition, follow the amber signal, and bring a specimen back to camp.')+'</p><button class="button '+(privateCount?'secondary':'')+'" data-go="'+(privateCount?'private':'expeditions')+'">'+(privateCount?'View private collection →':'Find a fossil →')+'</button></div>')}
function renderPrivate(){let finds=state.collection.filter(f=>f.archived),cards=finds.map(f=>fossilCard(f,true)).join('');$('#view-private').innerHTML='<div class="view-head"><div><div class="eyebrow">Personal archive · '+finds.length+' specimens kept</div><h2>Private collection</h2><p>Keep your favorite discoveries close. Archived fossils stay out of the crates, ready to admire whenever you return.</p></div><div style="font-size:10px;color:var(--gold)">'+money(finds.reduce((a,f)=>a+f.value,0))+' preserved value</div></div>'+(cards?'<div class="collection-grid">'+cards+'</div>':'<div class="empty-state"><div class="empty-icon">'+pic('g_crates',4,'','')+'</div><h3>Your private collection is empty.</h3><p>Archive a find from the Collection tab to keep it here without selling or donating it.</p><button class="button" data-go="collection">Open collection crates →</button></div>')}
function sell(id){let i=state.collection.findIndex(f=>f.id===id);if(i<0)return;let f=state.collection[i];state.cash+=f.value;state.collection.splice(i,1);ping('Sold '+f.species+' for '+money(f.value)+'.');save();renderAll()}
function donate(id){let i=state.collection.findIndex(f=>f.id===id);if(i<0)return;let f=state.collection[i];state.collection.splice(i,1);state.donated.push(f);let gain=f.rarity==='legendary'?10:f.rarity==='epic'?7:f.rarity==='rare'?5:3;if(has('lab'))gain++;if(has('preparator'))gain+=3;state.rep+=gain;state.museumIncome+=Math.round(f.value*.04*(has('wing')?1.5:1));checkContracts();ping('Donated '+f.species+' · +'+gain+' REP · museum income up!','teal');save();renderAll()}
function archive(id){let i=state.collection.findIndex(f=>f.id===id&&!f.archived);if(i<0)return;let f=state.collection[i];f.archived=true;ping(f.species+' archived in your private collection.','teal');save();go('private')}
function unarchive(id){let i=state.collection.findIndex(f=>f.id===id&&f.archived);if(i<0)return;let f=state.collection[i];f.archived=false;ping(f.species+' returned to the collection crates.');save();go('collection')}
function renderUpgrades(){let last='',h='';upgrades.forEach(u=>{if(u.group!==last){h+='<div class="shop-group">'+u.group+'</div>';last=u.group}let owned=has(u.id),locked=u.rep&&state.rep<u.rep;h+='<article class="shop-item '+(owned?'owned':'')+'"><div class="shop-icon">'+pic(GEAR_ART[u.id]||'g_spade',3,'','')+'</div><h3>'+u.name+'</h3><p>'+u.desc+'</p><div class="shop-foot">'+(owned?'<span class="owned-tag">INSTALLED</span>':'<span class="price">'+money(u.cost)+(u.rep?' · '+u.rep+' REP':'')+'</span><button class="button '+(locked?'ghost':'secondary')+'" data-buy="'+u.id+'" '+(locked||state.cash<u.cost?'disabled':'')+'>'+((locked)?'LOCKED':'Install')+'</button>')+'</div></article>'});$('#view-upgrades').innerHTML='<div class="view-head"><div><div class="eyebrow">Workshop · '+state.upgrades.length+' upgrades installed</div><h2>Upgrade shop</h2><p>Spend cash and reputation on a better field day. Effects are active immediately.</p></div><div style="font-size:10px;color:var(--gold)">'+money(state.cash)+' to spend</div></div><div class="shop-grid">'+h+'</div>'}
function buy(id){let u=upg(id);if(!u||has(id))return;if(state.cash<u.cost||state.rep<(u.rep||0)){ping('Need '+money(Math.max(0,u.cost-state.cash))+' more cash'+(u.rep&&state.rep<u.rep?' and '+(u.rep-state.rep)+' REP.':'.'),'warn');return}state.cash-=u.cost;state.upgrades.push(id);if(u.effect==='durability')state.maxDurability+=4;if(u.effect==='energy')state.maxEnergy+=3;if(u.effect==='capacity')state.capacity+=2;ping(u.name+' added to the field kit.','teal');save();renderAll()}
function renderMuseum(){let es=[{name:'The Great Herbivore Hall',desc:'Plant-eaters from the open range.',types:['Triceratops','Brachiosaurus','Ankylosaurus'],income:45},{name:'Teeth of the Frontier',desc:'Predators, talons, and sharp stories.',types:['Velociraptor','T. rex','Spinosaurus','Microraptor'],income:70},{name:'Ancient Sea Cabinet',desc:'Small wonders from before the dinosaurs.',types:['Ammonite'],income:18}],eh=es.map(e=>{let got=e.types.map(s=>state.donated.find(f=>f.species===s)),count=got.filter(Boolean).length,inc=Math.round(e.income*(has('wing')?1.5:1));return '<div class="panel exhibit"><div class="exhibit-top"><div><h3>'+e.name+'</h3><p>'+e.desc+'</p></div><div class="income">+'+money(inc)+' / DAY<br><span style="color:#91a7a8">'+count+' / '+e.types.length+' pieces</span></div></div><div class="exhibit-progress"><span style="width:'+(count/e.types.length*100)+'%"></span></div><div class="specimen-row">'+e.types.map((s,i)=>'<div class="specimen '+(got[i]?'':'missing')+'" title="'+s+(got[i]?' — on display':' — still missing')+'">'+pic(SPECIES_ART[s]||'bone',2,'',s)+'</div>').join('')+'</div></div>'}).join(''),dh=state.donated.map(f=>'<div class="museum-find"><div class="fossil-icon">'+pic(artOf(f),2,'',f.species)+'</div><div><strong>'+f.species+'</strong><small>'+rarityName(f.rarity)+' · donated day '+f.day+'</small></div></div>').join('');$('#view-museum').innerHTML='<div class="view-head"><div><div class="eyebrow">Public collections · '+state.donated.length+' specimens on display</div><h2>Museum collections</h2><p>Donations turn into reputation and recurring income as exhibits take shape.</p></div><div style="font-size:10px;color:var(--gold)">+'+money(state.museumIncome)+' / day</div></div><div class="museum-layout"><div>'+eh+'</div><aside class="panel museum-list"><h3>Donation ledger</h3>'+(dh||'<div class="empty-find">Your first donation will anchor the museum.<br>Rare finds make the biggest splash.</div>')+'<div class="rep-burst">✦ <b>'+state.rep+' reputation</b><br>Unlocks new ranges, contracts, and higher stakes.</div></aside></div>'}
function openTutorial(){let r=$('#modal-root');r.innerHTML='<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-icon">'+pic('trex',3,'','')+'</div><h2>Welcome to the frontier.</h2><p>You have a shovel, a small camp, and $500. Montana is close, forgiving, and full of stories. Start an expedition, watch for the amber signal, and click the earth to uncover your first fossil.</p><div class="tutorial-steps"><div class="tutorial-step"><b>01 · TRAVEL</b><span>Choose Montana on the Expedition board. It is free while you are starting out.</span></div><div class="tutorial-step"><b>02 · EXCAVATE</b><span>Click tiles to spend energy and durability. Warm signals are your best lead.</span></div><div class="tutorial-step"><b>03 · GROW</b><span>Pack finds, then sell for cash or donate for reputation and museum income.</span></div></div><div class="modal-actions"><button class="button" data-guide>Open the field log →</button></div></div></div>';r.querySelector('[data-guide]').onclick=()=>{state.tutorial=false;save();r.innerHTML='';ping('Your first clue is glowing in Montana.','teal')}}
function confirmReset(){let r=$('#modal-root');r.innerHTML='<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-icon">'+pic('g_maps',3,'','')+'</div><h2>Start a new field log?</h2><p>Your current company progress will be replaced. This cannot be undone.</p><div class="modal-actions"><button class="button ghost" data-close>Keep this log</button><button class="button danger" data-new>Start fresh</button></div></div></div>';r.querySelector('[data-close]').onclick=()=>r.innerHTML='';r.querySelector('[data-new]').onclick=()=>{state=fresh();save();current='camp';r.innerHTML='';renderAll();ping('A fresh field season begins.','teal');setTimeout(openTutorial,250)}}
/* every control is wired through one delegated listener, so a re-render can never drop its handlers */
const SEL='[data-view],[data-go],[data-start],[data-sell],[data-donate],[data-archive],[data-unarchive],[data-buy],[data-tool],[data-tile],[data-pack],[data-action]';
document.addEventListener('click',e=>{const el=e.target.closest(SEL);if(!el||el.disabled)return;const d=el.dataset;
 if(d.view!==undefined)return go(d.view);
 if(d.go!==undefined)return go(d.go);
 if(d.start!==undefined)return start(d.start);
 if(d.tile!==undefined){const r=el.getBoundingClientRect();return dig(Number(d.tile),r.left+r.width/2,r.top+r.height/2)}
 if(d.tool!==undefined)return chooseTool(d.tool);
 if(d.pack!==undefined)return pack();
 if(d.sell!==undefined)return sell(d.sell);
 if(d.donate!==undefined)return donate(d.donate);
 if(d.archive!==undefined)return archive(d.archive);
 if(d.unarchive!==undefined)return unarchive(d.unarchive);
 if(d.buy!==undefined)return buy(d.buy);
 if(d.action==='reset')return confirmReset();
 if(d.action==='tutorial')return openTutorial();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)drawScene()});
setTitle();
const logo=$('#brand-logo');if(logo)logo.innerHTML=pic('trex',2,'','');
sceneLoop();
load();
})()
</script>
</body>
</html>
