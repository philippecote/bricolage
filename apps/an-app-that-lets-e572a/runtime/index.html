<html lang="en">
<head>

  <style>

    .node{--x:50%;--y:50%;--z:0px;--delay:0ms;position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) translateZ(var(--z));transform-style:preserve-3d;border:1px solid #1525211f;background:#fffdf7f2;min-width:112px;max-width:145px;min-height:58px;border-radius:18px;padding:10px 12px;text-align:left;cursor:pointer;box-shadow:0 13px 30px #20312a1a;z-index:3;animation:nodeIn .52s cubic-bezier(.2,.8,.2,1) var(--delay) both;transition:box-shadow .22s,transform .22s,border-color .22s,opacity .22s}.node:hover,.node:focus-visible{outline:0;transform:translate(-50%,-50%) translateZ(calc(var(--z) + 24px)) scale(1.055);box-shadow:0 20px 42px #20312a30;border-color:#7669e873}.node small{display:block;color:var(--muted);font-size:10px;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node b{display:block;font-size:12px;line-height:1.2}.node.focus{--z:64px;min-width:150px;min-height:78px;padding:15px 17px;border:0;border-radius:23px;color:#fff;background:var(--ink);box-shadow:0 24px 52px #1525214d;cursor:default;z-index:5}.node.focus:hover{transform:translate(-50%,-50%) translateZ(var(--z))}.node.focus b{font-size:15px;letter-spacing:-.01em}.node.focus small{color:#b9c7c1;margin-top:7px}.node.component-node{background:#f7fff1;border-color:#65d4b370}.node.component-node .dot{background:var(--mint);box-shadow:0 0 0 4px #65d4b321}.node.association-node{background:#f7f5ff;border-color:#7669e86b}.node.association-node .dot{background:var(--violet);box-shadow:0 0 0 4px #7669e821}.node.previous{--z:-34px;min-width:102px;max-width:116px;background:#f0eefc;color:#4e4695;border-color:#7669e84a;box-shadow:0 8px 18px #392f8017;opacity:.86}.node.previous:hover{opacity:1}.node.previous small{color:#756dad}.node.previous .dot{background:var(--violet)}.node .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--node-color,var(--mint));right:10px;top:10px}.node.focus .dot{background:var(--lime);box-shadow:0 0 0 5px #c9f27b1f}@keyframes nodeIn{from{opacity:0;transform:translate(-50%,-50%) translateZ(-90px) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) translateZ(var(--z)) scale(1)}}
    .node.previous{--z:6px;z-index:8;opacity:.9}.pulse{position:absolute;left:50%;top:50%;width:170px;height:170px;border:1px solid #65d4b35c;border-radius:50%;transform:translate(-50%,-50%);animation:pulse 2s ease-out infinite}.pulse:nth-child(2){animation-delay:.7s}@keyframes pulse{0%{opacity:.8;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}.hint{position:absolute;z-index:9;left:50%;bottom:18px;transform:translateX(-50%);background:#ffffffd1;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:11px;white-space:nowrap}
    .welcome{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:70px 60px 40px;text-align:center}.welcome-inner{max-width:490px;animation:rise .55s ease both}.welcome .spark{width:66px;height:66px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:var(--ink);color:var(--lime);font-size:25px;box-shadow:0 18px 42px #15252138;transform:rotate(-3deg)}.welcome h1{font-family:Georgia,serif;font-weight:500;font-size:41px;line-height:1.03;letter-spacing:-.045em;margin:0}.welcome p{color:var(--muted);font-size:15px;margin:14px auto 23px;max-width:410px}.starter-list{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.starter{border:1px solid var(--line);background:#ffffffbf;border-radius:999px;padding:9px 13px;cursor:pointer;transition:.2s}.starter:hover{background:var(--lime);border-color:transparent;transform:translateY(-2px)}.welcome-actions{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}.surprise{border:0;background:var(--violet);color:#fff;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700;box-shadow:0 8px 18px #7669e833;transition:.2s}.surprise:hover{transform:translateY(-2px);box-shadow:0 11px 23px #7669e84d}.surprise span{margin-left:5px}.shortcut{font-size:11px;color:#8b9691}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .reader{min-width:0;background:var(--panel);position:relative;overflow:auto}.reader-inner{min-height:100%;padding:30px 30px 40px}.empty-reader{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;color:var(--muted)}.empty-reader .mini-orbit{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;position:relative;margin-bottom:18px}.mini-orbit:before,.mini-orbit:after{content:"";position:absolute;border-radius:50%;background:var(--mint)}.mini-orbit:before{width:12px;height:12px;left:21px;top:21px}.mini-orbit:after{width:8px;height:8px;right:-3px;top:9px;background:var(--violet)}.empty-reader h2{color:var(--ink);font:500 24px Georgia,serif;margin:0 0 7px}.empty-reader p{margin:0;max-width:270px}
    .eyebrow{display:flex;align-items:center;gap:8px;color:#7568db;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:14px}.eyebrow:before{content:"";width:20px;height:2px;background:var(--violet)}.article{animation:rise .35s ease both}.article h2{font:500 32px/1.05 Georgia,serif;letter-spacing:-.035em;margin:0 0 13px}.dek{font-size:15px;line-height:1.55;color:#3e514a;margin:0 0 12px;padding-bottom:20px;border-bottom:1px solid var(--line)}.article-meta{display:flex;gap:8px;color:#8a9590;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 21px}.article-meta strong{color:#4e5d57;font-weight:750}.prose p{font-family:Georgia,serif;font-size:15px;line-height:1.68;color:#33453f;margin:0 0 15px}.sources{margin-top:25px;padding-top:18px;border-top:1px solid var(--line)}.sources h3{font-size:10px;text-transform:uppercase;letter-spacing:.13em;margin:0 0 10px;color:var(--muted)}.source{display:flex;align-items:center;gap:8px;color:#4d43a9;text-decoration:none;padding:5px 0;font-size:12px}.source:hover{text-decoration:underline}.source span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source i{font-style:normal;width:20px;height:20px;border-radius:7px;background:#efedff;display:grid;place-items:center;flex:none}
    .loading-reader{animation:rise .3s ease both}.skeleton{height:12px;border-radius:7px;background:linear-gradient(90deg,#ecebe4 25%,#f7f6ef 50%,#ecebe4 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;margin-bottom:12px}.skeleton.title{height:34px;width:78%;margin:20px 0}.skeleton.short{width:58%}.skeleton.medium{width:87%}@keyframes shimmer{to{background-position:-200% 0}}.error-card{margin-top:20px;border:1px solid #ff8d6d59;background:#fff4ef;border-radius:18px;padding:18px}.error-card h2{font:500 24px Georgia,serif;margin:0 0 7px}.error-card p{color:#75594f;margin:0 0 15px}.retry{border:0;background:var(--ink);color:white;border-radius:10px;padding:9px 12px;font-weight:680;cursor:pointer}
    @media(max-width:720px){body{overflow:auto}.app{height:auto;min-height:100vh}.workspace{grid-template-columns:1fr;grid-template-rows:560px auto}.map-shell{border-right:0;border-bottom:1px solid var(--line)}.reader{min-height:450px}.brand span{display:none}.new-map{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><span>Curiosity Atlas</span></div><form class="search" id="searchForm" role="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><label for="topicInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Topic to explore</label><input id="topicInput" maxlength="120" autocomplete="off" placeholder="Explore any topic…"><button id="goButton" type="submit">Explore</button></form><button class="new-map" id="newMap" type="button">New map</button></header>
    <section class="workspace">
      <section class="map-shell" id="mapShell" aria-label="Topic knowledge graph"><div class="map-top" id="mapTop" hidden><nav class="trail" id="trail" aria-label="Exploration trail"></nav><div class="graph-key" aria-label="Graph legend"><span class="key-item"><i class="key-dot component"></i>Anatomy</span><span class="key-item"><i class="key-dot association"></i>Associations</span><span class="key-item"><i class="key-dot parent"></i>Previous</span></div></div><div class="welcome" id="welcome"><div class="welcome-inner"><div class="spark" aria-hidden="true">✦</div><h1>Follow your curiosity.</h1><p>Click the inner orbit to learn a topic’s anatomy. Drift outward to surf its associations.</p><div class="starter-list" id="starters"></div><div class="welcome-actions"><button class="surprise" id="surprise" type="button">Surprise me <span>↗</span></button><span class="shortcut">Press / to search</span></div></div></div><div class="canvas" id="canvas" aria-live="polite"><svg id="lines" aria-hidden="true"></svg></div><div class="hint" id="hint" hidden>Click a node to keep exploring</div></section>
      <aside class="reader" aria-label="Topic article"><div class="reader-inner" id="reader"></div></aside>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const $=s=>document.querySelector(s), els={form:$('#searchForm'),input:$('#topicInput'),go:$('#goButton'),newMap:$('#newMap'),mapShell:$('#mapShell'),welcome:$('#welcome'),starters:$('#starters'),surprise:$('#surprise'),canvas:$('#canvas'),lines:$('#lines'),mapTop:$('#mapTop'),trail:$('#trail'),hint:$('#hint'),reader:$('#reader')};
      const palette=['#65d4b3','#7669e8','#ff8d6d','#e5bd45','#58a7d8'], componentPositions=[{x:30,y:28},{x:57,y:20},{x:70,y:43},{x:61,y:72},{x:34,y:70}], associationPositions=[{x:13,y:23},{x:84,y:22},{x:91,y:50},{x:78,y:83},{x:17,y:82}], depths=[18,42,-8,28,2], previousPosition={x:10,y:51}, defaults=['The deep ocean','Memory & dreams','Ancient trade routes','How cities evolve'];
      const state={trail:[],cache:new Map(),pending:new Map(),loading:false,requestId:0,recents:[],tiltX:0,tiltY:0};
      const clean=v=>typeof v==='string'?v.trim():'';
      function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return''}}
      function api(){return window.Workshop||null} function notify(m){const w=api();if(w&&typeof w.notify==='function')w.notify(m)} function setTitle(){const w=api();if(w&&typeof w.setTitle==='function')w.setTitle('Curiosity Atlas')}
      function busy(v){state.loading=v;els.go.disabled=v;els.input.disabled=v}
      function applyScene(){els.canvas.style.transform='rotateX('+state.tiltX+'deg) rotateY('+state.tiltY+'deg)'}
      function randomTopic(){const options=['The hidden life of trees','Why we dream','The future of cities','How music changes memory','A brief history of tea','The mathematics of waves'];return options[Math.floor(Math.random()*options.length)]}
      async function loadRecents(){try{const w=api(),saved=w&&w.storage&&await w.storage.get('recent-topics');if(Array.isArray(saved))state.recents=saved.filter(v=>typeof v==='string').slice(0,4)}catch{}renderStarters()}
      async function saveRecent(t){state.recents=[t,...state.recents.filter(v=>v.toLowerCase()!==t.toLowerCase())].slice(0,4);try{const w=api();if(w&&w.storage)await w.storage.set('recent-topics',state.recents)}catch{}}
      function renderStarters(){els.starters.replaceChildren();(state.recents.length?state.recents:defaults).forEach(t=>{const b=document.createElement('button');b.className='starter';b.type='button';b.textContent=t;b.addEventListener('click',()=>start(t));els.starters.appendChild(b)})}
      function emptyReader(){els.reader.innerHTML='<div class="empty-reader"><div class="mini-orbit" aria-hidden="true"></div><h2>Your reading nook</h2><p>Choose a starting point and a short field note will appear here.</p></div>'}
      function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function loading(t){els.reader.innerHTML='<div class="loading-reader" aria-label="Loading article about '+esc(t)+'"><div class="eyebrow">Building the knowledge graph</div><div class="skeleton title"></div><div class="skeleton medium"></div><div class="skeleton short"></div><br><div class="skeleton"></div><div class="skeleton medium"></div><div class="skeleton"></div><div class="skeleton short"></div></div>';renderMap({title:t,components:[],related:[]},true)}
      function normalizePaths(items,fallback){return Array.isArray(items)?items.slice(0,5).map((r,i)=>({label:clean(r&&r.label),relation:clean(r&&r.relation)||fallback,color:palette[i]})).filter(r=>r.label):[]}
      function normalize(raw,fallback){const components=normalizePaths(raw&&raw.components,'Part of the topic'),related=normalizePaths(raw&&raw.related,'Related idea'),paragraphs=Array.isArray(raw&&raw.paragraphs)?raw.paragraphs.map(clean).filter(Boolean).slice(0,3):[];return{title:clean(raw&&raw.title)||fallback,eyebrow:clean(raw&&raw.eyebrow)||'Field note',summary:clean(raw&&raw.summary)||'A starting point for exploring '+fallback+'.',paragraphs,components,related}}
      async function requestTopic(topic,path=state.trail.slice(-4).map(n=>n.topic)){const w=api();if(!w||typeof w.callAction!=='function')throw new Error('Workshop unavailable');const response=await w.callAction('explore-topic',{topic,path}),payload=response&&(response.output||response.data||response.result||response),articlePayload=payload&&(payload.article||payload.output||payload),article=normalize(articlePayload,topic),sourcePayload=Array.isArray(payload&&payload.sources)?payload.sources:Array.isArray(response&&response.sources)?response.sources:[],sources=sourcePayload.map(s=>({title:clean(s&&s.title)||'Source',url:safeUrl(s&&s.url)})).filter(s=>s.url).slice(0,5);if(!article.components.length||!article.related.length||!article.paragraphs.length)throw new Error('Incomplete topic response');return{article,sources}}
      function fetchTopic(topic,path){const key=topic.toLowerCase();if(state.cache.has(key))return Promise.resolve(state.cache.get(key));if(state.pending.has(key))return state.pending.get(key);let job;job=requestTopic(topic,path).finally(()=>{if(state.pending.get(key)===job)state.pending.delete(key)});state.pending.set(key,job);return job}
      function prefetch(article,path){const seen=new Set(path.map(v=>v.toLowerCase()));const next=[...article.components,...article.related].filter(item=>item&&item.label&&!seen.has(item.label.toLowerCase())).slice(0,4);void Promise.all(next.map(item=>{const key=item.label.toLowerCase();if(state.cache.has(key)||state.pending.has(key))return Promise.resolve(null);return fetchTopic(item.label,[...path,item.label]).then(data=>state.cache.set(key,data)).catch(()=>null)}))}
      async function start(raw){const topic=clean(raw);if(!topic){notify('Type a topic to begin');els.input.focus();return}state.requestId++;state.trail=[];state.cache.clear();els.welcome.hidden=true;els.mapTop.hidden=false;els.hint.hidden=false;await visit(topic,true);saveRecent(topic)}
      async function visit(raw,replace=false){const topic=clean(raw);if(!topic||state.loading)return;if(replace)state.trail=[{topic}];else state.trail.push({topic});renderTrail();setTitle(topic);els.input.value='';const key=topic.toLowerCase(),cached=state.cache.get(key);if(cached){renderMap(cached.article);renderArticle(cached);return}const id=++state.requestId,path=state.trail.map(n=>n.topic);busy(true);loading(topic);try{const data=await fetchTopic(topic,path.slice(-4));if(id!==state.requestId)return;state.cache.set(key,data);renderMap(data.article);renderArticle(data);prefetch(data.article,path)}catch{if(id!==state.requestId)return;renderError(topic)}finally{if(id===state.requestId)busy(false)}}
      function goBack(){if(state.loading||state.trail.length<2)return;goTo(state.trail.length-2)}
      function goTo(i){if(state.loading||i<0||i>=state.trail.length)return;state.requestId++;state.trail=state.trail.slice(0,i+1);const t=state.trail[i].topic,data=state.cache.get(t.toLowerCase());renderTrail();setTitle(t);if(data){renderMap(data.article);renderArticle(data)}else{state.trail.pop();visit(t)}}
      function renderTrail(){els.trail.replaceChildren();state.trail.forEach((item,i)=>{if(i){const s=document.createElement('span');s.className='sep';s.textContent='›';els.trail.appendChild(s)}const crumb=document.createElement('button');crumb.type='button';crumb.className='crumb'+(i===state.trail.length-1?' current':'');crumb.textContent=item.topic;crumb.title='Return to '+item.topic;crumb.setAttribute('aria-label','Return to '+item.topic);crumb.disabled=i===state.trail.length-1;crumb.addEventListener('click',()=>goTo(i));els.trail.appendChild(crumb)});requestAnimationFrame(()=>{els.trail.scrollLeft=els.trail.scrollWidth})}
      function addLine(pos,classes='',delay=0){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','link '+classes);line.setAttribute('x1','50%');line.setAttribute('y1','50%');line.setAttribute('x2',pos.x+'%');line.setAttribute('y2',pos.y+'%');line.style.animationDelay=delay+'ms';els.lines.appendChild(line)}
      function makeNode(label,sub,classes,pos,i,click,z){const b=document.createElement('button');b.type='button';b.className='node '+classes;b.style.setProperty('--x',pos.x+'%');b.style.setProperty('--y',pos.y+'%');b.style.setProperty('--z',(z??(classes.includes('focus')?64:depths[i%depths.length]))+'px');b.style.setProperty('--delay',i*55+'ms');b.style.setProperty('--node-color',palette[i%palette.length]);const strong=document.createElement('b'),small=document.createElement('small'),dot=document.createElement('span');strong.textContent=label;small.textContent=sub;dot.className='dot';dot.setAttribute('aria-hidden','true');b.append(strong,small,dot);if(click)b.addEventListener('click',click);return b}
      function addOrbit(kind){const orbit=document.createElement('div');orbit.className='orbit '+kind;els.canvas.appendChild(orbit)}
      function renderMap(article,isLoading=false){els.canvas.querySelectorAll('.node,.pulse,.orbit').forEach(n=>n.remove());els.lines.replaceChildren();const center={x:50,y:50};applyScene();if(isLoading){const p=document.createElement('div');p.className='pulse';els.canvas.append(p,p.cloneNode());els.canvas.appendChild(makeNode(article.title,'Building the constellation','focus',center,0));return}addOrbit('inner');addOrbit('outer');els.canvas.appendChild(makeNode(article.title,'Click a path to keep learning','focus',center,0));if(state.trail.length>1){const previous=state.trail[state.trail.length-2];addLine(previousPosition,'parent-link');els.canvas.appendChild(makeNode(previous.topic,'Click to return','previous',previousPosition,0,goBack,6))}(article.components||[]).forEach((item,i)=>{const pos=componentPositions[i]||componentPositions[0];addLine(pos,'component-link',i*45);els.canvas.appendChild(makeNode(item.label,item.relation,'component-node',pos,i+1,()=>visit(item.label),depths[i%depths.length]+18))});(article.related||[]).forEach((item,i)=>{const pos=associationPositions[i]||associationPositions[0];addLine(pos,'association-link',(i+3)*45);els.canvas.appendChild(makeNode(item.label,item.relation,'association-node',pos,i+6,()=>visit(item.label),depths[i%depths.length]-8))});els.hint.textContent='Inner ring: anatomy · outer ring: associations'}
      function renderArticle(data){const a=data.article,article=document.createElement('article');article.className='article';const eyebrow=document.createElement('div'),h=document.createElement('h2'),dek=document.createElement('p'),meta=document.createElement('div'),prose=document.createElement('div');eyebrow.className='eyebrow';eyebrow.textContent=a.eyebrow;h.textContent=a.title;dek.className='dek';dek.textContent=a.summary;meta.className='article-meta';meta.innerHTML='<strong>Field note</strong><span>·</span><span>1 min read</span><span>·</span><span>'+data.sources.length+' source'+(data.sources.length===1?'':'s')+'</span>';prose.className='prose';(a.paragraphs.length?a.paragraphs:['Explore the connected ideas on the map to keep moving through '+a.title+'.']).forEach(v=>{const p=document.createElement('p');p.textContent=v;prose.appendChild(p)});article.append(eyebrow,h,dek,meta,prose);if(data.sources.length){const section=document.createElement('section'),sh=document.createElement('h3');section.className='sources';sh.textContent='Sources & further reading';section.appendChild(sh);data.sources.forEach(src=>{const link=document.createElement('a'),icon=document.createElement('i'),label=document.createElement('span');link.className='source';link.href=src.url;link.target='_blank';link.rel='noopener noreferrer';icon.textContent='↗';label.textContent=src.title;link.append(icon,label);section.appendChild(link)});article.appendChild(section)}els.reader.replaceChildren(article);els.reader.parentElement.scrollTop=0}
      function renderError(topic){renderMap({title:topic,components:[],related:[]});els.reader.innerHTML='<div class="eyebrow">Connection interrupted</div><div class="error-card"><h2>That trail went quiet.</h2><p>Your graph is still here. Try this topic again, or click the purple parent node to return.</p><button class="retry" type="button">Try again</button></div>';els.reader.querySelector('.retry').addEventListener('click',()=>{state.cache.delete(topic.toLowerCase());state.trail.pop();visit(topic)});notify('Could not load this topic')}
      function reset(){state.requestId++;state.trail=[];state.cache.clear();state.loading=false;state.tiltX=0;state.tiltY=0;busy(false);applyScene();els.canvas.querySelectorAll('.node,.pulse,.orbit').forEach(n=>n.remove());els.lines.replaceChildren();els.welcome.hidden=false;els.mapTop.hidden=true;els.hint.hidden=true;els.input.value='';emptyReader();renderStarters();setTitle();setTimeout(()=>els.input.focus(),0)}
      els.form.addEventListener('submit',e=>{e.preventDefault();start(els.input.value)});els.newMap.addEventListener('click',reset);els.surprise.addEventListener('click',()=>start(randomTopic()));if(!matchMedia('(prefers-reduced-motion: reduce)').matches){els.mapShell.addEventListener('pointermove',e=>{if(!els.welcome.hidden)return;const r=els.mapShell.getBoundingClientRect();state.tiltX=((e.clientY-r.top)/r.height-.5)*-3;state.tiltY=((e.clientX-r.left)/r.width-.5)*4;applyScene()});els.mapShell.addEventListener('pointerleave',()=>{state.tiltX=0;state.tiltY=0;applyScene()})}document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==els.input){e.preventDefault();els.input.focus()}if(e.key==='Escape'&&state.trail.length>1&&!state.loading)goTo(state.trail.length-2)});emptyReader();loadRecents();setTitle();
    })();
  </script>
