<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#29362d">
  <title>Flavor Table</title>
  <style>
    :root {
      --forest: #29362d;
      --forest-2: #39473c;
      --forest-3: #5f715f;
      --cream: #f5f3ed;
      --paper: #fffdf8;
      --paper-2: #faf8f2;
      --ink: #273029;
      --muted: #7d847b;
      --muted-2: #a3a99f;
      --line: #e5e3db;
      --accent: #d86e4c;
      --accent-dark: #b84f35;
      --accent-soft: #fae4db;
      --sage: #c8d4c0;
      --lilac: #d6d0ed;
      --gold: #efbb6a;
      --shadow: 0 18px 50px rgba(39, 48, 41, .10);
      --shadow-small: 0 8px 25px rgba(39, 48, 41, .08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(216, 110, 76, .35); outline-offset: 2px; }
    a { color: inherit; }
    img { display: block; max-width: 100%; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 208px minmax(0, 1fr); overflow: hidden; background: var(--cream); }
    .sidebar { position: relative; display: flex; min-height: 100vh; flex-direction: column; padding: 25px 16px 20px; overflow: hidden; color: #f2f2e9; background: var(--forest); }
    .sidebar::before { content: ""; position: absolute; width: 220px; height: 220px; right: -120px; top: 96px; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; box-shadow: 0 0 0 28px rgba(255,255,255,.025), 0 0 0 56px rgba(255,255,255,.018); pointer-events: none; }
    .brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 0 8px 28px; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: var(--forest); background: var(--gold); box-shadow: 0 8px 18px rgba(0,0,0,.13); }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-wordmark { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-wordmark strong { font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
    .brand-wordmark span { margin-top: 4px; color: #aebaad; font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .build-cta { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; width: 100%; margin: 0 0 24px; padding: 11px 12px; border-radius: 12px; color: #fff9f5; background: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,.12); font-size: 12px; font-weight: 750; text-align: left; transition: transform .2s ease, background .2s ease; }
    .build-cta:hover { transform: translateY(-2px); background: #e27a57; }
    .build-cta .button-plus { display: grid; width: 19px; height: 19px; place-items: center; border-radius: 7px; color: var(--accent); background: #fff5ee; font-size: 16px; line-height: 1; }
    .nav { position: relative; z-index: 1; display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px; border-radius: 11px; color: #aeb8ab; background: transparent; font-size: 12px; font-weight: 650; text-align: left; transition: color .2s ease, background .2s ease, transform .2s ease; }
    .nav-item:hover { color: #f7f5ea; background: rgba(255,255,255,.07); transform: translateX(2px); }
    .nav-item.active { color: #fffaf1; background: rgba(255,255,255,.12); }
    .nav-icon { display: grid; width: 18px; height: 18px; place-items: center; color: currentColor; }
    .nav-icon svg { width: 17px; height: 17px; stroke: currentColor; }
    .sidebar-foot { position: relative; z-index: 1; margin-top: auto; }
    .side-divider { height: 1px; margin: 0 8px 17px; background: rgba(255,255,255,.10); }
    .profile-rail { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px; border-radius: 12px; color: #f7f4eb; background: transparent; text-align: left; transition: background .2s ease; }
    .profile-rail:hover { background: rgba(255,255,255,.08); }
    .profile-avatar { display: grid; flex: 0 0 auto; width: 31px; height: 31px; place-items: center; border-radius: 10px; color: var(--forest); background: var(--sage); font-size: 10px; font-weight: 850; letter-spacing: .04em; }
    .profile-rail-copy { min-width: 0; display: flex; flex: 1; flex-direction: column; }
    .profile-rail-copy strong { overflow: hidden; color: #f7f4eb; font-size: 10px; letter-spacing: .08em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .profile-rail-copy span { overflow: hidden; margin-top: 3px; color: #aebaad; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .profile-arrow { color: #8b9a8c; font-size: 14px; }
    .sidebar-note { display: flex; gap: 8px; margin: 20px 8px 0; color: #91a092; font-size: 10px; line-height: 1.4; }
    .sidebar-note p { margin: 0; }
    .leaf-mark { color: var(--gold); font-size: 14px; line-height: 1; }

    .main-shell { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; flex: 0 0 70px; align-items: center; justify-content: space-between; gap: 20px; padding: 0 30px 0 34px; border-bottom: 1px solid var(--line); background: rgba(245,243,237,.88); }
    .breadcrumbs { display: flex; flex-direction: column; line-height: 1; }
    .breadcrumbs .top-kicker { margin-bottom: 8px; color: var(--muted-2); font-size: 9px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .breadcrumbs strong { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .global-search { display: flex; align-items: center; gap: 7px; width: 205px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: rgba(255,253,248,.6); transition: border-color .2s ease, background .2s ease, box-shadow .2s ease; }
    .global-search:focus-within { border-color: rgba(216,110,76,.55); background: var(--paper); box-shadow: 0 4px 14px rgba(39,48,41,.05); }
    .global-search svg { flex: 0 0 auto; width: 15px; height: 15px; stroke: currentColor; }
    .global-search input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .global-search input::placeholder { color: #a0a59e; }
    .top-profile { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--forest); background: var(--sage); font-size: 9px; font-weight: 850; letter-spacing: .04em; transition: transform .2s ease, box-shadow .2s ease; }
    .top-profile:hover { transform: translateY(-1px); box-shadow: var(--shadow-small); }
    .view-shell { flex: 1; min-height: 0; overflow: auto; padding: 29px 34px 42px; scroll-behavior: smooth; }
    .view-shell::-webkit-scrollbar { width: 8px; }
    .view-shell::-webkit-scrollbar-thumb { border: 2px solid var(--cream); border-radius: 99px; background: #d9d8d1; }

    .view-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; animation: rise .45s ease both; }
    .eyebrow { display: block; margin-bottom: 8px; color: var(--accent-dark); font-size: 9px; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
    .view-intro h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 4vw, 38px); font-weight: 600; letter-spacing: -.045em; line-height: .98; }
    .view-intro p { max-width: 450px; margin: 10px 0 0; color: var(--muted); font-size: 12px; }
    .quiet-link { display: inline-flex; align-items: center; gap: 7px; padding: 7px 0; color: var(--accent-dark); background: transparent; font-size: 11px; font-weight: 800; }
    .quiet-link span { font-size: 15px; transition: transform .2s ease; }
    .quiet-link:hover span { transform: translateX(3px); }
    .primary-button, .secondary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 9px 14px; border-radius: 10px; font-size: 11px; font-weight: 800; transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
    .primary-button { color: #fffaf4; background: var(--accent); box-shadow: 0 8px 18px rgba(216,110,76,.18); }
    .primary-button:hover { transform: translateY(-2px); background: var(--accent-dark); box-shadow: 0 12px 23px rgba(216,110,76,.23); }
    .secondary-button { color: var(--forest); border: 1px solid var(--line); background: var(--paper); }
    .secondary-button:hover { transform: translateY(-1px); border-color: #c8c9c0; background: #fff; box-shadow: var(--shadow-small); }
    .secondary-button.subtle { border-color: transparent; background: transparent; }
    .button-arrow { font-size: 14px; line-height: 0; }

    .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 213px; gap: 22px; animation: rise .48s .04s ease both; }
    .home-main, .home-aside { min-width: 0; }
    .hero-recipe { display: grid; grid-template-columns: minmax(0, 1.07fr) minmax(190px, .93fr); min-height: 214px; overflow: hidden; border-radius: 21px; background: var(--paper); box-shadow: var(--shadow); }
    .hero-image { position: relative; min-height: 214px; overflow: hidden; padding: 0; background: #c8d2bd; }
    .hero-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.75,.25,1); }
    .hero-recipe:hover .hero-image img { transform: scale(1.045); }
    .hero-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,33,24,0) 35%, rgba(23,33,24,.46)); pointer-events: none; }
    .image-caption { position: absolute; z-index: 1; right: 14px; bottom: 13px; left: 14px; display: flex; align-items: center; justify-content: space-between; color: #fffaf3; font-size: 9px; font-weight: 700; }
    .image-caption span:last-child { padding: 4px 7px; border-radius: 99px; color: #eff2e7; background: rgba(24,38,26,.38); backdrop-filter: blur(4px); }
    .hero-copy { display: flex; flex-direction: column; align-items: flex-start; padding: 25px 24px 21px; }
    .hero-copy .eyebrow { margin-bottom: 11px; color: var(--accent-dark); }
    .hero-copy h2 { max-width: 250px; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-weight: 600; letter-spacing: -.04em; line-height: 1.02; }
    .hero-copy p { margin: 10px 0 15px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .recipe-meta { display: flex; flex-wrap: wrap; gap: 5px 11px; margin-top: auto; color: var(--muted); font-size: 10px; font-weight: 650; }
    .recipe-meta span { display: inline-flex; align-items: center; gap: 4px; }
    .meta-dot { color: var(--accent); font-size: 15px; line-height: 5px; }
    .profile-panel { min-height: 214px; padding: 19px 17px; border: 1px solid #dfdfd5; border-radius: 17px; background: #eef1e7; }
    .profile-panel-head { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; }
    .profile-orbit { position: relative; display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; color: var(--forest); background: var(--sage); }
    .profile-orbit::after { content: ""; position: absolute; inset: -4px; border: 1px solid rgba(95,113,95,.25); border-radius: 50%; }
    .profile-orbit svg { width: 17px; height: 17px; stroke: currentColor; }
    .profile-panel h2 { margin: 2px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; letter-spacing: -.03em; }
    .profile-panel p { margin: 0 0 13px; color: var(--forest-3); font-size: 11px; line-height: 1.48; }
    .flavor-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .flavor-chip { display: inline-flex; align-items: center; min-height: 23px; padding: 4px 8px; border-radius: 99px; color: var(--forest-2); background: rgba(255,255,255,.60); font-size: 9px; font-weight: 750; }
    .profile-edit { display: inline-flex; align-items: center; gap: 5px; margin-top: 16px; padding: 0; color: var(--forest-2); background: transparent; font-size: 10px; font-weight: 800; }
    .profile-edit span { font-size: 13px; transition: transform .2s ease; }
    .profile-edit:hover span { transform: translateX(2px); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 25px 0 12px; }
    .section-head h2 { margin: 0; font-size: 12px; font-weight: 850; letter-spacing: .02em; }
    .section-head p { margin: 0; color: var(--muted); font-size: 10px; }
    .recipe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    .recipe-card { position: relative; min-width: 0; overflow: hidden; border: 1px solid transparent; border-radius: 15px; background: var(--paper); transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
    .recipe-card:hover { border-color: #e1dfd6; transform: translateY(-3px); box-shadow: var(--shadow-small); }
    .recipe-open { display: block; width: 100%; padding: 0; color: inherit; background: transparent; text-align: left; }
    .recipe-image-wrap { position: relative; display: block; height: 104px; overflow: hidden; background: #d6d8ca; }
    .recipe-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
    .recipe-card:hover .recipe-image-wrap img { transform: scale(1.05); }
    .match-label { position: absolute; top: 9px; left: 9px; padding: 4px 7px; border-radius: 99px; color: #fffaf1; background: rgba(41,54,45,.72); font-size: 8px; font-weight: 850; letter-spacing: .04em; backdrop-filter: blur(4px); }
    .recipe-card-copy { display: block; min-height: 76px; padding: 11px 12px 10px; }
    .recipe-card-copy h3 { overflow: hidden; margin: 0 24px 7px 0; font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; text-overflow: ellipsis; white-space: nowrap; }
    .recipe-card-copy p { overflow: hidden; margin: 0; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .favorite-button { position: absolute; z-index: 2; top: 111px; right: 9px; display: grid; width: 25px; height: 25px; place-items: center; border: 1px solid rgba(229,227,219,.86); border-radius: 50%; color: #8b9189; background: rgba(255,253,248,.92); box-shadow: 0 3px 7px rgba(0,0,0,.05); transition: color .2s ease, transform .2s ease, background .2s ease; }
    .favorite-button:hover { color: var(--accent); transform: scale(1.08); }
    .favorite-button.active { color: #fff7f1; border-color: var(--accent); background: var(--accent); }
    .favorite-button svg { width: 13px; height: 13px; stroke: currentColor; }
    .home-aside { display: flex; flex-direction: column; gap: 13px; }
    .aside-section { padding: 17px; border-top: 1px solid var(--line); }
    .aside-section:first-child { padding-top: 2px; border-top: 0; }
    .aside-section h3 { margin: 0 0 6px; font-size: 11px; font-weight: 850; }
    .aside-section p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .signal-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .signal-track { flex: 1; height: 5px; overflow: hidden; border-radius: 99px; background: #e1e5dc; }
    .signal-track span { display: block; width: 86%; height: 100%; border-radius: inherit; background: var(--forest-3); }
    .signal-line small { color: var(--forest-3); font-size: 9px; font-weight: 850; }
    .week-snapshot { display: grid; gap: 7px; margin-top: 12px; }
    .week-snapshot-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 10px; }
    .week-snapshot-row strong { overflow: hidden; max-width: 120px; color: var(--ink); font-size: 10px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

    .discover-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .search-field { display: flex; flex: 1; align-items: center; gap: 8px; max-width: 390px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); }
    .search-field svg { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); stroke: currentColor; }
    .search-field input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .search-field input::placeholder { color: #a0a59e; }
    .result-count { margin-left: auto; color: var(--muted); font-size: 10px; font-weight: 700; }
    .ingredient-strip { display: flex; align-items: center; gap: 7px; overflow-x: auto; margin-bottom: 22px; padding-bottom: 2px; scrollbar-width: none; }
    .ingredient-strip::-webkit-scrollbar { display: none; }
    .ingredient-label { flex: 0 0 auto; margin-right: 3px; color: var(--muted); font-size: 10px; font-weight: 750; }
    .ingredient-button { flex: 0 0 auto; padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--forest-2); background: transparent; font-size: 10px; font-weight: 750; transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease; }
    .ingredient-button:hover, .ingredient-button.active { border-color: var(--forest-3); color: #fff; background: var(--forest-3); transform: translateY(-1px); }
    .discover-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .empty-state { display: grid; min-height: 215px; place-items: center; padding: 28px; border: 1px dashed #d5d6cd; border-radius: 16px; color: var(--muted); background: rgba(255,253,248,.42); text-align: center; }
    .empty-state .empty-icon { display: grid; width: 39px; height: 39px; place-items: center; margin: 0 auto 11px; border-radius: 14px; color: var(--forest-2); background: var(--sage); }
    .empty-state .empty-icon svg { width: 18px; height: 18px; stroke: currentColor; }
    .empty-state h3 { margin: 0 0 5px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; letter-spacing: -.03em; }
    .empty-state p { max-width: 310px; margin: 0 auto 15px; font-size: 11px; line-height: 1.5; }

    .builder-layout { display: grid; grid-template-columns: minmax(230px, .75fr) minmax(0, 1.25fr); gap: 20px; align-items: start; animation: rise .45s ease both; }
    .builder-form { padding: 19px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-small); }
    .builder-form h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 600; letter-spacing: -.04em; }
    .builder-form > p { margin: 7px 0 19px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .field-label { display: flex; align-items: baseline; justify-content: space-between; margin: 15px 0 7px; color: var(--ink); font-size: 10px; font-weight: 850; }
    .field-label span { color: var(--muted-2); font-size: 9px; font-weight: 650; }
    .builder-textarea { display: block; width: 100%; min-height: 81px; resize: vertical; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; outline: 0; color: var(--ink); background: var(--paper-2); font-size: 11px; line-height: 1.45; }
    .builder-textarea:focus { border-color: rgba(216,110,76,.58); background: #fff; }
    .builder-textarea::placeholder { color: #a0a59e; }
    .ingredient-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 39px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-2); }
    .ingredient-editor:focus-within { border-color: rgba(216,110,76,.58); background: #fff; }
    .ingredient-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 6px; color: var(--forest-2); background: var(--sage); font-size: 9px; font-weight: 750; }
    .ingredient-tag button { display: grid; width: 12px; height: 12px; place-items: center; padding: 0; border-radius: 50%; color: var(--forest-2); background: transparent; font-size: 12px; line-height: 1; }
    .ingredient-input { flex: 1 1 70px; min-width: 60px; padding: 3px 2px; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 10px; }
    .ingredient-input::placeholder { color: #a0a59e; }
    .choice-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .choice-button { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; font-size: 9px; font-weight: 750; transition: color .2s ease, background .2s ease, border-color .2s ease; }
    .choice-button:hover { border-color: #b8bdb4; color: var(--forest); }
    .choice-button.active { border-color: var(--forest-3); color: #fff; background: var(--forest-3); }
    .builder-submit { width: 100%; margin-top: 19px; }
    .builder-helper { display: flex; gap: 5px; margin: 11px 0 0; color: var(--muted-2); font-size: 9px; line-height: 1.4; }
    .builder-helper svg { flex: 0 0 auto; width: 13px; height: 13px; stroke: var(--forest-3); }
    .inline-error { display: flex; gap: 7px; margin-top: 12px; padding: 9px 10px; border-radius: 9px; color: #8f4433; background: #fbe9e3; font-size: 10px; line-height: 1.35; }
    .inline-error strong { font-weight: 850; }
    .builder-result { min-width: 0; min-height: 435px; overflow: hidden; border-radius: 18px; background: var(--forest); color: #f7f4eb; box-shadow: var(--shadow); }
    .builder-result.empty-builder { display: flex; flex-direction: column; justify-content: space-between; min-height: 435px; padding: 23px; background: var(--forest); }
    .builder-result.empty-builder .result-top { max-width: 280px; }
    .builder-result.empty-builder .eyebrow { color: var(--gold); }
    .builder-result.empty-builder h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 600; letter-spacing: -.05em; line-height: 1.02; }
    .builder-result.empty-builder p { max-width: 270px; margin: 11px 0 0; color: #b3c0b1; font-size: 11px; line-height: 1.55; }

      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
      }

      function cleanText(value, limit, fallback) {
        const cleaned = String(value == null ? "" : value).replace(/[<>]/g, "").trim().slice(0, limit);
        return cleaned || (fallback || "");
      }

      function normalizeKey(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
      }

      function initials(name) {
        const parts = cleanText(name, 50, "My profile").split(/\s+/).filter(Boolean);
        return parts.slice(0, 2).map((part) => part[0]).join("").toUpperCase() || "FT";
      }

      function safeList(value, limit, itemLimit) {
        return Array.isArray(value) ? value.map((item) => cleanText(item, itemLimit || 38, "")).filter(Boolean).slice(0, limit) : [];
      }

      function normalizeRecipe(raw, id, imageIndex) {
        const source = raw && typeof raw === "object" ? raw : {};
        const ingredients = Array.isArray(source.ingredients) ? source.ingredients.map((entry) => ({
          amount: cleanText(entry && entry.amount, 32, "to taste"),
          item: cleanText(entry && entry.item, 60, "seasonal produce")
        })).filter((entry) => entry.item).slice(0, 10) : [];
        const steps = safeList(source.steps, 7, 220);
        const tags = safeList(source.tags, 5, 26);
        return {
          id: cleanText(id || source.id, 80, "recipe"),
          title: cleanText(source.title, 90, "A profile-matched dinner"),
          description: cleanText(source.description, 240, "A simple recipe shaped around the flavors you like."),
          time: cleanText(source.time, 24, "30 min"),
          difficulty: cleanText(source.difficulty, 24, "Easy"),
          servings: cleanText(source.servings, 24, "2"),
          tags: tags.length ? tags : ["profile-matched", "weeknight"],
          ingredients: ingredients.length ? ingredients : [{ amount: "as needed", item: "seasonal ingredients" }],
          steps: steps.length ? steps : ["Gather the ingredients and season to taste.", "Cook until tender and fragrant.", "Finish with something bright and serve warm."],
          profileNote: cleanText(source.profileNote, 250, "A balance of savory depth and a bright finish, tuned to your profile."),
          pairing: cleanText(source.pairing, 160, "Serve with something crisp and fresh."),
          image: IMAGES[Number.isFinite(imageIndex) ? imageIndex % IMAGES.length : 0]
        };
      }

      function defaultPlanner() {
        const recipes = BASE_RECIPES;
        const notes = ["Start bright", "Quick night", "Deep umami", "Crisp + smoky", "Cozy bowl", "Fresh finish", "Leftover-friendly"];
        return WEEKDAYS.map((day, index) => ({ day, recipeId: recipes[index % recipes.length].id, title: recipes[index % recipes.length].title, note: notes[index], time: recipes[index % recipes.length].time }));
      }

      function sanitizeProfile(raw) {
        const profile = raw && typeof raw === "object" ? raw : {};
        return {
          name: cleanText(profile.name, 50, DEFAULT_PROFILE.name),
          likes: safeList(profile.likes, 8, 28).length ? safeList(profile.likes, 8, 28) : DEFAULT_PROFILE.likes.slice(),
          avoids: safeList(profile.avoids, 5, 28),
          heat: PROFILE_HEAT.includes(profile.heat) ? profile.heat : DEFAULT_PROFILE.heat,
          tempo: PROFILE_TEMPO.includes(profile.tempo) ? profile.tempo : DEFAULT_PROFILE.tempo,
          notes: cleanText(profile.notes, 180, DEFAULT_PROFILE.notes)
        };
      }

      function sanitizeState(raw) {
        const value = raw && typeof raw === "object" ? raw : {};
        const generated = Array.isArray(value.generatedRecipes) ? value.generatedRecipes.map((recipe, index) => normalizeRecipe(recipe, recipe && recipe.id ? recipe.id : `generated-${index + 1}`, index + 1)).slice(0, 12) : [];
        const allIds = new Set(BASE_RECIPES.concat(generated).map((recipe) => recipe.id));
        const planner = Array.isArray(value.planner) && value.planner.length === 7 ? value.planner.map((entry, index) => {
          const source = entry && typeof entry === "object" ? entry : {};
          const id = typeof source.recipeId === "string" && allIds.has(source.recipeId) ? source.recipeId : null;
          const match = id ? BASE_RECIPES.concat(generated).find((recipe) => recipe.id === id) : null;
          return { day: WEEKDAYS[index], recipeId: id, title: cleanText(source.title, 90, match ? match.title : "Choose a dinner"), note: cleanText(source.note, 100, "Open to a new favorite"), time: cleanText(source.time, 24, match ? match.time : "—") };

          planner

      function getAllRecipes() {

      function getRecipe(id) {

      function getHostStorage() {
        return window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function" ? window.storage : null;
      }

      async function loadState() {
        let raw = null;
        try {
          const hostStorage = getHostStorage();
          if (hostStorage) {
            raw = await hostStorage.get(STORAGE_KEY);
          } else if (window.localStorage) {
            const stored = window.localStorage.getItem(STORAGE_KEY);
            raw = stored ? JSON.parse(stored) : null;
          }
        } catch (error) {
          raw = null;
        }
        state = sanitizeState(typeof raw === "string" ? (() => { try { return JSON.parse(raw); } catch (error) { return {}; } })() : raw);
      }

      async function persistState() {
        const hostStorage = getHostStorage();
        const payload = { profile: state.profile, savedIds: state.savedIds, favoriteIds: state.favoriteIds, generatedRecipes: state.generatedRecipes, planner: state.planner };
        try {
          if (hostStorage) {
            await hostStorage.set(STORAGE_KEY, payload);
          } else if (window.localStorage) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          }
        } catch (error) {
          // The app remains usable if durable storage is unavailable.
        }
      }

      function queuePersist() {
        saveQueue = saveQueue.then(() => persistState()).catch(() => undefined);
        return saveQueue;
      }

      function hostNotify(message) {
        try {
          if (typeof window.notify === "function") window.notify(message);
        } catch (error) { /* host notifications are optional */ }
        toast.textContent = message;

        clearTimeout(toastTimer);

      }

      function renderBuilderResult(recipe) {
        return `<section class="recipe-result"><div class="result-hero"><div class="result-hero-image">${imageMarkup(recipe, "", recipe.title)}</div><div class="result-hero-copy"><span class="eyebrow">Built around your profile</span><h2>${esc(recipe.title)}</h2><p>${esc(recipe.description)}</p><div class="result-actions"><button class="small-button accent" data-open-recipe="${esc(recipe.id)}" type="button">Open full recipe <span>↗</span></button><button class="small-button${state.savedIds.includes(recipe.id) ? " active" : ""}" data-save-recipe="${esc(recipe.id)}" type="button">${state.savedIds.includes(recipe.id) ? "Saved" : "Save recipe"}</button><button class="small-button" data-add-to-week="${esc(recipe.id)}" type="button">Add to week</button></div></div></div><div class="result-content"><div><h3>Gather</h3><ul class="ingredient-list">${recipe.ingredients.slice(0, 8).map((item) => `<li><strong>${esc(item.amount)}</strong><span>${esc(item.item)}</span></li>`).join("")}</ul></div><div><h3>Make it</h3><ol class="step-list">${recipe.steps.slice(0, 5).map((step) => `<li>${esc(step)}</li>`).join("")}</ol></div><div class="profile-note"><strong>Why it fits</strong>${esc(recipe.profileNote)}</div></div>${builderSources.length ? sourceMarkup(builderSources) : ""}</section>`;
      }

      function safeSourceUrl(source) {
        const url = source && typeof source.url === "string" ? source.url.trim() : "";
        return /^https:\/\//i.test(url) ? url.slice(0, 500) : "#";
      }

      function sourceMarkup(sources) {
        if (!Array.isArray(sources) || !sources.length) return "";
        return `<p class="source-line">Sources: ${sources.slice(0, 3).map((source) => `<a href="${esc(safeSourceUrl(source))}" target="_blank" rel="noreferrer">${esc(source && source.title ? source.title : "Web source")}</a>`).join(" · ")}</p>`;
      }

      function renderBuilder() {
        let resultMarkup = "";
        if (builderBusy) {
          resultMarkup = `<section class="loading-panel"><div><div class="spinner" aria-hidden="true"></div><h2>Finding your dinner.</h2><p>Balancing what you have with the flavors you love…</p></div></section>`;
        } else if (builderResult) {
          resultMarkup = renderBuilderResult(builderResult);
        } else {
          const examples = ["something bright with chickpeas", "a cozy mushroom dinner", "use up greens and herbs"];
          resultMarkup = `<section class="builder-result empty-builder"><div class="result-top"><span class="eyebrow">Your kitchen, your rules</span><h2>Tell me what you’re in the mood for.</h2><p>The builder keeps your profile in the room, then fills in the delicious details.</p></div><div class="suggestion-list">${examples.map((example) => `<button class="suggestion-button" data-builder-example="${esc(example)}" type="button"><span>${esc(example)}</span><span>→</span></button>`).join("")}</div></section>`;
        }
        return `<section class="view-intro"><div><span class="eyebrow">Profile-aware recipe builder</span><h1>Make something yours.</h1><p>Give it a craving and a few ingredients. It will keep the result aligned with your flavor signal.</p></div></section>
          <div class="builder-layout"><form class="builder-form" data-builder-form><h2>Build a recipe</h2><p>Use your own words. The more context you give it, the more specific the dinner becomes.</p><label class="field-label" for="builder-request">What are you after? <span>optional</span></label><textarea class="builder-textarea" id="builder-request" placeholder="e.g. a quick dinner with lemon, greens, and a little crunch">${esc(builderRequest)}</textarea><div class="field-label">What do you have? <span>press Enter to add</span></div><div class="ingredient-editor">${renderBuilderIngredients()}<input class="ingredient-input" id="builder-ingredient-input" placeholder="Add an ingredient…" autocomplete="off"></div><div class="field-label">Set the direction</div><div class="choice-row">${["Weeknight", "One pan", "Plant-forward", "Comforting"].map((option) => `<button class="choice-button${builderOptions.has(option) ? " active" : ""}" data-builder-option="${esc(option)}" type="button" aria-pressed="${builderOptions.has(option)}">${esc(option)}</button>`).join("")}</div>${builderError ? `<div class="inline-error"><strong>Fallback draft</strong><span>${esc(builderError)}</span></div>` : ""}<button class="primary-button builder-submit${builderBusy ? " busy-button" : ""}" type="submit">${builderBusy ? "Building…" : "Build with my profile"} <span class="button-arrow">↗</span></button><p class="builder-helper"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8 14 9l5.2 2-5.2 2-2 5.2-2-5.2-5.2-2 5.2-2 2-5.2Z"/><path d="m19 3 .7 1.8L21.5 5l-1.8.7L19 7.5l-.7-1.8-1.8-.7 1.8-.7L19 3Z"/></svg><span>Built from your tastes: ${esc(profileSummary().toLowerCase())}.</span></p></form><div id="builder-result">${resultMarkup}</div></div>`;
      }

      function plannerRecipe(entry) {
        return entry && entry.recipeId ? getRecipe(entry.recipeId) : null;
      }

      function renderDayTile(entry, index) {
        const recipe = plannerRecipe(entry);
        const title = recipe ? recipe.title : entry.title;
        return `<article class="day-tile"><div class="day-top"><strong>${esc(entry.day.slice(0, 3))}</strong><span>${index === 0 ? "next" : ""}</span></div>${recipe ? `<div class="day-image">${imageMarkup(recipe, "", recipe.title)}</div>` : `<div class="day-empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>`}<div class="day-body"><h3>${esc(title)}</h3><p>${esc(entry.note)}</p><div class="day-controls"><span class="day-time">${esc(entry.time)}</span><button class="swap-button" data-swap-open="${index}" type="button">Swap</button></div></div></article>`;
      }

      function shoppingItems() {
        const names = [];
        state.planner.forEach((entry) => {
          const recipe = plannerRecipe(entry);
          if (recipe) recipe.ingredients.slice(0, 3).forEach((item) => names.push(item.item));
        });
        const seen = new Set();
        return names.filter((name) => { const key = normalizeKey(name); if (seen.has(key)) return false; seen.add(key); return true; }).slice(0, 9);
      }

      function renderSwapTray() {
        if (swapDayIndex == null) return "";
        const choices = getAllRecipes().slice(0, 6);
        return `<div class="swap-tray"><span class="swap-tray-label">Swap ${esc(WEEKDAYS[swapDayIndex])} for</span>${choices.map((recipe) => `<button class="swap-option" data-swap-recipe="${esc(recipe.id)}" data-swap-index="${swapDayIndex}" type="button">${imageMarkup(recipe, "", recipe.title)}<span>${esc(recipe.title)}</span></button>`).join("")}<button class="small-button" data-swap-close type="button">Close</button></div>`;
      }

      function renderPlanner() {
        const plannedCount = state.planner.filter((entry) => entry.recipeId).length;
        return `<section class="view-intro planner-head"><div><span class="eyebrow">Seven dinners, one calmer week</span><h1>Plan the week.</h1><p>Build a balanced run of meals around ${esc(profileSummary().toLowerCase())}, then swap anything that doesn’t fit.</p></div><button class="primary-button${plannerBusy ? " busy-button" : ""}" data-generate-plan type="button">${plannerBusy ? "Planning…" : "Build my week"} <span class="button-arrow">↗</span></button></section>
          <div class="planner-band"><div class="planner-band-copy"><span class="planner-band-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.8v3.3M16 3.8v3.3M4 9.2h16M8 12.7h.01M12 12.7h.01M16 12.7h.01M8 16.2h.01M12 16.2h.01"/></svg></span><div><strong>Your seven-day rhythm</strong><p>${esc(state.profile.tempo)} · ${esc(state.profile.heat.toLowerCase())} heat · ${esc(state.profile.likes.slice(0, 2).join(" + ").toLowerCase())}</p></div></div><span class="planner-status">${plannedCount}/7 planned</span></div>
          <div class="week-grid">${state.planner.map(renderDayTile).join("")}</div>${renderSwapTray()}${plannerError ? `<div class="inline-error" style="margin-top:11px"><strong>Local plan ready</strong><span>${esc(plannerError)}</span></div>` : ""}
          <div class="plan-lower"><section class="plan-section"><h2>Gather once</h2><p>A short, profile-friendly starting list from this week.</p><div class="shopping-list">${shoppingItems().map((item) => `<span class="shopping-item">${esc(item)}</span>`).join("")}</div></section><section class="planner-note"><strong>Make room for the good part</strong><p>Leave one flexible night open. That’s where a new favorite usually finds you.</p></section></div>${plannerSources.length ? sourceMarkup(plannerSources) : ""}`;
      }

      function renderSaved() {
        const ids = savedFilter === "favorites" ? state.favoriteIds : state.savedIds;
        const recipes = ids.map((id) => getRecipe(id)).filter(Boolean);
        const label = savedFilter === "favorites" ? "favorites" : "saved recipes";
        const empty = savedFilter === "favorites" ? "Favorites are for the recipes you want to make again soon." : "Save a recipe when it feels like your kind of dinner. It will stay here.";
        return `<section class="view-intro"><div><span class="eyebrow">Keep the good ones close</span><h1>Your collection.</h1><p>Recipes you’ve saved and favorites you want to remember, all in one place.</p></div><button class="secondary-button" data-view="discover" type="button">Find another <span class="button-arrow">→</span></button></section><div class="saved-tabs"><button class="saved-tab${savedFilter === "saved" ? " active" : ""}" data-saved-tab="saved" type="button">Saved <span>${state.savedIds.length}</span></button><button class="saved-tab${savedFilter === "favorites" ? " active" : ""}" data-saved-tab="favorites" type="button">Favorites <span>${state.favoriteIds.length}</span></button></div>${recipes.length ? `<div class="recipe-grid discover-grid">${recipes.map(recipeCard).join("")}</div>` : `<div class="empty-state"><div><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5h11a1.5 1.5 0 0 1 1.5 1.5v14l-7-4-7 4V6a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="M12 8v5M9.5 10.5h5"/></svg></div><h3>Your ${esc(label)} are still open.</h3><p>${esc(empty)}</p><button class="primary-button" data-view="discover" type="button">Explore recipes <span class="button-arrow">→</span></button></div></div>`}`;
      }

      function renderLoading() {
        appView.innerHTML = `<div class="loading-shell"><div><div class="spinner" aria-hidden="true"></div><p>Setting the table…</p></div></div>`;
      }

      function render() {
        if (!state) return;
        updateChrome();
        const markup = currentView === "discover" ? renderDiscover() : currentView === "build" ? renderBuilder() : currentView === "planner" ? renderPlanner() : currentView === "saved" ? renderSaved() : renderHome();
        appView.innerHTML = markup;
        if (currentView === "discover") renderDiscoverResults();
      }

      function navigate(view) {
        currentView = view;
        swapDayIndex = null;
        render();
        appView.focus({ preventScroll: true });
      }

      function openProfile() {
        profileDraft = JSON.parse(JSON.stringify(state.profile));
        renderProfileModal();
      }

      function renderProfileModal() {
        if (!profileDraft) return;
        modalRoot.innerHTML = `<div class="modal-backdrop" data-modal-backdrop><section class="dialog profile-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-dialog-title"><button class="modal-close" data-modal-close type="button" aria-label="Close profile">×</button><span class="eyebrow">Your flavor signal</span><h2 id="profile-dialog-title">Tune the table.</h2><p>These choices steer recipe builds, discovery, and your weekly rhythm.</p><div class="profile-group"><label for="profile-name-input">Profile name</label><input class="profile-name-input" id="profile-name-input" data-profile-field="name" value="${esc(profileDraft.name)}" maxlength="50"></div><div class="profile-group"><h3>Reach for more of</h3><div class="profile-choice-grid">${PROFILE_LIKES.map((choice) => `<button class="profile-choice${profileDraft.likes.includes(choice) ? " selected" : ""}" data-profile-like="${esc(choice)}" type="button" aria-pressed="${profileDraft.likes.includes(choice)}">${esc(choice)}</button>`).join("")}</div></div><div class="profile-group"><h3>Usually skip</h3><div class="profile-choice-grid">${PROFILE_AVOIDS.map((choice) => `<button class="profile-choice avoid${profileDraft.avoids.includes(choice) ? " selected" : ""}" data-profile-avoid="${esc(choice)}" type="button" aria-pressed="${profileDraft.avoids.includes(choice)}">${esc(choice)}</button>`).join("")}</div></div><div class="profile-group"><h3>Heat level</h3><div class="profile-choice-grid">${PROFILE_HEAT.map((choice) => `<button class="profile-choice${profileDraft.heat === choice ? " selected" : ""}" data-profile-heat="${esc(choice)}" type="button" aria-pressed="${profileDraft.heat === choice}">${esc(choice)}</button>`).join("")}</div></div><div class="profile-group"><h3>Cooking tempo</h3><div class="profile-choice-grid">${PROFILE_TEMPO.map((choice) => `<button class="profile-choice${profileDraft.tempo === choice ? " selected" : ""}" data-profile-tempo="${esc(choice)}" type="button" aria-pressed="${profileDraft.tempo === choice}">${esc(choice)}</button>`).join("")}</div></div><div class="profile-group"><label for="profile-notes-input">A note for the builder</label><textarea class="profile-notes-input" id="profile-notes-input" data-profile-field="notes" maxlength="180">${esc(profileDraft.notes)}</textarea></div><div class="profile-footer"><button class="secondary-button" data-modal-close type="button">Cancel</button><button class="primary-button" data-save-profile type="button">Save profile</button></div></section></div>`;
        const first = modalRoot.querySelector("#profile-name-input");
        if (first && !profileDraft._focused) { first.focus(); profileDraft._focused = true; }
      }

      function renderRecipeModal(recipe) {
        const saved = state.savedIds.includes(recipe.id);
        const favorite = state.favoriteIds.includes(recipe.id);
        modalRoot.innerHTML = `<div class="modal-backdrop" data-modal-backdrop><section class="dialog recipe-dialog" role="dialog" aria-modal="true" aria-labelledby="recipe-dialog-title"><button class="modal-close" data-modal-close type="button" aria-label="Close recipe">×</button><div class="recipe-dialog-image">${imageMarkup(recipe, "", recipe.title)}</div><div class="recipe-dialog-copy"><span class="eyebrow">${esc(recipe.tags.slice(0, 3).join(" · "))}</span><h2 id="recipe-dialog-title">${esc(recipe.title)}</h2><p class="recipe-dialog-description">${esc(recipe.description)}</p><div class="recipe-dialog-meta"><span>◷ ${esc(recipe.time)}</span><span>◌ ${esc(recipe.difficulty)}</span><span>♧ ${esc(recipe.servings)} servings</span></div><div class="result-actions"><button class="small-button${saved ? " active" : ""}" data-save-recipe="${esc(recipe.id)}" type="button">${saved ? "Saved" : "Save recipe"}</button><button class="small-button${favorite ? " active" : ""}" data-favorite-recipe="${esc(recipe.id)}" type="button">${favorite ? "Favorited" : "Add favorite"}</button><button class="small-button accent" data-toggle-day-picker type="button">Add to week</button></div>${showDayPicker ? `<div class="day-picker"><span class="day-picker-label">Choose a night</span><div class="day-picker-grid">${WEEKDAYS.map((day, index) => `<button data-plan-day="${index}" type="button">${esc(day.slice(0, 3))}</button>`).join("")}</div></div>` : ""}<div class="recipe-dialog-section"><h3>Gather</h3><ul class="ingredient-list">${recipe.ingredients.map((item) => `<li><strong>${esc(item.amount)}</strong><span>${esc(item.item)}</span></li>`).join("")}</ul></div><div class="recipe-dialog-section"><h3>Make it</h3><ol class="step-list">${recipe.steps.map((step) => `<li>${esc(step)}</li>`).join("")}</ol></div><div class="profile-note"><strong>Why it fits</strong>${esc(recipe.profileNote)}</div><div class="recipe-dialog-section"><h3>Alongside</h3><p style="margin:0;color:var(--muted);font-size:10px;line-height:1.45">${esc(recipe.pairing)}</p></div></div></section></div>`;
      }

      function openRecipe(id) {
        const recipe = getRecipe(id);
        if (!recipe) return;
        activeRecipeId = id;
        showDayPicker = false;
        renderRecipeModal(recipe);
      }

      function closeModal() {
        modalRoot.innerHTML = "";
        activeRecipeId = null;
        showDayPicker = false;
        profileDraft = null;
      }

      function toggleId(list, id) {
        return list.includes(id) ? list.filter((item) => item !== id) : list.concat(id);
      }

      function toggleSaved(id) {
        if (!getRecipe(id)) return;
        const wasSaved = state.savedIds.includes(id);
        state.savedIds = toggleId(state.savedIds, id);
        queuePersist();
        hostNotify(wasSaved ? "Removed from saved recipes." : "Saved to your collection.");
        render();
        if (activeRecipeId === id) renderRecipeModal(getRecipe(id));
      }

      function toggleFavorite(id) {
        if (!getRecipe(id)) return;
        const wasFavorite = state.favoriteIds.includes(id);
        state.favoriteIds = toggleId(state.favoriteIds, id);
        queuePersist();
        hostNotify(wasFavorite ? "Removed from favorites." : "Added to favorites.");
        render();
        if (activeRecipeId === id) renderRecipeModal(getRecipe(id));
      }

      function addRecipeToDay(recipeId, index) {
        const recipe = getRecipe(recipeId);
        if (!recipe || !Number.isInteger(index) || index < 0 || index > 6) return;
        state.planner[index] = { day: WEEKDAYS[index], recipeId: recipe.id, title: recipe.title, note: "A new favorite to try", time: recipe.time };
        queuePersist();
        hostNotify(`${recipe.title} added to ${WEEKDAYS[index]}.`);
        closeModal();
        navigate("planner");
      }

      function findRecipeByTitle(title) {
        const key = normalizeKey(title);
        if (!key) return null;
        return getAllRecipes().find((recipe) => normalizeKey(recipe.title) === key || normalizeKey(recipe.title).includes(key) || key.includes(normalizeKey(recipe.title))) || null;
      }

      function fallbackRecipe() {
        const supplied = builderIngredients.length ? builderIngredients.slice(0, 4) : ["chickpeas", "lemon", "greens"];
        const first = supplied[0] || "seasonal vegetables";
        const second = supplied[1] || "lemon";
        return normalizeRecipe({
          title: `${first.charAt(0).toUpperCase() + first.slice(1)} with ${second} and herbs`,
          description: `A bright, savory weeknight plate built around ${supplied.join(", ")}.`,
          time: "25 min", difficulty: "Easy", servings: "2", tags: ["profile-matched", "weeknight", "bright"],
          ingredients: supplied.map((item, index) => ({ amount: index === 0 ? "1 can or 2 cups" : "as needed", item })).concat([{ amount: "1 handful", item: "fresh herbs" }, { amount: "1", item: "lemon" }]),
          steps: ["Warm olive oil in a wide pan and cook the heartier ingredients until golden at the edges.", "Add the remaining ingredients with a splash of water, then simmer until tender and glossy.", "Finish with lemon, herbs, black pepper, and a little olive oil."],
          profileNote: `A flexible draft that keeps ${state.profile.likes.slice(0, 2).join(" and ").toLowerCase()} in focus while staying weeknight-friendly.`,
          pairing: "Add something crisp and cold alongside."
        }, `generated-${Date.now()}`, 4);
      }

      function registerGenerated(recipe) {
        state.generatedRecipes = [recipe].concat(state.generatedRecipes.filter((item) => item.id !== recipe.id)).slice(0, 12);
        builderResult = recipe;
        queuePersist();
      }

      async function buildRecipe() {
        if (builderBusy) return;
        builderBusy = true;
        builderError = "";
        builderSources = [];
        render();
        const request = cleanText(builderRequest, 280, "a weeknight dinner");
        const ingredients = builderIngredients.slice(0, 12).map((item) => cleanText(item, 48, "")).filter(Boolean);
        const requestWithDirection = [request, builderOptions.size ? `Direction: ${Array.from(builderOptions).join(", ")}.` : ""].filter(Boolean).join(" ");
        try {
          const response = await callAction("build-recipe", { request: requestWithDirection, ingredients, profile: state.profile });
          const raw = response && response.recipe && typeof response.recipe === "object" ? response.recipe : response && response.output && typeof response.output === "object" ? response.output : null;
          if (!raw) throw new Error("The recipe builder returned no recipe.");
          const recipe = normalizeRecipe(raw, `generated-${Date.now()}`, state.generatedRecipes.length + 1);
          builderSources = Array.isArray(response.sources) ? response.sources : [];
          registerGenerated(recipe);
          hostNotify("A new profile-matched recipe is ready.");
        } catch (error) {
          const recipe = fallbackRecipe();
          registerGenerated(recipe);
          builderResult = recipe;
          builderError = "The live builder wasn’t available, so this local draft keeps your ingredients moving.";
          hostNotify("Live builder unavailable — a local draft is ready.");
        } finally {
          builderBusy = false;
          render();
        }
      }

      function mapPlanEntries(entries) {
        return WEEKDAYS.map((day, index) => {
          const entry = entries.find((item) => normalizeKey(item && item.day) === normalizeKey(day)) || entries[index] || {};
          const match = findRecipeByTitle(entry.recipeTitle);
          return { day, recipeId: match ? match.id : null, title: match ? match.title : cleanText(entry.recipeTitle, 90, defaultPlanner()[index].title), note: cleanText(entry.note, 100, "Profile-matched dinner"), time: cleanText(entry.time, 24, match ? match.time : "30 min") };
        });
      }

      async function buildMealPlan() {
        if (plannerBusy) return;
        plannerBusy = true;
        plannerError = "";
        plannerSources = [];
        render();
        try {
          const response = await callAction("build-meal-plan", { profile: state.profile, candidates: getAllRecipes().slice(0, 12).map((recipe) => recipe.title) });
          const rawPlan = response && response.plan && Array.isArray(response.plan.plan) ? response.plan.plan : response && Array.isArray(response.plan) ? response.plan : null;
          if (!rawPlan || rawPlan.length < 7) throw new Error("The planner returned an incomplete week.");
          state.planner = mapPlanEntries(rawPlan.slice(0, 7));
          plannerSources = Array.isArray(response.sources) ? response.sources : [];
          queuePersist();
          hostNotify("Your profile-shaped week is ready.");
        } catch (error) {
          plannerError = "The live planner wasn’t available, so your current week is still here to edit.";
          state.planner = defaultPlanner();
          hostNotify("Live planner unavailable — your editable week is ready.");
        } finally {
          plannerBusy = false;
          render();
        }
      }

      function saveProfile() {
        if (!profileDraft) return;
        const nameInput = document.getElementById("profile-name-input");
        const notesInput = document.getElementById("profile-notes-input");
        state.profile = sanitizeProfile({ ...profileDraft, name: nameInput ? nameInput.value : profileDraft.name, notes: notesInput ? notesInput.value : profileDraft.notes });
        queuePersist();
        closeModal();
        hostNotify("Flavor profile updated.");
        render();
      }

      document.addEventListener("click", (event) => {
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) {
          event.preventDefault();
          if (viewButton.dataset.builderExample != null) {
            builderRequest = viewButton.dataset.builderExample;
          }
          navigate(viewButton.dataset.view);
          return;
        }
        const profileButton = event.target.closest("[data-profile-open]");
        if (profileButton) { openProfile(); return; }
        const recipeButton = event.target.closest("[data-open-recipe]");
        if (recipeButton) { openRecipe(recipeButton.dataset.openRecipe); return; }
        const saveButton = event.target.closest("[data-save-recipe]");
        if (saveButton) { toggleSaved(saveButton.dataset.saveRecipe); return; }
        const favoriteButton = event.target.closest("[data-favorite-recipe]");
        if (favoriteButton) { toggleFavorite(favoriteButton.dataset.favoriteRecipe); return; }
        const ingredientButton = event.target.closest("[data-discover-ingredient]");
        if (ingredientButton) { discoverQuery = ingredientButton.dataset.discoverIngredient; const input = document.getElementById("discover-search"); if (input) input.value = discoverQuery; renderDiscoverResults(); return; }
        const builderExample = event.target.closest("[data-builder-example]");
        if (builderExample) { builderRequest = builderExample.dataset.builderExample; currentView = "build"; render(); const textarea = document.getElementById("builder-request"); if (textarea) textarea.focus(); return; }
        const builderOption = event.target.closest("[data-builder-option]");
        if (builderOption) { const option = builderOption.dataset.builderOption; if (builderOptions.has(option)) builderOptions.delete(option); else builderOptions.add(option); render(); return; }
        const removeIngredient = event.target.closest("[data-remove-ingredient]");
        if (removeIngredient) { builderIngredients.splice(Number(removeIngredient.dataset.removeIngredient), 1); render(); return; }
        const savedTab = event.target.closest("[data-saved-tab]");
        if (savedTab) { savedFilter = savedTab.dataset.savedTab; render(); return; }
        const generatePlan = event.target.closest("[data-generate-plan]");
        if (generatePlan) { buildMealPlan(); return; }
        const swapOpen = event.target.closest("[data-swap-open]");
        if (swapOpen) { swapDayIndex = Number(swapOpen.dataset.swapOpen); render(); return; }
        const swapClose = event.target.closest("[data-swap-close]");
        if (swapClose) { swapDayIndex = null; render(); return; }
        const swapRecipe = event.target.closest("[data-swap-recipe]");
        if (swapRecipe) { const index = Number(swapRecipe.dataset.swapIndex); const recipe = getRecipe(swapRecipe.dataset.swapRecipe); if (recipe && Number.isInteger(index)) { state.planner[index] = { day: WEEKDAYS[index], recipeId: recipe.id, title: recipe.title, note: "Swapped into your week", time: recipe.time }; queuePersist(); swapDayIndex = null; hostNotify(`${WEEKDAYS[index]} updated.`); render(); } return; }
        const addToWeek = event.target.closest("[data-add-to-week]");
        if (addToWeek) { activeRecipeId = addToWeek.dataset.addToWeek; showDayPicker = true; const recipe = getRecipe(activeRecipeId); if (recipe) renderRecipeModal(recipe); return; }
        const toggleDayPicker = event.target.closest("[data-toggle-day-picker]");
        if (toggleDayPicker && activeRecipeId) { showDayPicker = !showDayPicker; const recipe = getRecipe(activeRecipeId); if (recipe) renderRecipeModal(recipe); return; }
        const planDay = event.target.closest("[data-plan-day]");
        if (planDay && activeRecipeId) { addRecipeToDay(activeRecipeId, Number(planDay.dataset.planDay)); return; }
        const profileLike = event.target.closest("[data-profile-like]");
        if (profileLike && profileDraft) { const choice = profileLike.dataset.profileLike; profileDraft.likes = profileDraft.likes.includes(choice) ? profileDraft.likes.filter((item) => item !== choice) : profileDraft.likes.concat(choice).slice(0, 8); renderProfileModal(); return; }
        const profileAvoid = event.target.closest("[data-profile-avoid]");
        if (profileAvoid && profileDraft) { const choice = profileAvoid.dataset.profileAvoid; profileDraft.avoids = profileDraft.avoids.includes(choice) ? profileDraft.avoids.filter((item) => item !== choice) : profileDraft.avoids.concat(choice).slice(0, 5); renderProfileModal(); return; }
        const profileHeat = event.target.closest("[data-profile-heat]");
        if (profileHeat && profileDraft) { profileDraft.heat = profileHeat.dataset.profileHeat; renderProfileModal(); return; }
        const profileTempo = event.target.closest("[data-profile-tempo]");
        if (profileTempo && profileDraft) { profileDraft.tempo = profileTempo.dataset.profileTempo; renderProfileModal(); return; }
        const saveProfileButton = event.target.closest("[data-save-profile]");
        if (saveProfileButton) { saveProfile(); return; }
        const modalClose = event.target.closest("[data-modal-close]");
        if (modalClose) { closeModal(); return; }
        if (event.target.classList.contains("modal-backdrop")) { closeModal(); }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "discover-search") {
          discoverQuery = event.target.value;
          renderDiscoverResults();
        }
        if (event.target.id === "builder-request") builderRequest = event.target.value;
        if (event.target.matches("[data-profile-field]") && profileDraft) profileDraft[event.target.dataset.profileField] = event.target.value;
        if (event.target.id === "global-search") globalSearch.value = event.target.value;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modalRoot.innerHTML) { closeModal(); return; }
        if (event.key === "Enter" && event.target.id === "global-search") {
          event.preventDefault();
          discoverQuery = globalSearch.value.trim();
          navigate("discover");
        }
        if (event.key === "Enter" && event.target.id === "builder-ingredient-input") {
          event.preventDefault();
          const value = event.target.value.trim();
          if (value) { builderIngredients.push(value.toLowerCase()); event.target.value = ""; render(); const input = document.getElementById("builder-ingredient-input"); if (input) input.focus(); }
        }
      });

      document.addEventListener("submit", (event) => {
        if (event.target.matches("[data-builder-form]")) { event.preventDefault(); buildRecipe(); }
      });

      (async () => {
        renderLoading();
        await loadState();
        render();
      })();
    })();
  </script>
</body>
</html>
